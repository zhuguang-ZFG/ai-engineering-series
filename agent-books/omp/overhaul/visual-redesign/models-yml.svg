<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
<title id="title">自己的供应商写进菜谱。</title><desc id="desc">models.yml 登记供应商；omp models 验货。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#DB582C" stroke-width="1.5"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}.ink{fill:#252923}.muted{fill:#72786C}.accent{fill:#DB582C}.mono{font-family:Consolas,"Liberation Mono",monospace;fill:#252923}.white{fill:#FFFDF7}.line{fill:none;stroke:#252923;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.flow{fill:none;stroke:#DB582C;stroke-width:3;stroke-linecap:round;marker-end:url(#arrow)}.soft{fill:#F0EEE4;stroke:#D6D7C9}.card{fill:#FFFDF7;stroke:#ABB19F;stroke-width:1.5}.hi{fill:#E3EAD9;stroke:#ABB19F;stroke-width:1.5}.warn{fill:#F7E6DC;stroke:#DB582C;stroke-width:1.5}</style>
<rect width="1440" height="960" fill="#FAF7EF"/>
<path d="M72 80 H112" stroke="#DB582C" stroke-width="5" stroke-linecap="round"/>
<text x="132" y="88" class="muted" font-size="20">模型目录</text>

<text x="72" y="171" class="ink" font-size="52">自己的供应商写进菜谱。</text>
<text x="74" y="219" class="muted" font-size="24">YAML 写错可能被跳过——用 omp models 排查。</text>
<rect x="96" y="300" width="620" height="420" rx="14" class="soft"/>
<text x="128" y="360" class="ink" font-size="28">models.yml 片段</text>
<rect x="128" y="390" width="556" height="280" rx="10" fill="#252923"/>
<text x="160" y="450" fill="#E8E5D9" font-family="Consolas,monospace" font-size="24">modelRoles:</text>
<text x="180" y="510" fill="#9BE39B" font-family="Consolas,monospace" font-size="24">default: spark/minimax-m3</text>
<text x="160" y="580" fill="#A8B0A0" font-family="Consolas,monospace" font-size="20"># api: openai-completions …</text>
<path d="M750 510 H840" class="flow"/>
<rect x="860" y="340" width="500" height="340" rx="14" class="hi"/>
<text x="900" y="420" class="ink" font-size="28">验货命令</text>
<text x="900" y="500" class="mono" font-size="24">omp models</text>
<text x="900" y="560" class="mono" font-size="22">omp models find &lt;substr&gt;</text>
<text x="900" y="630" class="muted" font-size="20">确认注册表真吃进了条目</text>

<path d="M72 858 H1368" stroke="#CFD0C4"/>
<text x="72" y="907" class="muted" font-size="20">对应正文 §5 · 定制模型目录</text>
<text x="1100" y="907" class="muted" font-size="18">OMP / 模型</text>
</svg>
