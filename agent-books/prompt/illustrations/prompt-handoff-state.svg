  </g>
  <g fill="#263f35" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
    <text x="39" y="57" font-size="29" font-weight="700">交接单提供入口，文件和回执证明状态</text>
    <text x="62" y="174" font-size="27" font-weight="700">HANDOFF.md</text>
    <text x="62" y="228" font-size="23">目标、权限、版本</text>
    <text x="62" y="275" font-size="23">成果与回执的位置</text>
    <text x="62" y="321" font-size="23">未完成项、下一步</text>
    <text x="398" y="180" font-size="24" font-weight="700">新会话：打开实际文件</text>
    <text x="398" y="216" font-size="21">任务、草稿、检查记录</text>
    <text x="398" y="249" font-size="21">重新读取材料与已有回执</text>
    <text x="523" y="375" text-anchor="middle" font-size="22">核对</text>
    <text x="370" y="352" font-size="22">相符</text>
    <text x="618" y="352" font-size="22" fill="#8b5529">有差异</text>
    <text x="398" y="456" text-anchor="middle" font-size="22">继续未完成项</text>
    <text x="651" y="456" text-anchor="middle" font-size="22" fill="#8b5529">先记录并查明</text>
    <text x="48" y="546" font-size="23" font-weight="700">动作之后中断：沿回执恢复，不重放动作</text>
