<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 720" role="img" aria-label="交接单指向实际文件与回执，新会话先核对；一致才继续，出现差异先查明；已有取消回执不能当成待执行动作" color="#263f35">
  <title>恢复任务时，先核对交接单指向的状态</title>
  <desc>交接单记录目标与权限、材料版本、成果和回执位置以及未完成项。新会话打开实际文件，比较交接记录：一致时继续检查候补说明，有差异时记录并核对。在虚构教学回执 t-02 中，cancel-07 已完成取消 Q07；会话中断后应根据已有回执整理说明，不能因为中断就再取消一次。回执未到且状态未知时，应先查询或保留未知。</desc>
