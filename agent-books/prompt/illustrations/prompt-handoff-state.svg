    <path d="M40 118 L520 114 524 222 Q283 228 38 224 Z"/>
    <path d="M280 228 L280 242 M272 236 L280 246 288 236"/>
    <path d="M40 246 L520 242 524 354 Q283 360 38 356 Z"/>
    <path d="M280 360 L280 374 M272 368 L280 378 288 368"/>
    <path d="M280 378 L334 412 280 446 226 412 Z"/>
    <path d="M240 434 Q210 452 196 466 M196 458 L196 470 184 464" stroke-width="3"/>
    <path d="M320 434 Q350 452 364 466 M356 460 L366 470 368 456" stroke="#a26732" stroke-width="3"/>
    <path d="M30 464 L270 460 274 540 Q152 544 28 540 Z"/>
    <path d="M290 464 L528 460 532 540 Q410 544 288 540 Z" stroke="#a26732"/>
    <path d="M30 562 Q281 558 530 563" stroke-dasharray="4 7" opacity=".45"/>
    <circle cx="44" cy="628" r="8" fill="#f7f1e5"/>
    <circle cx="44" cy="674" r="8" fill="currentColor"/>
    <path d="M44 640 Q43 660 44 668 M38 662 L44 670 50 662" stroke="#a26732" stroke-dasharray="3 5"/>
    <path d="M288 628 Q300 627 314 628 M306 621 L316 628 306 635" stroke-width="3"/>
    <path d="M192 674 Q204 673 218 674 M210 667 L220 674 210 681" stroke-width="3"/>
    <path d="M46 706 L54 716 68 698" stroke-width="3.5"/>
  </g>
  <g fill="#263f35" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
    <text x="30" y="51" font-size="31" font-weight="700">交接单提供入口，</text>
    <text x="30" y="86" font-size="31" font-weight="700">文件和回执证明状态</text>
    <text x="60" y="150" font-size="28" font-weight="700">HANDOFF.md</text>
    <text x="60" y="182" font-size="26">目标、权限、版本　成果与回执的位置</text>
    <text x="60" y="212" font-size="26">未完成项、下一步</text>
    <text x="60" y="278" font-size="27" font-weight="700">新会话：打开实际文件</text>
    <text x="60" y="310" font-size="26">任务、草稿、检查记录</text>
    <text x="60" y="340" font-size="26">重新读取材料与已有回执</text>
    <text x="280" y="421" text-anchor="middle" font-size="28" font-weight="700">核对</text>
    <text x="48" y="496" font-size="26" font-weight="700">相符</text>
    <text x="48" y="526" font-size="26">继续未完成项</text>
    <text x="308" y="496" font-size="26" font-weight="700" fill="#8b5529">有差异</text>
    <text x="308" y="526" font-size="26" fill="#8b5529">先记录并查明</text>
    <text x="30" y="594" font-size="26" font-weight="700">动作之后中断：沿回执恢复，不重放动作</text>
    <text x="64" y="636" font-size="26">cancel-07 已完成</text>
    <text x="326" y="636" font-size="26" fill="#8b5529">会话中断</text>
    <text x="64" y="682" font-size="26">读取 t-02</text>
    <text x="230" y="682" font-size="26">整理说明</text>
    <text x="84" y="722" font-size="27">Q07 已取消；本轮只说明已有结果。</text>
    <text x="30" y="756" font-size="26">教学回执 · 请求已发出但结果未知时，</text>
    <text x="30" y="786" font-size="26">先查询；无法查询就保留未知状态。</text>
  </g>
</svg>
