    <text x="257" y="581" font-size="20" fill="#8b5529">会话中断</text>
    <text x="422" y="581" font-size="20">读取 t-02</text>
    <text x="597" y="581" font-size="20">整理说明</text>
    <text x="54" y="640" font-size="22">Q07 已取消；本轮只说明已有结果。</text>
    <text x="42" y="684" font-size="19">教学回执 · 请求已发出但结果未知时，先查询；无法查询就保留未知状态。</text>
