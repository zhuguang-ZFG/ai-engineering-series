  <g fill="#263f35" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
    <text x="39" y="57" font-size="29" font-weight="700">先冻结条件，再按同题、同次配对</text>
    <text x="379" y="138" text-anchor="middle" font-size="24">题目 · 材料 · 判据 · 环境 · 重复次数</text>
    <text x="296" y="232" text-anchor="middle" font-size="27" font-weight="700">提示 A</text>
    <text x="479" y="232" text-anchor="middle" font-size="27" font-weight="700" fill="#8b5529">提示 B</text>
    <text x="50" y="278" font-size="21" font-weight="700">下面四对仅为教学算例，非模型实测</text>
    <text x="51" y="324" font-size="22">第 1 对</text>
    <text x="51" y="391" font-size="22">第 2 对</text>
    <text x="51" y="458" font-size="22">第 3 对</text>
    <text x="51" y="525" font-size="22">第 4 对</text>
