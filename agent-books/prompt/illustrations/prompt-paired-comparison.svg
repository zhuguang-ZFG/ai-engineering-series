<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 750" role="img" aria-label="先冻结题目材料判据和环境，再把同题同次的 A 与 B 配对；四对假设结果显示两版都三比四，但错误位置不同" color="#263f35">
  <title>总分相同，也要看同题、同次的成对变化</title>
  <desc>先冻结题目、材料、判据、环境和重复次数，只改变提示 A 与 B。下方四对是人工教学算例，不是模型实测。第 1 对和第 2 对两版都通过，第 3 对只有 A 通过，第 4 对只有 B 通过，因此 A 和 B 都是 3/4，通过数净差为零，但错误位置不同。正文真实准备计划为七题、每题重复两次、两版共二十八份请求，模型尚未调用。</desc>
  <path d="M11 13 Q281 5 549 14 L550 743 Q281 749 10 744 Z" fill="#f7f1e5"/>
