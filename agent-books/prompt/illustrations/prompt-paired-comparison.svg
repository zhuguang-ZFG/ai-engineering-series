    <circle cx="296" cy="450" r="21" fill="#f7f1e5"/>
    <circle cx="479" cy="450" r="21" fill="#f7f1e5" stroke="#a26732"/>
    <circle cx="296" cy="517" r="21" fill="#f7f1e5" stroke="#a26732"/>
