    <path d="M120 334 Q280 331 440 334 M120 396 Q280 399 440 396 M120 458 Q280 455 440 458" stroke-dasharray="3 7" opacity=".55"/>
    <circle cx="190" cy="302" r="17" fill="#f7f1e5"/>
    <circle cx="320" cy="302" r="17" fill="#f7f1e5"/>
    <circle cx="190" cy="364" r="17" fill="#f7f1e5"/>
    <circle cx="320" cy="364" r="17" fill="#f7f1e5"/>
    <circle cx="190" cy="426" r="17" fill="#f7f1e5"/>
    <circle cx="320" cy="426" r="17" fill="#f7f1e5" stroke="#a26732"/>
    <circle cx="190" cy="488" r="17" fill="#f7f1e5" stroke="#a26732"/>
    <circle cx="320" cy="488" r="17" fill="#f7f1e5"/>
    <path d="M181 301 L188 308 200 294 M311 301 L318 308 330 294 M181 363 L188 370 200 356 M311 363 L318 370 330 356 M181 425 L188 432 200 418 M311 487 L318 494 330 480" stroke-width="3"/>
    <path d="M312 418 L328 434 M328 418 L312 434 M182 480 L198 496 M198 480 L182 496" stroke="#a26732" stroke-width="3"/>
    <path d="M150 520 Q190 528 230 520 M280 520 Q320 528 360 520"/>
    <path d="M40 636 Q281 632 520 637" opacity=".4"/>
  </g>
  <g fill="#263f35" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
    <text x="30" y="51" font-size="31" font-weight="700">先冻结条件，再按同题、同次配对</text>
    <text x="280" y="132" text-anchor="middle" font-size="26">题目 · 材料 · 判据 · 环境 · 重复次数</text>
    <text x="190" y="228" text-anchor="middle" font-size="27" font-weight="700">提示 A</text>
    <text x="320" y="228" text-anchor="middle" font-size="27" font-weight="700" fill="#8b5529">提示 B</text>
    <text x="40" y="272" font-size="26" font-weight="700">下面四对仅为教学算例，非模型实测</text>
    <text x="40" y="311" font-size="26">第 1 对</text>
    <text x="40" y="373" font-size="26">第 2 对</text>
    <text x="40" y="435" font-size="26">第 3 对</text>
    <text x="40" y="497" font-size="26">第 4 对</text>
    <text x="360" y="311" font-size="26">共同通过</text>
    <text x="360" y="373" font-size="26">共同通过</text>
    <text x="360" y="435" font-size="26" fill="#8b5529">只有 A 通过</text>
    <text x="360" y="497" font-size="26" fill="#8b5529">只有 B 通过</text>
    <text x="190" y="562" text-anchor="middle" font-size="30" font-weight="700">3/4</text>
    <text x="320" y="562" text-anchor="middle" font-size="30" font-weight="700">3/4</text>
    <text x="280" y="606" text-anchor="middle" font-size="26">净差为 0；错误位置却发生了交换。</text>
    <text x="40" y="666" font-size="26">正文计划：7 题 × 2 次 = 14 对，</text>
    <text x="40" y="696" font-size="26">共 28 份请求。准备输入不等于得到成绩；</text>
    <text x="40" y="726" font-size="26">新册模型 A/B 对照尚未运行。</text>
  </g>
</svg>
