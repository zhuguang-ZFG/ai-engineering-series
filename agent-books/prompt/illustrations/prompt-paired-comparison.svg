    <text x="590" y="391" font-size="21">共同通过</text>
    <text x="590" y="458" font-size="21" fill="#8b5529">只有 A 通过</text>
    <text x="590" y="525" font-size="21" fill="#8b5529">只有 B 通过</text>
    <text x="296" y="582" text-anchor="middle" font-size="30" font-weight="700">3/4</text>
    <text x="479" y="582" text-anchor="middle" font-size="30" font-weight="700">3/4</text>
    <text x="379" y="637" text-anchor="middle" font-size="25">净差为 0；错误位置却发生了交换。</text>
    <text x="42" y="692" font-size="20">正文计划：7 题 × 2 次 = 14 对，共 28 份请求。</text>
    <text x="42" y="719" font-size="19">准备输入不等于得到成绩；新册模型 A/B 对照尚未运行。</text>
