<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 710" role="img" aria-label="按字段组合有效材料：正式修订替换时间，原通知保留其他安排，规则补充候补和递补" color="#263f35">
  <title>最新文件只替换它明确修订的字段</title>
