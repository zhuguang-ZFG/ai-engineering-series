<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 750" role="img" aria-label="开发题用于修改提示，冻结提示和评分标准后比较验证题，方案确定后才使用隔离的留出题" color="#263f35">
  <title>三组题，三个使用时机</title>
  <desc>青禾教学题库的三道开发题用于看题、试错和修改提示。冻结候选提示与评分标准后，用七道验证题比较两版；正文计划每版每题各运行两次，共二十八份请求，尚非模型实测结果。方案确定后才使用两道留出题，此前应在宿主中限制待测模型对额外文件的访问。仅将材料放在另一个目录不构成权限隔离，已经看过留出题的人也需登记暴露。</desc>
