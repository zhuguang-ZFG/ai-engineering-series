    <path d="M39 320 Q279 315 521 321 L520 415 Q281 420 38 415 Z"/>
    <path d="M48 328 Q281 323 512 329" opacity=".18"/>
    <path d="M280 422 Q282 429 280 438 M272 429 L280 440 288 429"/>
    <path d="M280 479 Q278 486 280 496 M272 487 L280 498 288 487"/>
    <path d="M39 513 Q279 507 521 513 L521 673 Q280 679 38 673 Z" fill="#f0e6d7" stroke="#a26732" stroke-dasharray="9 7"/>
    <path d="M54 562 Q282 557 507 563" stroke="#a26732" opacity=".4"/>
    <path d="M99 717 Q280 721 461 717" stroke="#a26732" opacity=".5"/>
  </g>
  <g fill="#263f35" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
    <text x="38" y="52" font-size="31" font-weight="700">三组题，三个使用时机</text>
    <text x="60" y="132" font-size="30" font-weight="700">开发题 · 3 题</text>
    <text x="60" y="169" font-size="27">看题、试错、修改提示</text>
    <text x="148" y="260" font-size="28" font-weight="700">冻结提示与评分标准</text>
    <text x="60" y="361" font-size="30" font-weight="700">验证题 · 7 题</text>
    <text x="60" y="399" font-size="27">按同一标准比较两版</text>
    <text x="280" y="470" text-anchor="middle" font-size="27">确定采用的方案</text>
    <text x="60" y="550" font-size="30" font-weight="700" fill="#8b5529">留出题 · 2 题</text>
    <text x="60" y="602" font-size="27">方案确定后，才用于检验</text>
    <text x="60" y="645" font-size="26">此前须在宿主限制文件访问</text>
    <text x="280" y="714" text-anchor="middle" font-size="27" fill="#8b5529">换个目录 ≠ 限制访问</text>
  </g>
