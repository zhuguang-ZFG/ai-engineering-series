  </g>
  <g fill="#263f35" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
    <text x="30" y="51" font-size="31" font-weight="700">先看执行到哪一步</text>
    <text x="109" y="126" font-size="31" font-weight="700">核对项目，再启动</text>
    <text x="109" y="168" font-size="28" fill="#8b5529">invalid_project</text>
    <text x="109" y="206" font-size="29">未启动，没有业务分数</text>
    <text x="109" y="280" font-size="31" font-weight="700">运行检查，等待报告</text>
    <text x="109" y="321" font-size="28" fill="#8b5529">执行故障 / timeout</text>
    <text x="109" y="359" font-size="29">没有报告，不能记作 0/12</text>
    <text x="110" y="445" font-size="31" font-weight="700">真实报告：8/12</text>
    <text x="110" y="496" font-size="28" fill="#8b5529">business_failed</text>
    <text x="110" y="530" font-size="27">退出码 1：发现业务不符合</text>
    <text x="402" y="558" font-size="26">8 通过</text>
    <text x="402" y="591" font-size="26" fill="#8b5529">4 失败</text>
    <text x="30" y="660" font-size="27">本章故障副本的离线实测</text>
