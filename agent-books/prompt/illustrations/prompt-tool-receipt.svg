    <path d="M99 316 L79 316 79 348 97 348 M88 340 L98 348 88 356" stroke="#a26732"/>
    <path d="M60 383 Q66 395 102 396 L448 393 481 421 479 604 Q283 610 85 605 L84 413"/>
    <path d="M448 395 L448 423 478 423"/>
    <path d="M109 462 Q282 459 452 462" opacity=".3"/>
    <path d="M112 549 L122 560 140 538 M151 549 L161 560 179 538 M191 549 L201 560 219 538 M231 549 L241 560 259 538" stroke-width="3"/>
    <path d="M112 581 L122 592 140 570 M151 581 L161 592 179 570 M191 581 L201 592 219 570 M231 581 L241 592 259 570" stroke-width="3"/>
    <path d="M319 543 L335 559 M335 543 L319 559 M359 543 L375 559 M375 543 L359 559 M319 575 L335 591 M335 575 L319 591 M359 575 L375 591 M375 575 L359 591" stroke="#a26732" stroke-width="3"/>
