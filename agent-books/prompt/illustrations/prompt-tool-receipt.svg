<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 700" role="img" aria-label="沿真实执行过程判断失败：缺项目时尚未启动，运行超时没有业务分数，获得报告后才有八比十二的业务失败" color="#263f35">
  <title>沿实际执行过程读回执，不能把不同失败都写成零分</title>
  <desc>本章离线练习先检查项目，再启动 Python 子进程，最后读取合格的业务报告。invalid_project 表示未启动。execution_failed 表示启动或解释执行失败，timeout 表示等待超时后终止；这些都不能编造业务分数。初始故障副本真实运行后得到 business_failed，八个用例通过、四个失败，共十二例，子进程退出码为一。这是程序检查结果，没有模型参与。完整状态还包括通过和执行期间输入变化，详见正文表格。</desc>
  <path d="M11 13 Q281 5 549 14 L550 693 Q281 699 10 694 Z" fill="#f7f1e5"/>
