<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>原书手绘图解 · Vibe Coding 101</title><style>
*{box-sizing:border-box}body{margin:0;background:#fbfaf6;color:#1f2328;font:18px/1.8 "Microsoft YaHei",sans-serif}main{max-width:1060px;margin:auto;padding:32px 24px}h1{font-size:32px;line-height:1.4}a{color:#B4472F;text-underline-offset:4px}a:focus-visible{outline:3px solid #B4472F;outline-offset:4px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:48px 32px;margin-top:32px}figure{margin:0;min-width:0}img{display:block;width:100%;height:auto;max-width:480px;margin:auto}figcaption{padding-top:12px;border-top:1px solid #e6e1d4;font-size:16px;color:#57606a}.grid a{display:block;cursor:zoom-in}@media(max-width:650px){main{padding:20px 16px}.grid{grid-template-columns:1fr;gap:32px}}
</style></head><body><main><p><a href="../../开始阅读.html">返回原书</a></p><h1>Vibe Coding 101 · 手绘图解</h1><p>沿箭头看顺序，沿绿色看当前路径。点击插图，可查看原尺寸。</p><div class="grid"><figure><a href="../../book/assets/handdraw/learn-path.svg" aria-label="打开大图：八步，做出第一个作品"><img src="../../book/assets/handdraw/learn-path.svg" width="480" height="640" alt="八个步骤按蛇形路径排列：找问题、筛方向、看需求、做访谈、收敛方案、做原型、接 AI 能力、打磨交付。反馈可以使流程回到前面的步骤。" loading="lazy"></a><figcaption>八步，做出第一个作品</figcaption></figure><figure><a href="../../book/assets/handdraw/error-flow.svg" aria-label="打开大图：排错，把猜测变成证据"><img src="../../book/assets/handdraw/error-flow.svg" width="480" height="640" alt="四步排错：复现、收集证据、最小修改、复测。复测通过则保留修改，失败则撤回并返回收集证据，不把 AI 的建议直接当作结论。" loading="lazy"></a><figcaption>排错，把猜测变成证据</figcaption></figure><figure><a href="../../book/assets/handdraw/db-index.svg" aria-label="打开大图：索引，先缩小查找范围"><img src="../../book/assets/handdraw/db-index.svg" width="480" height="640" alt="上半图八条记录依次扫描，编号 6 被标出。下半图用分隔键 3、5、7 指向四组叶子，绿色路径选择 5、6，再定位 6。形状只示意访问路径，不承诺性能。" loading="lazy"></a><figcaption>索引，先缩小查找范围</figcaption></figure><figure><a href="../../book/assets/handdraw/deploy.svg" aria-label="打开大图：上线，要走到真实设备"><img src="../../book/assets/handdraw/deploy.svg" width="480" height="640" alt="电脑上的代码经过提交推送、平台构建检查、版本部署，再在另一台手机上验收。底部区分代码回滚和数据恢复；失败先看日志，数据恢复需查迁移与备份。" loading="lazy"></a><figcaption>上线，要走到真实设备</figcaption></figure><figure><a href="../../book/assets/handdraw/web-framework.svg" aria-label="打开大图：架构，先看部署的边界"><img src="../../book/assets/handdraw/web-framework.svg" width="480" height="640" alt="单体将三个模块放在一个部署边界内；服务将订单与库存分开放置并通过网络通信；函数由事件触发并访问数据。三种方式可以并存。" loading="lazy"></a><figcaption>架构，先看部署的边界</figcaption></figure><figure><a href="../../book/assets/handdraw/git-history.svg" aria-label="打开大图：Git，给修改留一条来路"><img src="../../book/assets/handdraw/git-history.svg" width="480" height="640" alt="文件修改经过 add 进入暂存区，经 commit 保存为提交。A 分出 B、C，D 合并两条历史；main 指向 D，feature 指向 C。push 从本地到远程，fetch 从远程到本地。" loading="lazy"></a><figcaption>Git，给修改留一条来路</figcaption></figure><figure><a href="../../book/assets/handdraw/funnel.svg" aria-label="打开大图：筛方向，先给点子找证据"><img src="../../book/assets/handdraw/funnel.svg" width="480" height="640" alt="想法经过三个逐层收窄的筛选：真实发生的经历、已有投入、相对现有做法的差异与切换代价。最后选择一两个方向做实验，图形宽度不是数量或转化率。" loading="lazy"></a><figcaption>筛方向，先给点子找证据</figcaption></figure><figure><a href="../../book/assets/handdraw/jtbd.svg" aria-label="打开大图：先问清，用户要完成什么"><img src="../../book/assets/handdraw/jtbd.svg" width="480" height="640" alt="具体情境是一场会议结束，信息零散。中心画出会后行动清单的任务、责任人和截止时间。期望结果是明确谁何时完成什么，现有做法是靠回忆、翻录音与逐个追问。" loading="lazy"></a><figcaption>先问清，用户要完成什么</figcaption></figure></div></main></body></html>
