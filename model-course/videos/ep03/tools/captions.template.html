<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    #cap-stage {
      position: absolute;
      left: 0;
      top: 896px;
      width: 1920px;
      text-align: center;
      overflow: visible;
    }
    .cap-group {
      position: absolute;
      left: 0;
      width: 1920px;
      text-align: center;
      font-family: "Noto Sans JP", sans-serif;
      font-weight: 700;
      font-size: 46px;
      line-height: 1.35;
      color: #ffffff;
      visibility: hidden;
    }
    .cap-group span {
      background: rgba(31, 35, 40, 0.78);
      border-radius: 8px;
      padding: 10px 26px;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }
  </style>
  <div data-hf-id="hf-jn2k" id="root" data-composition-id="captions" data-width="1920" data-height="1080">
    <div data-hf-id="hf-fhg2" id="cap-stage"></div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    const GROUPS = __DATA__;
    const stage = document.getElementById("cap-stage");
    GROUPS.forEach((g, i) => {
      const div = document.createElement("div");
      div.className = "cap-group";
      div.id = "cap-" + i;
      const inner = document.createElement("span");
      inner.textContent = g.text;
      div.appendChild(inner);
      stage.appendChild(div);
      // Cues ride on a slide, never an opacity fade: a fade dims the pill too,
      // so any frame caught mid-fade measures below the WCAG floor.
      gsap.set(div, { y: 8, visibility: "hidden" });
      const start = Math.max(g.start, 0.1);
      const end = Math.max(g.end, start + 0.3);
      tl.set(div, { visibility: "visible", y: 8 }, start);
      tl.to(div, { y: 0, duration: 0.12, ease: "power2.out" }, start);
      tl.set(div, { visibility: "hidden" }, end);
    });
    window.__timelines["captions"] = tl;
  </script>
</template>
