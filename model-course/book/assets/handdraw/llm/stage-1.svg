<svg xmlns="http://www.w3.org/2000/svg" width="480" height="640" viewBox="0 0 480 640" role="img" aria-labelledby="title desc"><title id="title">S1 · 会使用</title><desc id="desc">三张错开的纸页代表材料、报告与核对；朱砂勾只落在能回到原句的一格上，虚线箭头表示回到原文。</desc><rect width="480" height="640" fill="#f7f2e7"/><pattern id="grain" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="3" r=".8" fill="#26221B" opacity=".16"/><circle cx="14" cy="15" r=".7" fill="#26221B" opacity=".12"/></pattern><rect width="480" height="640" fill="url(#grain)" opacity=".28"/><rect x="26" y="26" width="428" height="588" fill="none" stroke="#26221B" stroke-width="1" opacity=".22"/><path d="M20 52 V20 H52 M428 20 H460 V52 M20 588 V620 H52 M428 620 H460 V588" fill="none" stroke="#26221B" stroke-width="1.6" opacity=".5"/><g><text x="46" y="118" font-family="'Noto Serif SC','Songti SC','SimSun',serif" font-size="112" font-weight="600" fill="none" stroke="#26221B" stroke-width="1.7" letter-spacing="2">01</text><text x="432" y="74" font-family="'Noto Serif SC','Songti SC','SimSun',serif" font-size="13" font-weight="500" fill="#6b6457" text-anchor="end" letter-spacing="3">STAGE 01</text><text x="432" y="96" font-family="ui-monospace,monospace" font-size="13" font-weight="500" fill="#6b6457" text-anchor="end" letter-spacing="2">K1</text><path d="M44 150 L436 150" fill="none" stroke="#26221B" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 6"/><g transform="translate(0 0) rotate(0 200 260)"><rect x="112" y="186" width="224" height="188" rx="6" fill="#e8ddc7" stroke="#26221B" stroke-width="1.8" opacity="0.66"/></g><g transform="translate(18 26) rotate(1.4 200 260)"><rect x="112" y="186" width="224" height="188" rx="6" fill="#e8ddc7" stroke="#26221B" stroke-width="1.8" opacity="0.8300000000000001"/></g><g transform="translate(36 52) rotate(2.8 200 260)"><rect x="112" y="186" width="224" height="188" rx="6" fill="#fdfaf1" stroke="#26221B" stroke-width="1.8" opacity="1"/><path d="M140 244 L300 244" fill="none" stroke="#26221B" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="1 7"/><path d="M140 274 L278 274" fill="none" stroke="#26221B" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="1 7"/><path d="M140 304 L256 304" fill="none" stroke="#26221B" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="1 7"/></g><path d="M148 258 q34 10 58 -2" fill="none" stroke="#26221B" stroke-width="10" stroke-linecap="round" opacity=".55"/><path d="M300 296 l16 17 l34 -44" fill="none" stroke="#26221B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M348 356 q34 36 2 72 q-30 34 -98 18" fill="none" stroke="#26221B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"/><path d="M258 442 l-10 6 l12 5" fill="none" stroke="#26221B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M50 390 L50 492" fill="none" stroke="#26221B" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 6"/><text x="58" y="410" font-family="'Noto Serif SC','Songti SC','SimSun',serif" font-size="17" font-weight="400" fill="#6b6457" text-anchor="start" letter-spacing="1">原文</text><text x="58" y="446" font-family="'Noto Serif SC','Songti SC','SimSun',serif" font-size="17" font-weight="400" fill="#6b6457" text-anchor="start" letter-spacing="1">报告</text><text x="58" y="482" font-family="'Noto Serif SC','Songti SC','SimSun',serif" font-size="17" font-weight="400" fill="#6b6457" text-anchor="start" letter-spacing="1">核对</text><text x="58" y="530" font-family="'Noto Serif SC','Songti SC','SimSun',serif" font-size="18" font-weight="500" fill="#26221B" text-anchor="start">每一格都能回到原句</text><text x="58" y="558" font-family="'Noto Serif SC','Songti SC','SimSun',serif" font-size="16" font-weight="400" fill="#6b6457" text-anchor="start">找不到，就写未知</text><text x="44" y="596" font-family="'Noto Serif SC','Songti SC','SimSun',serif" font-size="15" font-weight="400" fill="#6b6457" text-anchor="start" letter-spacing="2"