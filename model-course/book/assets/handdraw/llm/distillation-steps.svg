<svg xmlns="http://www.w3.org/2000/svg" width="480" height="990" viewBox="0 0 480 990" role="img" aria-labelledby="g51-title g51-desc"><title id="g51-title">教师不动，学生改一步</title><desc id="g51-desc">1．让两个分布对齐：教师与学生都用温度 2，候选顺序同为水、茶、咖啡。教师给“水” 54.65%，学生起步给每项 33.33%；先对齐，才能逐项比较。 2．算差距，也算调整方向：训练同时使用软目标和已核实的硬标签“水”：软项为 0.7 × T² × KL，硬项为 0.3 × CE。混合损失是 0.7378，对学生三个 logits 的梯度为 [-0.4985, 0.1026, 0.3959]。下一步按梯度的反方向更新，不是把教师的参数抄过来。 3．沿反方向更新学生：按“新分数 = 旧分数 − 学习率 × 梯度”，学生从 [0, 0, 0] 变为 [0.1994, -0.0410, -0.1584]。学习率是 0.4；教师的 [3, 2, 0] 保持不变。 4．再算一次，检查有没有变好：仍用温度 2，学生给水、茶、咖啡的概率变为 36.73%、32.57%、30.71%，教师三项仍是 54.65%、33.15%、12.20%。用更新后的学生分数重算同一道题，混合损失从 0.7378 降到 0.5827。这里只能说明这次更新改善了当前训练目标；教师可能出错，学生在新题上的表现仍要单独测。</desc><rect width="480" height="990" fill="#FFFDF8"/><g font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif"><text x="24" y="39" font-size="30" text-anchor="start" fill="#26221B">教师不动，学生改一步</text><path d="M26 57 Q240 61 454 56" stroke="#B4472F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" /><g transform="translate(0 72)"><circle cx="43" cy="20" r="18" fill="#F3EAD8" stroke="#26221B" stroke-width="2.5"/><text x="43" y="29" font-size="24" text-anchor="middle" fill="#26221B">1</text><text x="74" y="29" font-size="27" text-anchor="start" fill="#26221B">让两个分布对齐</text><g transform="translate(0 49)"><text x="80" y="27" font-size="27" text-anchor="middle" fill="#26221B">教师</text><text x="338" y="27" font-size="27" text-anchor="middle" fill="#26221B">学生</text><text x="10" y="70" font-size="24" text-anchor="start" fill="#26221B">水</text><path d="M70 48 Q99.79296323597077 45 132.58592647194155 50 L130.58592647194155 73 Q99.79296323597077 75 67 71Z" stroke="#26221B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="#F3EAD8" /><text x="238" y="69" font-size="24" text-anchor="end" fill="#26221B">54.65%</text><text x="266" y="70" font-size="24" text-anchor="start" fill="#26221B">水</text><path d="M327 48 Q344 45 364 50 L362 73 Q344 75 324 71Z" stroke="#26221B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="#F3EAD8" /><text x="478" y="69" font-size="24" text-anchor="end" fill="#26221B">33.33%</text><text x="10" y="112" font-size="24" text-anchor="start" fill="#26221B">茶</text><path d="M70 90 Q86.8899376254455 87 106.77987525089098 92 L104.77987525089098 115 Q86.8899376254455 117 67 113Z" stroke="#26221B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="#F3EAD8" /><text x="238" y="111" font-size="24" text-anchor="end" fill="#26221B">33.15%</text><text x="266" y="112" font-size="24" text-anchor="start" fill="#26221B">茶</text><path d="M327 90 Q344 87 364 92 L362 115 Q344 117 324 113Z" stroke="#26221B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="#F3EAD8" /><text x="478" y="111" font-size="24" text-anchor="end" fill="#26221B">33.33%</text><text x="10" y="154" font-size="24" text-anchor="start" fill="#26221B">咖啡</text><path d="M70 132 Q74.31709913858373 129 81.63419827716746 134 L79.63419827716746 157 Q74.31709913858373 159 67 155Z" stroke="#26221B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="#F3EAD8" /><text x="238" y="153" font-size="24" text-anchor="end" fill="#26221B">12.20%</text><text x="266" y="154" font-size="24" text-anchor="start" fill="#26221B">咖啡</text><path d="M327 132 Q344 129 364 134 L362 157 Q344 159 324 155Z" stroke="#26221B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="#F3EAD8" /><text x="478" y="153" font-size="24" text-anchor="end" fill="#26221B">33.33%</text></g><path d="M27 222 L452 222" stroke="#E3D8C1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" /></g><g transform="translate(0 300)"><circle cx="43" cy="20" r="18" fill="#F3EAD8" stroke="#26221B" stroke-width="2.5"/><text x="43" y="29" font-size="24" text-anchor="middle" fill="#26221B">2</text><text x="74" y="29" font-size="27" text-anchor="start" fill="#26221B">算差距，也算调整方向</text><g transform="translate(0 49)"><text x="30" y="32" font-size="27" text-anchor="start" fill="#26221B">先算差多少，再算往哪边调</text><text x="30" y="88" font-size="25" text-anchor="start" fill="#26221B">梯度（水、茶、咖啡）：</text><text x="30" y="141" font-size="28" text-anchor="start" fill="#26221B">[-0.4985, 0.1026, 0.3959]</text></g><path d="M27 222 L452 222" stroke="#E3D8C1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" /></g><g transform="translate(0 528)"><circle cx="43" cy="20" r="18" fill="#F3EAD8" stroke="#26221B" stroke-width="2.5"/><text x="43" y="29" font-size="24" text-anchor="middle" fill="#26221B">3</text><text x="74" y="29" font-size="27" text-anchor="start" fill="#26221B">沿反方向更新学生</text><g transform="translate(0 49)"><text x="30" y="35" font-size="27" text-anchor="start" fill="#26221B">水</text><text x="119" y="35" font-size="29" text-anchor="start" fill="#26221B">0</text><path d="M158 26 Q196.5 23 227 26" stroke="#B4472F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" class="mechanism-flow"/><path d="M217 18 L227 26 L217 34" stroke="#B4472F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" /><g class="mechanism-change"><text x="251" y="35" font-size="29" text-anchor="start" fill="#26221B">0.1994</text></g><text x="30" y="90" font-size="27" text-anchor="start" fill="#26221B">茶</text><text x="119" y="90" font-size="29" text-anchor="start" fill="#26221B">0</text><path d="M158 81 Q196.5 78 227 81" stroke="#B4472F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" class="mechanism-flow"/><path d="M217 73 L227 81 L217 89" stroke="#B4472F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" /><g class="mechanism-change"><text x="251" y="90" font-size="29" text-anchor="start" fill="#26221B">-0.0410</text></g><text x="30" y="145" font-size="27" text-anchor="start" fill="#26221B">咖啡</text><text x="119" y="145" font-size="29" text-anchor="start" fill="#26221B">0</text><path d="M158 136 Q196.5 133 227 136" stroke="#B4472F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" class="mechanism-flow"/><path d="M217 128 L227 136 L217 144" stroke="#B4472F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" /><g class="mechanism-change"><text x="251" y="145" font-size="29" text-anchor="start" fill="#26221B">-0.1584</text></g></g><path d="M27 222 L452 222" stroke="#E3D8C1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" /></g><g transform="translate(0 756)"><circle cx="43" cy="20" r="18" fill="#F3EAD8" stroke="#26221B" stroke-width="2.5"/><text x="43" y="29" font-size="24" text-anchor="middle" fill="#26221B">4</text><text x="74" y="29" font-size="27" text-anchor="start" fill="#26221B">再算一次，检查有没有变好</text><g transform="translate(0 49)"><text x="80" y="27" font-size="27" text-anchor="middle" fill="#26221B">教师</text><text x="338" y="27" font-size="27" text-anchor="middle" fill="#26221B">学生</text><text x="10" y="70" font-size="24" text-anchor="start" fill="#26221B">水</text><path d="M70 48 Q99.79296323597077 45 132.58592647194155 50 L130.58592647194155 73 Q99.79296323597077 75 67 71Z" stroke="#26221B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="#F3EAD8" /><text x="238" y="69" font-size="24" text-anchor="end" fill="#26221B">54.65%</text><g class="mechanism-change"><text x="266" y="70" font-size="24" text-anchor="start" fill="#26221B">水</text><path d="M327 48 Q346.03508211451464 45 368.0701642290293 50 L366.0701642290293 73 Q346.03508211451464 75 324 71Z" stroke="#26221B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="#F3EAD8" /><text x="478" y="69" font-size="24" text-anchor="end" fill="#26221B">36.73%</text></g><text x="10" y="112" font-size="24" text-anchor="start" fill="#26221B">茶</text><path d="M70 90 Q86.8899376254455 87 106.77987525089098 92 L104.77987525089098 115 Q86.8899376254455 117 67 113Z" stroke="#26221B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="#F3EAD8" /><text x="238" y="111" font-size="24" text-anchor="end" fill="#26221B">33.15%</text><g class="mechanism-change"><text x="266" y="112" font-size="24" text-anchor="start" fill="#26221B">茶</text><path d="M327 90 Q343.5391804842996 87 363.07836096859927 92 L361.07836096859927 115 Q343.5391804842996 117 324 113Z" stroke="#26221B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="#F3EAD8" /><text x="478" y="111" font-size="24" text-anchor="end" fill="#26221B">32.57%</text></g><text x="10" y="154" font-size="24" text-anchor="start" fill="#26221B">咖啡</text><path d="M70 132 Q74.31709913858373 129 81.63419827716746 134 L79.63419827716746 157 Q74.31709913858373 159 67 155Z" stroke="#26221B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="#F3EAD8" /><text x="238" y="153" font-size="24" text-anchor="end" fill="#26221B">12.20%</text><g class="mechanism-change"><text x="266" y="154" font-size="24" text-anchor="start" fill="#26221B">咖啡</text><path d="M327 132 Q342.4257374011857 129 360.85147480237146 134 L358.85147480237146 157 Q342.4257374011857 159 324 155Z" stroke="#26221B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="#F3EAD8" /><text x="478" y="153" font-size="24" text-anchor="end" fill="#26221B">30.71%</text></g></g></g></g></svg>
