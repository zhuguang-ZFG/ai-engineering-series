<svg xmlns="http://www.w3.org/2000/svg" width="480" height="700" viewBox="0 0 480 700" role="img" aria-labelledby="title desc"><title id="title">报告里的八种状态</title><desc id="desc">状态回答“停在哪一步”，不回答“答案对不对”。八种状态各有自己的不能推出项：answered 只说明每条主张都能回查，citation-failed 只说明逐字关系不成立。</desc><g font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif" fill="#26221B"><text x="26" y="42" font-size="26" text-anchor="start" fill="#26221B" font-weight="600">报告里的八种状态</text><path d="M26 56Q140 53 250 56" fill="none" stroke="#B4472F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M26 80H454" fill="none" stroke="#E3D8C1" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="26" y="104" font-size="19" text-anchor="start" fill="#B4472F" font-weight="600">answered</text><text x="26" y="130" font-size="16" text-anchor="start" fill="#5C5448" font-weight="400">每条主张都有可回查来源</text><text x="454" y="130" font-size="16" text-anchor="end" fill="#5C5448" font-weight="400">不等于每个字都对</text><path d="M26 148H454" fill="none" stroke="#E3D8C1" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="26" y="172" font-size="19" text-anchor="start" fill="#26221B" font-weight="600">insufficient-evidence</text><text x="26" y="198" font-size="16" text-anchor="start" fill="#5C5448" font-weight="400">材料没有覆盖问题</text><text x="454" y="198" font-size="16" text-anchor="end" fill="#5C5448" font-weight="400">不是“模型不知道”</text><path d="M26 216H454" fill="none" stroke="#E3D8C1" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="26" y="240" font-size="19" text-anchor="start" fill="#26221B" font-weight="600">conflict</text><text x="26" y="266" font-size="16" text-anchor="start" fill="#5C5448" font-weight="400">可见材料互相矛盾</text><text x="454" y="266" font-size="16" text-anchor="end" fill="#5C5448" font-weight="400">不能悄悄选一个</text><path d="M26 284H454" fill="none" stroke="#E3D8C1" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="26" y="308" font-size="19" text-anchor="start" fill="#26221B" font-weight="600">unauthorized</text><text x="26" y="334" font-size="16" text-anchor="start" fill="#5C5448" font-weight="400">读者无权读该文档</text><text x="454" y="334" font-size="16" text-anchor="end" fill="#5C5448" font-weight="400">正文没进提示与日志</text><path d="M26 352H454" fill="none" stroke="#E3D8C1" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="26" y="376" font-size="19" text-anchor="start" fill="#26221B" font-weight="600">missing-source</text><text x="26" y="402" font-size="16" text-anchor="start" fill="#5C5448" font-weight="400">文件缺失或版本不符</text><text x="454" y="402" font-size="16" text-anchor="end" fill="#5C5448" font-weight="400">不能拿缓存顶上</text><path d="M26 420H454" fill="none" stroke="#E3D8C1" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="26" y="444" font-size="19" text-anchor="start" fill="#26221B" font-weight="600">invalid-response</text><text x="26" y="470" font-size="16" text-anchor="start" fill="#5C5448" font-weight="400">结构无法解析</text><text x="454" y="470" font-size="16" text-anchor="end" fill="#5C5448" font-weight="400">要保留首次原始响应</text><path d="M26 488H454" fill="none" stroke="#E3D8C1" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="26" y="512" font-size="19" text-anchor="start" fill="#26221B" font-weight="600">citation-failed</text><text x="26" y="538" font-size="16" text-anchor="start" fill="#5C5448" font-weight="400">逐字关系不成立</text><text x="454" y="538" font-size="16" text-anchor="end" fill="#5C5448" font-weight="400">改写只能进人工复核</text><path d="M26 556H454" fill="none" stroke="#E3D8C1" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="26" y="580" font-size="19" text-anchor="start" fill="#26221B" font-weight="600">model-unavailable</text><text x="26" y="606" font-size="16" text-anchor="start" fill="#5C5448" font-weight="400">模型没加载或不可达</text><text x="454" y="606" font-size="16" text-anchor="end" fill="#5C5448" font-weight="400">健康检查可能仍返回 200</text><path d="M26 656H454" fill="none" stroke="#E3D8C1" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="26" y="686" font-size="18" text-anchor="start" fill="#B4472F" font-weight="400">先看 status，再看 diagnostics.first_failure</text></g></svg>
