<svg xmlns="http://www.w3.org/2000/svg" width="480" height="640" viewBox="0 0 480 640" role="img" aria-labelledby="title desc"><title id="title">留一封没拆过的题</title><desc id="desc">开发题带修改回环，验证题用于方案选择，最后一封测试题保持封口。三种用途分开，不展示虚构成绩。</desc><defs><pattern id="figure-grain" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="3" r=".7" fill="#1f2328" opacity=".16"/><circle cx="12" cy="13" r=".55" fill="#1f2328" opacity=".11"/></pattern></defs><rect width="480" height="640" fill="#fbfaf6"/><rect width="480" height="640" fill="url(#figure-grain)" opacity=".34"/><rect x="9" y="9" width="462" height="622" fill="none" stroke="#1f2328" stroke-width=".8" opacity=".22"/><path d="M9 30 V9 H30 M450 9 H471 V30 M9 610 V631 H30 M450 631 H471 V610" fill="none" stroke="#1f2328" stroke-width="1.2" opacity=".38"/><g font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif"><text x="27" y="48" font-size="30" fill="#1f2328" text-anchor="start">留一封没拆过的题</text><path d="M28 67 Q232 61 451 66" stroke="#B4472F" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="31" y="111" font-size="28" fill="#1f2328" text-anchor="start">开发：找错再改</text><path d="M34 132 L182 130 L204 152 L202 244 L36 243Z M182 130 L182 153 L204 152" stroke="#1f2328" stroke-width="2.5" fill="#fffdf8" stroke-linecap="round" stroke-linejoin="round"/><path d="M55 164 L172 164" stroke="#57606a" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M55 189 L150 189" stroke="#57606a" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M70 217 L106 197 L127 214" stroke="#B4472F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M217 173 Q272 163 265 216 Q258 257 215 236" stroke="#B4472F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M228 232 L215 236 L222 250" stroke="#B4472F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="30" y="299" font-size="28" fill="#1f2328" text-anchor="start">验证：比较方案</text><path d="M34 319 L182 317 L204 339 L202 405 L36 404Z M182 317 L182 340 L204 339" stroke="#1f2328" stroke-width="2.5" fill="#f0e9d8" stroke-linecap="round" stroke-linejoin="round"/><text x="119" y="371" font-size="31" fill="#1f2328" text-anchor="middle">A / B</text><path d="M225 361 Q298.5 358 366 361" stroke="#B4472F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M356.62223025734545 366.7495595182373 L366 361 L356.62223025734545 355.2504404817627" stroke="#B4472F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="402" cy="361" r="25" fill="#f0e9d8" stroke="#1f2328" stroke-width="2.7"/><path d="M389 364 l9 10 l20 -26" stroke="#B4472F" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M30 431 L449 431" stroke="#e6e1d4" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="30" y="473" font-size="28" fill="#1f2328" text-anchor="start">测试：最后才拆封</text><path d="M66 495 L414 495 L414 557 L66 557Z M66 495 L240 540 L414 495" stroke="#1f2328" stroke-width="2.7" fill="#f0e9d8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="240" cy="536" r="17" fill="#fffdf8" stroke="#1f2328" stroke-width="2.7"/><path d="M232 537 L248 537" stroke="#57606a" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M28 572 L451 572" stroke="#e6e1d4" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="28" y="591" font-size="24" fill="#57606a" text-anchor="start">反复看过再修改，就不算未见。</text><text x="28" y="627" font-size="24" fill="#57606a" text-anchor="start">没招募读者，不填试读成绩。</text></g></svg>
