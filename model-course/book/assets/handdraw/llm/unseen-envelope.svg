<svg xmlns="http://www.w3.org/2000/svg" width="480" height="640" viewBox="0 0 480 640" role="img" aria-labelledby="title desc"><title id="title">留一封没拆过的题</title><desc id="desc">开发题带修改回环，验证题用于方案选择，最后一封测试题保持封口。三种用途分开，不展示虚构成绩。</desc><g font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif"><text x="27" y="48" font-size="30" fill="#26221B" text-anchor="start">留一封没拆过的题</text><path d="M 28 67 Q 232 64.78 451 66" stroke="#B4472F" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="31" y="111" font-size="28" fill="#26221B" text-anchor="start">开发：找错再改</text><path d="M 34 132 Q 108.02 132.8 182 130 L 204 152 Q 201.4 197.96 202 244 Q 118.98 245.36 36 243 Z M 182 130 L 182 153 L 204 152" stroke="#26221B" stroke-width="2.5" fill="#fffdf8" stroke-linecap="round" stroke-linejoin="round"/><path d="M 55 164 Q 113.5 161.96 172 164" stroke="#5C5448" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M 55 189 Q 102.5 190.62 150 189" stroke="#5C5448" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M70 217 L106 197 L127 214" stroke="#B4472F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M217 173 Q272 163 265 216 Q258 257 215 236" stroke="#B4472F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M228 232 L215 236 L222 250" stroke="#B4472F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="30" y="299" font-size="28" fill="#26221B" text-anchor="start">验证：比较方案</text><path d="M 34 319 Q 107.98 315.9 182 317 L 204 339 Q 203.94 372.02 202 405 Q 119 403.52 36 404 Z M 182 317 L 182 340 L 204 339" stroke="#26221B" stroke-width="2.5" fill="#F3EAD8" stroke-linecap="round" stroke-linejoin="round"/><text x="119" y="371" font-size="31" fill="#26221B" text-anchor="middle">A / B</text><path d="M 225 361 Q 298.5 360.1 366 361" stroke="#B4472F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M356.62223025734545 366.7495595182373 L366 361 L356.62223025734545 355.2504404817627" stroke="#B4472F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="402" cy="361" r="25" fill="#F3EAD8" stroke="#26221B" stroke-width="2.7"/><path d="M389 364 l9 10 l20 -26" stroke="#B4472F" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M 30 431 Q 239.5 432.36 449 431" stroke="#E3D8C1" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="30" y="473" font-size="28" fill="#26221B" text-anchor="start">测试：最后才拆封</text><path d="M 66 495 Q 240 496.5 414 495 Q 412.08 526 414 557 Q 240 558.7 66 557 Z M 66 495 Q 152.6 519.04 240 540 Q 326.66 516.18 414 495" stroke="#26221B" stroke-width="2.7" fill="#F3EAD8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="240" cy="536" r="17" fill="#fffdf8" stroke="#26221B" stroke-width="2.7"/><path d="M232 537 L248 537" stroke="#5C5448" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M 28 572 Q 239.5 573.6 451 572" stroke="#E3D8C1" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="28" y="591" font-size="24" fill="#5C5448" text-anchor="start">反复看过再修改，就不算未见。</text><text x="28" y="627" font-size="24" fill="#5C5448" text-anchor="start">没招募读者，不填试读成绩。</text></g></svg>
