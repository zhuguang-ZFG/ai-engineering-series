<svg xmlns="http://www.w3.org/2000/svg" width="480" height="640" viewBox="0 0 480 640" role="img" aria-labelledby="title desc"><title id="title">桌面满了，先腾地方</title><desc id="desc">有限工作台上摆任务条件和相关资料，右侧虚线区域预留给回答；无关段落被移出，没有填满所有空间。</desc><g font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif"><text x="27" y="48" font-size="30" fill="#1f2328" text-anchor="start">桌面满了，先腾地方</text><path d="M28 67 Q232 61 451 66" stroke="#B4472F" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="30" y="111" font-size="27" fill="#1f2328" text-anchor="start">本次输入能放的内容有限</text><path d="M31 227 L449 227 L449 468 L32 468Z" stroke="#1f2328" stroke-width="3" fill="#fffdf8" stroke-linecap="round" stroke-linejoin="round"/><path d="M49 258 L133 256 L155 278 L153 409 L51 408Z M133 256 L133 279 L155 278" stroke="#1f2328" stroke-width="2.5" fill="#f0e9d8" stroke-linecap="round" stroke-linejoin="round"/><text x="102" y="307" font-size="27" fill="#1f2328" text-anchor="middle">任务</text><text x="102" y="347" font-size="27" fill="#1f2328" text-anchor="middle">条件</text><path d="M173 248 L268 246 L290 268 L288 426 L175 425Z M268 246 L268 269 L290 268" stroke="#1f2328" stroke-width="2.5" fill="#f0e9d8" stroke-linecap="round" stroke-linejoin="round"/><text x="231" y="303" font-size="27" fill="#1f2328" text-anchor="middle">相关</text><text x="231" y="343" font-size="27" fill="#1f2328" text-anchor="middle">资料</text><path d="M309 246 L429 246 L429 446 L309 446Z" stroke="#57606a" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"/><text x="369" y="307" font-size="26" fill="#1f2328" text-anchor="middle">留给</text><text x="369" y="347" font-size="26" fill="#1f2328" text-anchor="middle">回答</text><path d="M83 134 L187 132 L209 154 L207 206 L85 205Z M187 132 L187 155 L209 154" stroke="#1f2328" stroke-width="2.5" fill="#e6e1d4" stroke-linecap="round" stroke-linejoin="round"/><text x="146" y="176" font-size="24" fill="#1f2328" text-anchor="middle">无关段落</text><path d="M215 167 Q262.5 164 304 167" stroke="#B4472F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M294.62223025734545 172.74955951823725 L304 167 L294.62223025734545 161.25044048176275" stroke="#B4472F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M321 144 l48 48 M321 192 l48 -48" stroke="#B4472F" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="31" y="518" font-size="27" fill="#1f2328" text-anchor="start">留什么：由当前问题决定</text><path d="M29 540 Q163.8 535 366 539" stroke="#B4472F" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M28 572 L451 572" stroke="#e6e1d4" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="28" y="591" font-size="24" fill="#57606a" text-anchor="start">材料超长，要挑相关内容。</text><text x="28" y="627" font-size="24" fill="#57606a" text-anchor="start">别把决定答案的条件删掉。</text></g></svg>
