<svg xmlns="http://www.w3.org/2000/svg" width="480" height="640" viewBox="0 0 480 640" role="img" aria-labelledby="title desc"><title id="title">残差：保留一路，再相加</title><desc id="desc">一种pre-norm块。输入x先分出旁路，再归一化并经过因果多头注意力，输出与x相加得到h。h再分出旁路，经归一化与逐位置前馈后，与h相加得到块输出。位置机制依架构接入，本图未展开。</desc><g font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif"><text x="28" y="43" font-size="30" text-anchor="start" fill="#26221B">残差：保留一路，再相加</text><path d="M 28 59 Q 132 57.92 226 59" fill="none" stroke="#B4472F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="28" y="96" font-size="25" text-anchor="start" fill="#26221B">一种 pre-norm 块 · 先归一化</text><text x="311" y="132" font-size="27" text-anchor="middle" fill="#26221B">输入 x</text><path d="M 311 147 Q 208 148.58 105 147 Q 106.64 228.5 105 310 Q 197.5 311.36 290 310 M 282 304 L 290 310 L 282 316" fill="none" stroke="#26221B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M311 145 Q309.5 153 311 161 M305 153 L311 161 L317 153" fill="none" stroke="#B4472F" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M 174 173 Q 251.6 170.9 448 172 L 446.5 210 Q 343.44 210.86 173 208.4 Q 173.6 190 174 173 Z" fill="#F3EAD8" stroke="#26221B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="311" y="199" font-size="26" text-anchor="middle" fill="#26221B">归一化</text><path d="M311 216 Q309.5 225.5 311 235 M305 227 L311 235 L317 227" fill="none" stroke="#B4472F" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M 174 247 Q 251.6 245.5 448 246 L 446.5 284 Q 343.44 285.5 173 282.4 Q 173.6 264 174 247 Z" fill="#F3EAD8" stroke="#26221B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="311" y="273" font-size="26" text-anchor="middle" fill="#26221B">因果多头注意力</text><path d="M311 286 Q309.5 289 311 292 M305 284 L311 292 L317 284" fill="none" stroke="#B4472F" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="311" cy="310" r="17" fill="#FFFDF8" stroke="#26221B" stroke-width="2.5"/><path d="M304 310 H318 M311 303 V317" fill="none" stroke="#26221B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="30" y="231" font-size="25" text-anchor="start" fill="#26221B">保留 x</text><path d="M311 329 Q309.5 347.5 311 366 M305 358 L311 366 L317 358" fill="none" stroke="#B4472F" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><text x="350" y="353" font-size="27" text-anchor="start" fill="#26221B">h</text><path d="M 311 344 Q 208 342.9 105 344 Q 106.24 430.5 105 517 Q 197.5 515.42 290 517 M 282 511 L 290 517 L 282 523" fill="none" stroke="#26221B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M 174 378 Q 251.6 375.66 448 377 L 446.5 415 Q 343.44 416.06 173 413.4 Q 173.6 395 174 378 Z" fill="#F3EAD8" stroke="#26221B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="311" y="404" font-size="26" text-anchor="middle" fill="#26221B">归一化</text><path d="M311 420 Q309.5 429.5 311 439 M305 431 L311 439 L317 431" fill="none" stroke="#B4472F" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M 174 451 Q 251.6 448.66 448 450 L 446.5 488 Q 343.44 488.34 173 486.4 Q 173.6 468 174 451 Z" fill="#F3EAD8" stroke="#26221B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="311" y="477" font-size="26" text-anchor="middle" fill="#26221B">逐位置前馈</text><path d="M311 490 Q309.5 494.5 311 499 M305 491 L311 499 L317 491" fill="none" stroke="#B4472F" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="311" cy="517" r="17" fill="#FFFDF8" stroke="#26221B" stroke-width="2.5"/><path d="M304 517 H318 M311 510 V524" fill="none" stroke="#26221B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="30" y="436" font-size="25" text-anchor="start" fill="#26221B">保留 h</text><path d="M311 537 Q309.5 543.5 311 550 M305 542 L311 550 L317 542" fill="none" stroke="#B4472F" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><text x="311" y="576" font-size="27" text-anchor="middle" fill="#26221B">块输出</text><text x="28" y="618" font-size="24" text-anchor="start" fill="#26221B">旁路带回的是子层输入的向量</text><path d="M 28 583 Q 240 581.22 452 583" fill="none" stroke="#E3D8C1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g></svg>
