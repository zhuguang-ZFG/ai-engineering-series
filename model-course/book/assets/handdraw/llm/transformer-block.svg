<svg xmlns="http://www.w3.org/2000/svg" width="480" height="640" viewBox="0 0 480 640" role="img" aria-labelledby="title desc"><title id="title">残差：保留一路，再相加</title><desc id="desc">一种pre-norm块。输入x先分出旁路，再归一化并经过因果多头注意力，输出与x相加得到h。h再分出旁路，经归一化与逐位置前馈后，与h相加得到块输出。位置机制依架构接入，本图未展开。</desc><defs><pattern id="figure-grain" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="3" r=".7" fill="#1f2328" opacity=".16"/><circle cx="12" cy="13" r=".55" fill="#1f2328" opacity=".11"/></pattern></defs><rect width="480" height="640" fill="#fbfaf6"/><rect width="480" height="640" fill="url(#figure-grain)" opacity=".34"/><rect x="9" y="9" width="462" height="622" fill="none" stroke="#1f2328" stroke-width=".8" opacity=".22"/><path d="M9 30 V9 H30 M450 9 H471 V30 M9 610 V631 H30 M450 631 H471 V610" fill="none" stroke="#1f2328" stroke-width="1.2" opacity=".38"/><g font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif"><text x="28" y="43" font-size="30" text-anchor="start" fill="#1f2328">残差：保留一路，再相加</text><path d="M28 59 Q132 55 226 59" fill="none" stroke="#B4472F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="28" y="96" font-size="25" text-anchor="start" fill="#1f2328">一种 pre-norm 块 · 先归一化</text><text x="311" y="132" font-size="27" text-anchor="middle" fill="#1f2328">输入 x</text><path d="M311 147 H105 V310 H290 M282 304 L290 310 L282 316" fill="none" stroke="#1f2328" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M311 145 Q309.5 153 311 161 M305 153 L311 161 L317 153" fill="none" stroke="#B4472F" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M179 172 Q311 169 446 173 L445 208 Q311 211 176 207Z" fill="#f0e9d8" stroke="#1f2328" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="311" y="199" font-size="26" text-anchor="middle" fill="#1f2328">归一化</text><path d="M311 216 Q309.5 225.5 311 235 M305 227 L311 235 L317 227" fill="none" stroke="#B4472F" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M179 246 Q311 243 446 247 L445 282 Q311 285 176 281Z" fill="#f0e9d8" stroke="#1f2328" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="311" y="273" font-size="26" text-anchor="middle" fill="#1f2328">因果多头注意力</text><path d="M311 286 Q309.5 289 311 292 M305 284 L311 292 L317 284" fill="none" stroke="#B4472F" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="311" cy="310" r="17" fill="#fbfaf6" stroke="#1f2328" stroke-width="2.5"/><path d="M304 310 H318 M311 303 V317" fill="none" stroke="#1f2328" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="30" y="231" font-size="25" text-anchor="start" fill="#1f2328">保留 x</text><path d="M311 329 Q309.5 347.5 311 366 M305 358 L311 366 L317 358" fill="none" stroke="#B4472F" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><text x="350" y="353" font-size="27" text-anchor="start" fill="#1f2328">h</text><path d="M311 344 H105 V517 H290 M282 511 L290 517 L282 523" fill="none" stroke="#1f2328" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M179 377 Q311 374 446 378 L445 413 Q311 416 176 412Z" fill="#f0e9d8" stroke="#1f2328" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="311" y="404" font-size="26" text-anchor="middle" fill="#1f2328">归一化</text><path d="M311 420 Q309.5 429.5 311 439 M305 431 L311 439 L317 431" fill="none" stroke="#B4472F" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M179 450 Q311 447 446 451 L445 486 Q311 489 176 485Z" fill="#f0e9d8" stroke="#1f2328" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="311" y="477" font-size="26" text-anchor="middle" fill="#1f2328">逐位置前馈</text><path d="M311 490 Q309.5 494.5 311 499 M305 491 L311 499 L317 491" fill="none" stroke="#B4472F" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="311" cy="517" r="17" fill="#fbfaf6" stroke="#1f2328" stroke-width="2.5"/><path d="M304 517 H318 M311 510 V524" fill="none" stroke="#1f2328" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="30" y="436" font-size="25" text-anchor="start" fill="#1f2328">保留 h</text><path d="M311 537 Q309.5 543.5 311 550 M305 542 L311 550 L317 542" fill="none" stroke="#B4472F" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><text x="311" y="576" font-size="27" text-anchor="middle" fill="#1f2328">块输出</text><text x="28" y="618" font-size="24" text-anchor="start" fill="#1f2328">旁路带回的是子层输入的向量</text><path d="M28 583 Q240 581 452 583" fill="none" stroke="#e6e1d4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g></svg>
