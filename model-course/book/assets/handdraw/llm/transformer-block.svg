<svg xmlns="http://www.w3.org/2000/svg" width="480" height="640" viewBox="0 0 480 640" role="img" aria-labelledby="title desc"><title id="title">残差：保留一路，再相加</title><desc id="desc">一种pre-norm块。输入x先分出旁路，再归一化并经过因果多头注意力，输出与x相加得到h。h再分出旁路，经归一化与逐位置前馈后，与h相加得到块输出。位置机制依架构接入，本图未展开。</desc><g font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif"><text x="28" y="43" font-size="30" text-anchor="start" fill="#1f2328">残差：保留一路，再相加</text><path d="M28 59 Q132 55 226 59" fill="none" stroke="#B4472F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="28" y="96" font-size="25" text-anchor="start" fill="#1f2328">一种 pre-norm 块 · 先归一化</text><text x="311" y="132" font-size="27" text-anchor="middle" fill="#1f2328">输入 x</text><path d="M311 147 H105 V310 H290 M282 304 L290 310 L282 316" fill="none" stroke="#1f2328" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M311 145 Q309.5 153 311 161 M305 153 L311 161 L317 153" fill="none" stroke="#B4472F" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M174 173 Q251.60000000000002 168.6 448 172 L446.5 210 Q343.4 211.6 173 208.4 Q173.6 190 174 173Z" fill="#f0e9d8" stroke="#1f2328" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="311" y="199" font-size="26" text-anchor="middle" fill="#1f2328">归一化</text><path d="M311 216 Q309.5 225.5 311 235 M305 227 L311 235 L317 227" fill="none" stroke="#B4472F" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M174 247 Q251.60000000000002 242.6 448 246 L446.5 284 Q343.4 285.6 173 282.4 Q173.6 264 174 247Z" fill="#f0e9d8" stroke="#1f2328" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="311" y="273" font-size="26" text-anchor="middle" fill="#1f2328">因果多头注意力</text><path d="M311 286 Q309.5 289 311 292 M305 284 L311 292 L317 284" fill="none" stroke="#B4472F" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="311" cy="310" r="17" fill="#fbfaf6" stroke="#1f2328" stroke-width="2.5"/><path d="M304 310 H318 M311 303 V317" fill="none" stroke="#1f2328" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="30" y="231" font-size="25" text-anchor="start" fill="#1f2328">保留 x</text><path d="M311 329 Q309.5 347.5 311 366 M305 358 L311 366 L317 358" fill="none" stroke="#B4472F" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><text x="350" y="353" font-size="27" text-anchor="start" fill="#1f2328">h</text><path d="M311 344 H105 V517 H290 M282 511 L290 517 L282 523" fill="none" stroke="#1f2328" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M174 378 Q251.60000000000002 373.6 448 377 L446.5 415 Q343.4 416.6 173 413.4 Q173.6 395 174 378Z" fill="#f0e9d8" stroke="#1f2328" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="311" y="404" font-size="26" text-anchor="middle" fill="#1f2328">归一化</text><path d="M311 420 Q309.5 429.5 311 439 M305 431 L311 439 L317 431" fill="none" stroke="#B4472F" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M174 451 Q251.60000000000002 446.6 448 450 L446.5 488 Q343.4 489.6 173 486.4 Q173.6 468 174 451Z" fill="#f0e9d8" stroke="#1f2328" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="311" y="477" font-size="26" text-anchor="middle" fill="#1f2328">逐位置前馈</text><path d="M311 490 Q309.5 494.5 311 499 M305 491 L311 499 L317 491" fill="none" stroke="#B4472F" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="311" cy="517" r="17" fill="#fbfaf6" stroke="#1f2328" stroke-width="2.5"/><path d="M304 517 H318 M311 510 V524" fill="none" stroke="#1f2328" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="30" y="436" font-size="25" text-anchor="start" fill="#1f2328">保留 h</text><path d="M311 537 Q309.5 543.5 311 550 M305 542 L311 550 L317 542" fill="none" stroke="#B4472F" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><text x="311" y="576" font-size="27" text-anchor="middle" fill="#1f2328">块输出</text><text x="28" y="618" font-size="24" text-anchor="start" fill="#1f2328">旁路带回的是子层输入的向量</text><path d="M28 583 Q240 581 452 583" fill="none" stroke="#e6e1d4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g></svg>
