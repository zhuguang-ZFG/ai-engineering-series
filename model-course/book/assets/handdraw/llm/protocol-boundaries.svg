<svg xmlns="http://www.w3.org/2000/svg" width="480" height="740" viewBox="0 0 480 740" role="img" aria-labelledby="title desc">
  <title id="title">协议连接了谁</title><desc id="desc">MCP 客户端在宿主内连接工具和资料服务；A2A 客户端委托远端 Agent 服务并接收任务状态和产物。两者都不代替授权和结果核验。</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#26221B" stroke-width="1.5"/></marker></defs>
  
  <g font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif" fill="#26221B" font-size="26">
    <text x="28" y="46" font-size="30" font-weight="700">接通之后，还要核验</text>
    <path d="M 30 70 Q 240 69.66 448 72" stroke="#B4472F" fill="none" stroke-width="3"/>
    <text x="28" y="116">MCP：连接工具与资料服务</text>
    <path d="M 32 139 Q 240.48 135.76 449 137 Q 450.62 179.52 448 222 Q 239 224.56 30 224 Z" fill="none" stroke="#26221B" stroke-width="2.5"/>
    <text x="48" y="176">宿主应用里的 Client</text><text x="48" y="209">版本 / 能力 / 本次授权</text>
    <path d="M240 233 Q237 250 240 267" fill="none" stroke="#26221B" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M 32 282 Q 240.5 279.4 449 280 Q 447.5 321.98 448 364 Q 239 366.62 30 366 Z" fill="#F3EAD8" stroke="#26221B" stroke-width="2.5"/>
    <text x="48" y="319">Server：工具 / 资源 / 提示</text><text x="48" y="353">有结果，也可能是执行错误</text>
    <text x="28" y="415">A2A：委托远端 Agent 服务</text>
    <path d="M 32 439 Q 240.5 436.62 449 437 Q 447.56 479.98 448 523 Q 239 522.68 30 525 Z" fill="none" stroke="#26221B" stroke-width="2.5"/>
    <text x="48" y="475">客户端 → 远端 Agent</text><text x="48" y="510">按名片与接口发送消息</text>
    <path d="M240 535 Q243 550 240 567" fill="none" stroke="#26221B" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M 32 582 Q 240.5 582.24 449 580 Q 450.72 621.02 448 662 Q 239 665.04 30 664 Z" fill="#F3EAD8" stroke="#26221B" stroke-width="2.5"/>
    <text x="48" y="617">任务状态 / 产物 / 失败原因</text><text x="48" y="650">完成状态之后仍核对内容</text>
    <text x="28" y="711">协议兼容 ≠ 权限齐全 ≠ 正确</text>
  </g>
</svg>
