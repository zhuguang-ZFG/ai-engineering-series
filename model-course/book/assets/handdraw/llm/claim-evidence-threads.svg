<svg xmlns="http://www.w3.org/2000/svg" width="480" height="640" viewBox="0 0 480 640" role="img" aria-labelledby="title desc"><title id="title">一句答案，拆开查账</title><desc id="desc">答案拆成时间、地点、报名三个主张；通知A支持时间和报名，但地点的证据连线断开，不能用同一引用担保地点。</desc><g font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif"><text x="27" y="48" font-size="30" fill="#1f2328" text-anchor="start">一句答案，拆开查账</text><path d="M28 67 Q232 61 451 66" stroke="#B4472F" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M28 104 Q147.60000000000002 99.4 452 103 L450.6 175 Q290.4 176.8 27 173.4 Q27.6 138 28 104Z" stroke="#1f2328" stroke-width="2.5" fill="#f0e9d8" stroke-linecap="round" stroke-linejoin="round"/><text x="240" y="147" font-size="28" fill="#1f2328" text-anchor="middle">时间、地点、报名要求</text><circle cx="77" cy="235" r="34" fill="#fffdf8" stroke="#1f2328" stroke-width="2.7"/><text x="77" y="245" font-size="26" fill="#1f2328" text-anchor="middle">时间</text><path d="M124 235 Q203 232 276 235" stroke="#B4472F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M266.62223025734545 240.74955951823725 L276 235 L266.62223025734545 229.25044048176275" stroke="#B4472F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M300 199 L425 197 L447 219 L445 277 L302 276Z M425 197 L425 220 L447 219" stroke="#1f2328" stroke-width="2.5" fill="#f0e9d8" stroke-linecap="round" stroke-linejoin="round"/><text x="373" y="245" font-size="24" fill="#1f2328" text-anchor="middle">通知 A</text><path d="M242 235 l9 10 l20 -26" stroke="#B4472F" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="77" cy="348" r="34" fill="#fffdf8" stroke="#1f2328" stroke-width="2.7"/><text x="77" y="358" font-size="26" fill="#1f2328" text-anchor="middle">地点</text><path d="M124 348 Q203 345 276 348" stroke="#B4472F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M266.62223025734545 353.7495595182373 L276 348 L266.62223025734545 342.2504404817627" stroke="#B4472F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M300 312 L425 310 L447 332 L445 390 L302 389Z M425 310 L425 333 L447 332" stroke="#1f2328" stroke-width="2.5" fill="#fffdf8" stroke-linecap="round" stroke-linejoin="round"/><text x="373" y="358" font-size="24" fill="#1f2328" text-anchor="middle">未给材料</text><path d="M232 336 l24 24 M232 360 l24 -24" stroke="#B4472F" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="77" cy="461" r="34" fill="#fffdf8" stroke="#1f2328" stroke-width="2.7"/><text x="77" y="471" font-size="26" fill="#1f2328" text-anchor="middle">报名</text><path d="M124 461 Q203 458 276 461" stroke="#B4472F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M266.62223025734545 466.7495595182373 L276 461 L266.62223025734545 455.2504404817627" stroke="#B4472F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M300 425 L425 423 L447 445 L445 503 L302 502Z M425 423 L425 446 L447 445" stroke="#1f2328" stroke-width="2.5" fill="#f0e9d8" stroke-linecap="round" stroke-linejoin="round"/><text x="373" y="471" font-size="24" fill="#1f2328" text-anchor="middle">通知 A</text><path d="M242 461 l9 10 l20 -26" stroke="#B4472F" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="30" y="555" font-size="27" fill="#1f2328" text-anchor="start">同一句话，可以部分有据。</text><path d="M28 572 L451 572" stroke="#e6e1d4" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="28" y="591" font-size="24" fill="#57606a" text-anchor="start">引用要支持具体那条主张。</text><text x="28" y="627" font-size="24" fill="#57606a" text-anchor="start">贴一个来源，不能担保整句话。</text></g></svg>
