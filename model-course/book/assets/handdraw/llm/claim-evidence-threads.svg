<svg xmlns="http://www.w3.org/2000/svg" width="480" height="640" viewBox="0 0 480 640" role="img" aria-labelledby="title desc"><title id="title">一句答案，拆开查账</title><desc id="desc">答案拆成时间、地点、报名三个主张；通知A支持时间和报名，但地点的证据连线断开，不能用同一引用担保地点。</desc><g font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif"><text x="27" y="48" font-size="30" fill="#26221B" text-anchor="start">一句答案，拆开查账</text><path d="M 28 67 Q 232 64.78 451 66" stroke="#B4472F" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M 28 104 Q 147.6 102.5 452 103 Q 449.16 138.96 450.6 175 Q 290.4 175.92 27 173.4 Q 29.38 138.02 28 104 Z" stroke="#26221B" stroke-width="2.5" fill="#F3EAD8" stroke-linecap="round" stroke-linejoin="round"/><text x="240" y="147" font-size="28" fill="#26221B" text-anchor="middle">时间、地点、报名要求</text><circle cx="77" cy="235" r="34" fill="#fffdf8" stroke="#26221B" stroke-width="2.7"/><text x="77" y="245" font-size="26" fill="#26221B" text-anchor="middle">时间</text><path d="M 124 235 Q 203 233.8 276 235" stroke="#B4472F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M266.62223025734545 240.74955951823725 L276 235 L266.62223025734545 229.25044048176275" stroke="#B4472F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M 300 199 Q 362.46 195.96 425 197 L 447 219 L 445 277 Q 373.52 274.56 302 276 Z M 425 197 L 425 220 L 447 219" stroke="#26221B" stroke-width="2.5" fill="#F3EAD8" stroke-linecap="round" stroke-linejoin="round"/><text x="373" y="245" font-size="24" fill="#26221B" text-anchor="middle">通知 A</text><path d="M242 235 l9 10 l20 -26" stroke="#B4472F" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="77" cy="348" r="34" fill="#fffdf8" stroke="#26221B" stroke-width="2.7"/><text x="77" y="358" font-size="26" fill="#26221B" text-anchor="middle">地点</text><path d="M 124 348 Q 203 345.74 276 348" stroke="#B4472F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M266.62223025734545 353.7495595182373 L276 348 L266.62223025734545 342.2504404817627" stroke="#B4472F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M 300 312 Q 362.52 312.24 425 310 L 447 332 L 445 390 Q 373.5 388.54 302 389 Z M 425 310 L 425 333 L 447 332" stroke="#26221B" stroke-width="2.5" fill="#fffdf8" stroke-linecap="round" stroke-linejoin="round"/><text x="373" y="358" font-size="24" fill="#26221B" text-anchor="middle">未给材料</text><path d="M232 336 l24 24 M232 360 l24 -24" stroke="#B4472F" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="77" cy="461" r="34" fill="#fffdf8" stroke="#26221B" stroke-width="2.7"/><text x="77" y="471" font-size="26" fill="#26221B" text-anchor="middle">报名</text><path d="M 124 461 Q 203 458.8 276 461" stroke="#B4472F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M266.62223025734545 466.7495595182373 L276 461 L266.62223025734545 455.2504404817627" stroke="#B4472F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M 300 425 Q 362.54 426.28 425 423 L 447 445 L 445 503 Q 373.5 503.64 302 502 Z M 425 423 L 425 446 L 447 445" stroke="#26221B" stroke-width="2.5" fill="#F3EAD8" stroke-linecap="round" stroke-linejoin="round"/><text x="373" y="471" font-size="24" fill="#26221B" text-anchor="middle">通知 A</text><path d="M242 461 l9 10 l20 -26" stroke="#B4472F" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="30" y="555" font-size="27" fill="#26221B" text-anchor="start">同一句话，可以部分有据。</text><path d="M 28 572 Q 239.5 573.6 451 572" stroke="#E3D8C1" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="28" y="591" font-size="24" fill="#5C5448" text-anchor="start">引用要支持具体那条主张。</text><text x="28" y="627" font-size="24" fill="#5C5448" text-anchor="start">贴一个来源，不能担保整句话。</text></g></svg>
