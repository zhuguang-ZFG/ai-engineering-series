<svg xmlns="http://www.w3.org/2000/svg" width="480" height="640" viewBox="0 0 480 640" role="img" aria-labelledby="title desc"><title id="title">把一份资料做成答案</title><desc id="desc">虚构社区修理课通知提供周日10点、邻里工坊与提前报名，三个主张各有依据后形成答案；未提供的信息保留未知。</desc><g font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif"><text x="27" y="48" font-size="30" fill="#26221B" text-anchor="start">把一份资料做成答案</text><path d="M 28 67 Q 232 64.78 451 66" stroke="#B4472F" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M 32 104 Q 228 103.94 424 102 L 446 124 Q 446.08 181.52 444 239 Q 239 240.08 34 238 Z M 424 102 L 424 125 L 446 124" stroke="#26221B" stroke-width="2.5" fill="#fffdf8" stroke-linecap="round" stroke-linejoin="round"/><text x="55" y="140" font-size="27" fill="#26221B" text-anchor="start">社区修理课 · 原通知</text><text x="55" y="178" font-size="27" fill="#26221B" text-anchor="start">周日 10:00 / 邻里工坊</text><text x="55" y="216" font-size="26" fill="#26221B" text-anchor="start">参加前要报名</text><path d="M240 254 Q243 267 240 286" stroke="#B4472F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M234.25044048176275 276.62223025734545 L240 286 L245.74955951823725 276.62223025734545" stroke="#B4472F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="87" cy="337" r="37" fill="#F3EAD8" stroke="#26221B" stroke-width="2.7"/><text x="87" y="347" font-size="26" fill="#26221B" text-anchor="middle">时间</text><path d="M109 308 l9 10 l20 -26" stroke="#B4472F" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="240" cy="337" r="37" fill="#F3EAD8" stroke="#26221B" stroke-width="2.7"/><text x="240" y="347" font-size="26" fill="#26221B" text-anchor="middle">地点</text><path d="M262 308 l9 10 l20 -26" stroke="#B4472F" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="393" cy="337" r="37" fill="#F3EAD8" stroke="#26221B" stroke-width="2.7"/><text x="393" y="347" font-size="26" fill="#26221B" text-anchor="middle">报名</text><path d="M415 308 l9 10 l20 -26" stroke="#B4472F" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M240 390 Q243 402.5 240 421" stroke="#B4472F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M234.25044048176275 411.62223025734545 L240 421 L245.74955951823725 411.62223025734545" stroke="#B4472F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M 45 441 Q 240 440.04 435 441 Q 437.1 493.5 435 546 Q 240 544.92 45 546 Z" stroke="#26221B" stroke-width="2.7" fill="#fffdf8" stroke-linecap="round" stroke-linejoin="round"/><text x="65" y="478" font-size="26" fill="#26221B" text-anchor="start">答案：三项逐条有依据</text><text x="65" y="519" font-size="26" fill="#26221B" text-anchor="start">材料没说的：写未知</text><path d="M 28 572 Q 239.5 573.6 451 572" stroke="#E3D8C1" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="28" y="591" font-size="24" fill="#5C5448" text-anchor="start">先整理证据，再组织回答。</text><text x="28" y="627" font-size="24" fill="#5C5448" text-anchor="start">交付时把缺项也一起交代。</text></g></svg>
