<svg xmlns="http://www.w3.org/2000/svg" width="480" height="640" viewBox="0 0 480 640" role="img" aria-labelledby="title desc"><title id="title">把一份资料做成答案</title><desc id="desc">虚构社区修理课通知提供周日10点、邻里工坊与提前报名，三个主张各有依据后形成答案；未提供的信息保留未知。</desc><defs><pattern id="figure-grain" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="3" r=".7" fill="#1f2328" opacity=".16"/><circle cx="12" cy="13" r=".55" fill="#1f2328" opacity=".11"/></pattern></defs><rect width="480" height="640" fill="#fbfaf6"/><rect width="480" height="640" fill="url(#figure-grain)" opacity=".34"/><rect x="9" y="9" width="462" height="622" fill="none" stroke="#1f2328" stroke-width=".8" opacity=".22"/><path d="M9 30 V9 H30 M450 9 H471 V30 M9 610 V631 H30 M450 631 H471 V610" fill="none" stroke="#1f2328" stroke-width="1.2" opacity=".38"/><g font-family="Microsoft YaHei,Noto Sans SC,sans-serif"><text x="27" y="48" font-size="30" fill="#1f2328" text-anchor="start">把一份资料做成答案</text><path d="M28 67 Q232 61 451 66" stroke="#1f883d" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M32 104 L424 102 L446 124 L444 239 L34 238Z M424 102 L424 125 L446 124" stroke="#1f2328" stroke-width="2.5" fill="#fffdf8" stroke-linecap="round" stroke-linejoin="round"/><text x="55" y="140" font-size="27" fill="#1f2328" text-anchor="start">社区修理课 · 原通知</text><text x="55" y="178" font-size="27" fill="#1f2328" text-anchor="start">周日 10:00 / 邻里工坊</text><text x="55" y="216" font-size="26" fill="#1f2328" text-anchor="start">参加前要报名</text><path d="M240 254 Q243 267 240 286" stroke="#1f883d" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M234.25044048176275 276.62223025734545 L240 286 L245.74955951823725 276.62223025734545" stroke="#1f883d" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="87" cy="337" r="37" fill="#d3efd9" stroke="#1f2328" stroke-width="2.7"/><text x="87" y="347" font-size="26" fill="#1f2328" text-anchor="middle">时间</text><path d="M109 308 l9 10 l20 -26" stroke="#1f883d" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="240" cy="337" r="37" fill="#d3efd9" stroke="#1f2328" stroke-width="2.7"/><text x="240" y="347" font-size="26" fill="#1f2328" text-anchor="middle">地点</text><path d="M262 308 l9 10 l20 -26" stroke="#1f883d" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="393" cy="337" r="37" fill="#d3efd9" stroke="#1f2328" stroke-width="2.7"/><text x="393" y="347" font-size="26" fill="#1f2328" text-anchor="middle">报名</text><path d="M415 308 l9 10 l20 -26" stroke="#1f883d" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M240 390 Q243 402.5 240 421" stroke="#1f883d" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M234.25044048176275 411.62223025734545 L240 421 L245.74955951823725 411.62223025734545" stroke="#1f883d" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M45 441 L435 441 L435 546 L45 546Z" stroke="#1f2328" stroke-width="2.7" fill="#fffdf8" stroke-linecap="round" stroke-linejoin="round"/><text x="65" y="478" font-size="26" fill="#1f2328" text-anchor="start">答案：三项逐条有依据</text><text x="65" y="519" font-size="26" fill="#1f2328" text-anchor="start">材料没说的：写未知</text><path d="M28 572 L451 572" stroke="#e6e1d4" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="28" y="591" font-size="24" fill="#57606a" text-anchor="start">先整理证据，再组织回答。</text><text x="28" y="627" font-size="24" fill="#57606a" text-anchor="start">交付时把缺项也一起交代。</text></g></svg>
