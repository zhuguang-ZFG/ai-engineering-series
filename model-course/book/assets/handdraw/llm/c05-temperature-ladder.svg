<svg xmlns="http://www.w3.org/2000/svg" width="480" height="748" viewBox="0 0 480 748" role="img" aria-labelledby="title desc"><title id="title">温度只改形状，不改排序</title><desc id="desc">同一组三个候选分数在四个温度下的概率：报名始终第一，两点第二，签到第三；温度越低分布越尖，越高越平。条形长度按概率比例绘制，数值取四位或六位小数。</desc><g font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif" fill="#26221B"><text x="26" y="42" font-size="28" text-anchor="start" fill="#26221B" font-weight="600">温度只改形状，不改排序</text><path d="M26 56Q140 53 250 56" fill="none" stroke="#B4472F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="26" y="108" font-size="25" text-anchor="start" fill="#26221B" font-weight="600">T = 2</text><text x="26" y="138" font-size="19" text-anchor="start" fill="#5C5448" font-weight="400">报名</text><text x="26" y="168" font-size="19" text-anchor="start" fill="#5C5448" font-weight="400">两点</text><text x="26" y="198" font-size="19" text-anchor="start" fill="#5C5448" font-weight="400">签到</text><path d="M118 114H264.7836V134H118Z" fill="#B4472F" stroke="none"/><text x="272.7836" y="131" font-size="20" text-anchor="start" fill="#5C5448" font-weight="400">0.5477</text><path d="M118 144H183.7404V164H118Z" fill="#26221B" stroke="none"/><text x="191.7404" y="161" font-size="20" text-anchor="start" fill="#5C5448" font-weight="400">0.2453</text><path d="M118 174H173.476V194H118Z" fill="#5C5448" stroke="none"/><text x="181.476" y="191" font-size="20" text-anchor="start" fill="#5C5448" font-weight="400">0.2070</text><text x="26" y="260" font-size="25" text-anchor="start" fill="#26221B" font-weight="600">T = 1</text><text x="26" y="290" font-size="19" text-anchor="start" fill="#5C5448" font-weight="400">报名</text><text x="26" y="320" font-size="19" text-anchor="start" fill="#5C5448" font-weight="400">两点</text><text x="26" y="350" font-size="19" text-anchor="start" fill="#5C5448" font-weight="400">签到</text><path d="M118 266H317.4992V286H118Z" fill="#B4472F" stroke="none"/><text x="325.4992" y="283" font-