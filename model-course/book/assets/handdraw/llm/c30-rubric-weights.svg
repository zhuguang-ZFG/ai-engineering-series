<svg xmlns="http://www.w3.org/2000/svg" width="480" height="772" viewBox="0 0 480 772" role="img" aria-labelledby="title desc"><title id="title">七项任务，一共 100 分</title><desc id="desc">材料档案与授权各 10 分，架构决定 15 分，实现与评测各 20 分，交付 15 分，答辩 10 分，合计 100 分。实现与评测合计 40 分，材料与需求合计 20 分：分数压在能被别人复查的部分上。</desc><g font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif" fill="#26221B"><text x="26" y="42" font-size="26" text-anchor="start" fill="#26221B" font-weight="600">七项任务，一共 100 分</text><path d="M26 56Q140 53 250 56" fill="none" stroke="#B4472F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="26" y="96" width="42.800000000000004" height="52" fill="#FFFDF8" stroke="#26221B" stroke-width="1.2"/><text x="47.400000000000006" y="130" font-size="22" text-anchor="middle" fill="#26221B" font-weight="600">A</text><text x="47.400000000000006" y="176" font-size="19" text-anchor="middle" fill="#5C5448" font-weight="600">10</text><rect x="68.80000000000001" y="96" width="42.800000000000004" height="52" fill="#FFFDF8" stroke="#26221B" stroke-width="1.2"/><text x="90.20000000000002" y="130" font-size="22" text-anchor="middle" fill="#26221B" font-weight="600">B</text><text x="90.20000000000002" y="176" font-size="19" text-anchor="middle" fill="#5C5448" font-weight="600">10</text><rect x="111.60000000000002" y="96" width="64.2" height="52" fill="#FFFDF8" stroke="#26221B" stroke-width="1.2"/><text x="143.70000000000002" y="130" font-size="22" text-anchor="middle" fill="#26221B" font-weight="600">C</text><text x="143.70000000000002" y="176" font-size="19" text-anchor="middle" fill="#5C5448" font-weight="600">15</text><rect x="175.8" y="96" width="85.60000000000001" height="52" fill="#F3EAD8" stroke="#26221B" stroke-width="1.2"/><text x="218.60000000000002" y="130" font-size="22" text-anchor="middle" fill="#26221B" font-weight="600">D</text><text x="218.60000000000002" y="176" font-size="19" text-anchor="middle" fill="#B4472F" font-weight="600">20</text><rect x="261.40000000000003" y="96" width="85.60000000000001" height="52" fill="#F3EAD8" stroke="#26221B" stroke-width="1.2"/><text x="304.20000000000005" y="130" font-size="22" text-anchor="middle" fill="#26221B" font-weight="600">E</text><text x="304.20000000000005" y="176" font-size="19" text-anchor="middle" fill="#B4472F" font-weight="600">20</text><rect x="347.00000000000006" y="96" width="64.2" height="52" fill="#FFFDF8" stroke="#26221B" stroke-width="1.2"/><text x="379.1000000000001" y="130" font-size="22" text-anchor="middle" fill="#26221B" font-weight="600">F</text><text x="379.1000000000001" y="176" font-size="19" text-anchor="middle" fill="#5C5448" font-weight="600">15</text><rect x="411.20000000000005" y="96" width="42.800000000000004" height="52" fill="#FFFDF8" stroke="#26221B" stroke-width="1.2"/><text x="432.6" y="130" font-size="22" text-anchor="middle" fill="#26221B" font-weight="600">G</text><text x="432.6" y="176" font-size="19" text-anchor="middle" fill="#5C5448" font-weight="600">10</text><text x="26" y="214" font-size="19" text-anchor="start" fill="#5C5448" font-weight="400">条形长度按分值比例，合计 100 分</text><path d="M26 236H454" fill="none" stroke="#E3D8C1" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="26" y="272" font-size="18" text-anchor="start" fill="#26221B" font-weight="400">A　材料档案与授权</text><text x="232" y="272" font-size="18" text-anchor="end" fill="#5C5448" font-weight="400">10 分</text><text x="26" y="304" font-size="18" text-anchor="start" fill="#26221B" font-weight="400">B　需求与范围</text><text x="232" y="304" font-size="18" text-anchor="end" fill="#5C5448" font-weight="400">10 分</text><text x="26" y="336" font-size="18" text-anchor="start" fill="#26221B" font-weight="400">C　架构决定</text><text x="232" y="336" font-size="18" text-anchor="end" fill="#5C5448" font-weight="400">15 分</text><text x="26" y="368" font-size="18" text-anchor="start" fill="#B4472F" font-weight="400">D　实现</text><text x="232" y="368" font-size="18" text-anchor="end" fill="#5C5448" font-weight="400">20 分</text><text x="248" y="272" font-size="18" text-anchor="start" fill="#B4472F" font-weight="400">E　评测</text><text x="454" y="272" font-size="18" text-anchor="end" fill="#5C5448" font-weight="400">20 分</text><text x="248" y="304" font-size="18" text-anchor="start" fill="#26221B" font-weight="400">F　交付</text><text x="454" y="304" font-size="18" text-anchor="end" fill="#5C5448" font-weight="400">15 分</text><text x="248" y="336" font-size="18" text-anchor="start" fill="#26221B" font-weight="400">G　答辩</text><text x="454" y="336" font-size="18" text-anchor="end" fill="#5C5448" font-weight="400">10 分</text><path d="M26 400H454" fill="none" stroke="#E3D8C1" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M26 410H454" fill="none" stroke="#E3D8C1" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="26" y="436" font-size="22" text-anchor="start" fill="#26221B" font-weight="600">材料与需求</text><text x="454" y="436" font-size="22" text-anchor="end" fill="#26221B" font-weight="600">20 分</text><text x="26" y="464" font-size="19" text-anchor="start" fill="#5C5448" font-weight="400">A + B　先能解释你为什么有权处理，再谈做多少</text><path d="M26 486H454" fill="none" stroke="#E3D8C1" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="26" y="512" font-size="22" text-anchor="start" fill="#26221B" font-weight="600">架构选择</text><text x="454" y="512" font-size="22" text-anchor="end" fill="#26221B" font-weight="600">15 分</text><text x="26" y="540" font-size="19" text-anchor="start" fill="#5C5448" font-weight="400">C　方案要由材料数据支持，不是列技术名词</text><path d="M26 562H454" fill="none" stroke="#E3D8C1" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="26" y="588" font-size="22" text-anchor="start" fill="#26221B" font-weight="600">实现与评测</text><text x="454" y="588" font-size="22" text-anchor="end" fill="#B4472F" font-weight="600">40 分</text><text x="26" y="616" font-size="19" text-anchor="start" fill="#5C5448" font-weight="400">D + E　六类路径至少四类有实际结果；评测先冻结</text><path d="M26 638H454" fill="none" stroke="#E3D8C1" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="26" y="664" font-size="22" text-anchor="start" fill="#26221B" font-weight="600">交付与答辩</text><text x="454" y="664" font-size="22" text-anchor="end" fill="#26221B" font-weight="600">25 分</text><text x="26" y="692" font-size="19" text-anchor="start" fill="#5C5448" font-weight="400">F + G　可复建、可回退、能解释首个失败边界</text><path d="M26 712H454" fill="none" stroke="#E3D8C1" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="26" y="746" font-size="20" text-anchor="start" fill="#B4472F" font-weight="400">先完成再对照，不要按分数倒推答案</text></g></svg>
