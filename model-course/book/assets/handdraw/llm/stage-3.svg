<svg xmlns="http://www.w3.org/2000/svg" width="480" height="640" viewBox="0 0 480 640" role="img" aria-labelledby="title desc"><title id="title">S3 · 能实现</title><desc id="desc">三层节点由箭头相连：模型提出请求，程序校验后执行，回执返回才允许汇报；向下的一支停在失败终态，不画成成功。</desc><rect width="480" height="640" fill="#FBF7EF"/><pattern id="grain" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="3" r=".8" fill="#26221B" opacity=".16"/><circle cx="14" cy="15" r=".7" fill="#26221B" opacity=".12"/></pattern><rect width="480" height="640" fill="url(#grain)" opacity=".28"/><rect x="26" y="26" width="428" height="588" fill="none" stroke="#26221B" stroke-width="1" opacity=".22"/><path d="M20 52 V20 H52 M428 20 H460 V52 M20 588 V620 H52 M428 620 H460 V588" fill="none" stroke="#26221B" stroke-width="1.6" opacity=".5"/><g><text x="46" y="118" font-family="'Noto Serif SC','Songti SC','SimSun',serif" font-size="112" font-weight="600" fill="none" stroke="#26221B" stroke-width="1.7" letter-spacing="2">03</text><text x="432" y="74" font-family="'Noto Serif SC','Songti SC','SimSun',serif" font-size="13" font-weight="500" fill="#5C5448" text-anchor="end" letter-spacing="3">STAGE 03</text><text x="432" y="96" font-family="ui-monospace,monospace" font-size="13" font-weight="500" fill="#5C5448" text-anchor="end" letter-spacing="2">K3</text><path d="M44 150 L436 150" fill="none" stroke="#26221B" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 6"/><rect x="74" y="210" width="332" height="58" rx="8" fill="#FFFDF8" stroke="#26221B" stroke-width="1.6"/><text x="96" y="245" font-family="'Noto Serif SC','Songti SC','SimSun',serif" font-size="17" font-weight="500" fill="#26221B" text-anchor="start">请求：参数与意图</text><rect x="74" y="302" width="332" height="58" rx="8" fill="#F3EAD8" stroke="#26221B" stroke-width="1.6"/><text x="96" y="337" font-family="'Noto Serif SC','Songti SC','SimSun',serif" font-size="17" font-weight="500" fill="#26221B" text-anchor="start">校验：类型、范围、权限</text><rect x="74" y="394" width="332" height="58" rx="8" fill="#FFFDF8" stroke="#26221B" stroke-width="1.6"/><text x="96" y="429" font-family="'Noto Serif SC','Songti SC','SimSun',serif" font-size="17" font-weight="500" fill="#26221B" text-anchor="start">回执：结果、终态、时间</text><path d="M240 268 v34 m-7 -8 l7 8 l7 -8" fill="none" stroke="#26221B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M240 360 v34 m-7 -8 l7 8 l7 -8" fill="none" stroke="#26221B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M406 394 q28 0 28 28 q0 26 -30 26" fill="none" stroke="#B4472F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M404 448 l10 -4 l-4 11" fill="none" stroke="#B4472F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="368" y="490" font-family="'Noto Serif SC','Songti SC','SimSun',serif" font-size="15" font-weight="500" fill="#B4472F" text-anchor="start">失败也留终态</text><path d="M74 528 L406 528" fill="none" stroke="#26221B" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 7"/><text x="74" y="562" font-family="'Noto Serif SC','Songti SC','SimSun',serif" font-size="18" font-weight="500" fill="#26221B" text-anchor="start">程序接受什么，才叫完成</text><text x="44" y="596" font-family="'Noto Serif SC','Songti SC','SimSun',serif" font-size="15" font-weight="400" fill="#5C5448" text-anchor="start" letter-spacing="2">五阶段 · 三十章</text><text x="436" y="596" font-family="'Noto Serif SC','Songti SC','SimSun',serif" font-size="15" font-weight="400" fill="#5C5448" text-anchor="end" letter-spacing="1">把大模型拆开看</text></g></svg>
