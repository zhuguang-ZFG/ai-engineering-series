<svg xmlns="http://www.w3.org/2000/svg" width="480" height="640" viewBox="0 0 480 640" role="img" aria-labelledby="title desc"><title id="title">选一个，再往下走</title><desc id="desc">我想喝一杯分出水、茶、咖啡三条候选分支。茶被选中后追加到输入，再回到下一轮候选计算。</desc><g font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif"><text x="27" y="48" font-size="30" fill="#26221B" text-anchor="start">选一个，再往下走</text><path d="M 28 67 Q 232 64.78 451 66" stroke="#B4472F" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M 110 102 Q 184.3 100.6 372 101 Q 369.04 131.94 370.6 163 Q 272 163.6 109 161.4 Q 109.6 131 110 102 Z" stroke="#26221B" stroke-width="2.5" fill="#fffdf8" stroke-linecap="round" stroke-linejoin="round"/><text x="241" y="141" font-size="29" fill="#26221B" text-anchor="middle">我想喝一杯</text><path d="M 180 175 Q 136.92 202.3 88 236" stroke="#B4472F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M92.63856952300632 226.02584977152253 L88 236 L98.99307323857612 235.6096914409065" stroke="#B4472F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M 240 175 Q 241.86 202.5 240 236" stroke="#B4472F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M234.25044048176275 226.62223025734545 L240 236 L245.74955951823725 226.62223025734545" stroke="#B4472F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M 300 175 Q 348 204.86 393 236" stroke="#B4472F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M382.00512317505354 235.66431621389233 L393 236 L388.31193037748477 226.04901998723494" stroke="#B4472F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="88" cy="278" r="37" fill="#FFFDF8" stroke="#26221B" stroke-width="2.7"/><text x="88" y="287" font-size="28" fill="#26221B" text-anchor="middle">水</text><circle cx="240" cy="278" r="39" fill="#F3EAD8" stroke="#26221B" stroke-width="2.7"/><text x="240" y="287" font-size="28" fill="#26221B" text-anchor="middle">茶</text><circle cx="393" cy="278" r="37" fill="#FFFDF8" stroke="#26221B" stroke-width="2.7"/><text x="393" y="287" font-size="25" fill="#26221B" text-anchor="middle">咖啡</text><path d="M276 241 l9 10 l20 -26" stroke="#B4472F" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M240 322 Q243 344.5 240 373" stroke="#B4472F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M234.25044048176275 363.62223025734545 L240 373 L245.74955951823725 363.62223025734545" stroke="#B4472F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M 60 394 Q 161.4 391.64 419 393 Q 419.38 425.52 417.6 458 Q 282.1 459.24 59 456.4 Q 61.82 424.54 60 394 Z" stroke="#26221B" stroke-width="2.5" fill="#F3EAD8" stroke-linecap="round" stroke-linejoin="round"/><text x="240" y="435" font-size="30" fill="#26221B" text-anchor="middle">我想喝一杯茶</text><path d="M 425 427 Q 465 427 460 315 Q 461.24 227.5 460 140 Q 460 104 393 124" stroke="#B4472F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M402 113 L393 124 L408 128" stroke="#B4472F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="240" y="511" font-size="28" fill="#26221B" text-anchor="middle">下一轮重新计算候选</text><text x="240" y="548" font-size="25" fill="#26221B" text-anchor="middle">刚选的“茶”也成了输入</text><path d="M 28 572 Q 239.5 573.6 451 572" stroke="#E3D8C1" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="28" y="591" font-size="24" fill="#5C5448" text-anchor="start">生成是一轮接一轮的选择。</text><text x="28" y="627" font-size="24" fill="#5C5448" text-anchor="start">选词概率不等于事实可信度。</text></g></svg>
