<svg xmlns="http://www.w3.org/2000/svg" width="480" height="640" viewBox="0 0 480 640" role="img" aria-labelledby="title desc"><title id="title">选一个，再往下走</title><desc id="desc">我想喝一杯分出水、茶、咖啡三条候选分支。茶被选中后追加到输入，再回到下一轮候选计算。</desc><defs><pattern id="figure-grain" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="3" r=".7" fill="#1f2328" opacity=".16"/><circle cx="12" cy="13" r=".55" fill="#1f2328" opacity=".11"/></pattern></defs><rect width="480" height="640" fill="#fbfaf6"/><rect width="480" height="640" fill="url(#figure-grain)" opacity=".34"/><rect x="9" y="9" width="462" height="622" fill="none" stroke="#1f2328" stroke-width=".8" opacity=".22"/><path d="M9 30 V9 H30 M450 9 H471 V30 M9 610 V631 H30 M450 631 H471 V610" fill="none" stroke="#1f2328" stroke-width="1.2" opacity=".38"/><g font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif"><text x="27" y="48" font-size="30" fill="#1f2328" text-anchor="start">选一个，再往下走</text><path d="M28 67 Q232 61 451 66" stroke="#B4472F" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M115 100 Q241 97 370 102 L368 162 Q241 165 112 160Z" stroke="#1f2328" stroke-width="2.5" fill="#fffdf8" stroke-linecap="round" stroke-linejoin="round"/><text x="241" y="141" font-size="29" fill="#1f2328" text-anchor="middle">我想喝一杯</text><path d="M180 175 Q137 202.5 88 236" stroke="#B4472F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M92.63856952300632 226.02584977152253 L88 236 L98.99307323857612 235.6096914409065" stroke="#B4472F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M240 175 Q243 202.5 240 236" stroke="#B4472F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M234.25044048176275 226.62223025734545 L240 236 L245.74955951823725 226.62223025734545" stroke="#B4472F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="