<svg xmlns="http://www.w3.org/2000/svg" width="480" height="860" viewBox="0 0 480 860" role="img" aria-labelledby="title desc"><title id="title">一条主线，六个问题</title><desc id="desc">同一句话走完六步：编号、向量、注意力权重、归一化与前馈、三个候选分数、softmax 采样；每一步的输出就是下一步的输入，图上的数字全部来自同一组人工算例。</desc><g font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif" fill="#26221B"><text x="26" y="42" font-size="28" text-anchor="start" fill="#26221B" font-weight="600">一条主线，六个问题</text><path d="M26 56Q140 53 250 56" fill="none" stroke="#B4472F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M26 96H454" fill="none" stroke="#E3D8C1" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="26" y="126" font-size="21" text-anchor="start" fill="#B4472F" font-weight="600">C05</text><text x="82" y="126" font-size="23" text-anchor="start" fill="#26221B" font-weight="400">六片文字，先查成六个编号</text><text x="82" y="166" font-size="21" text-anchor="start" fill="#5C5448" font-weight="400">4102 2871 5530 2701 6984 3650</text><path d="M240 178V204M235 197L240 204L245 197" fill="none" stroke="#B4472F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M26 218H454" fill="none" stroke="#E3D8C1" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="26" y="248" font-size="21" text-anchor="start" fill="#B4472F" font-weight="600">C06</text><text x="82" y="248" font-size="23" text-anchor="start" fill="#26221B" font-weight="400">编号查表，变成四维向量</text><text x="82" y="288" font-size="21" text-anchor="start" fill="#5C5448" font-weight="400">[0.6, −0.2, 0.2, 0.2] 等六条</text><path d="M240 300V326M235 319L240 326L245 319" fill="none" stroke="#B4472F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M26 340H454" fill="none" stroke="#E3D8C1" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="26" y="370" font-size="21" text-anchor="start" fill="#B4472F" font-weight="600">C07</text><text x="82" y="370" font-size="23" text-anchor="start" fill="#26221B" font-weight="400">每个位置算一行注意力权重</text><text x="82" y="410" font-size="21" text-anchor="start" fill="#5C5448" font-weight="400">0.2766 0.1184 0.0288 0.4870 0.0892</text><path d="M240 422V448M235 441L240 448L245 441" fill="none" stroke="#B4472F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M26 462H454" fill="none" stroke="#E3D8C1" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="26" y="492" font-size="21" text-anchor="start" fill="#B4472F" font-weight="600">C08</text><text x="82" y="492" font-size="23" text-anchor="start" fill="#26221B" font-weight="400">汇总后归一化，再过前馈</text><text x="82" y="532" font-size="21" text-anchor="start" fill="#5C5448" font-weight="400">y = [−1.3285, 3.1419, 0.4850, −0.4850]</text><path d="M240 544V570M235 563L240 570L245 563" fill="none" stroke="#B4472F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M26 584H454" fill="none" stroke="#E3D8C1" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="26" y="614" font-size="21" text-anchor="start" fill="#B4472F" font-weight="600">C08</text><text x="82" y="614" font-size="23" text-anchor="start" fill="#26221B" font-weight="400">输出头给出三个候选的分数</text><text x="82" y="654" font-size="21" text-anchor="start" fill="#5C5448" font-weight="400">1.9336 / −0.0126 / 0.3268</text><path d="M240 666V692M235 685L240 692L245 685" fill="none" stroke="#B4472F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M26 706H454" fill="none" stroke="#E3D8C1" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="26" y="736" font-size="21" text-anchor="start" fill="#B4472F" font-weight="600">C10</text><text x="82" y="736" font-size="23" text-anchor="start" fill="#26221B" font-weight="400">softmax 与采样选出下一片</text><text x="82" y="776" font-size="21" text-anchor="start" fill="#5C5448" font-weight="400">0.7444 / 0.1063 / 0.1493 → 报名</text><path d="M26 828H454" fill="none" stroke="#E3D8C1" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="26" y="852" font-size="21" text-anchor="start" fill="#5C5448" font-weight="400">换掉的只有问题，数字一直是同一组</text></g></svg>
