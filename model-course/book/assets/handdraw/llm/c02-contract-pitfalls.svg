<svg xmlns="http://www.w3.org/2000/svg" width="480" height="560" viewBox="0 0 480 560" role="img" aria-labelledby="title desc"><title id="title">四种写不清楚的约定</title><desc id="desc">要完整、合理推测、参考所有资料、输出专业一点：四种说法的共同点是把判断留给了执行的一方。写约定的人省了力气，核对的人却要替它猜标准。</desc><g font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif" fill="#26221B"><text x="26" y="42" font-size="26" text-anchor="start" fill="#26221B" font-weight="600">四种写不清楚的约定</text><path d="M26 56Q140 53 250 56" fill="none" stroke="#B4472F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M26 74H454" fill="none" stroke="#E3D8C1" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="26" y="104" font-size="22" text-anchor="start" fill="#B4472F" font-weight="600">“要完整”</text><text x="26" y="134" font-size="18" text-anchor="start" fill="#26221B" font-weight="400">完整没有定义</text><text x="26" y="160" font-size="17" text-anchor="start" fill="#5C5448" font-weight="400">缺三项的表也能自称完整</text><path d="M26 170H454" fill="none" stroke="#E3D8C1" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="26" y="200" font-size="22" text-anchor="start" fill="#B4472F" font-weight="600">“合理推测”</text><text x="26" y="230" font-size="18" text-anchor="start" fill="#26221B" font-weight="400">允许无依据内容进报告</text><text x="26" y="256" font-size="17" text-anchor="start" fill="#5C5448" font-weight="400">推测要另开一列，不能混进“值”</text><path d="M26 266H454" fill="none" stroke="#E3D8C1" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="26" y="296" font-size="22" text-anchor="start" fill="#B4472F" font-weight="600">“参考所有资料”</text><text x="26" y="326" font-size="18" text-anchor="start" fill="#26221B" font-weight="400">没说版本与优先级</text><text x="26" y="352" font-size="17" text-anchor="start" fill="#5C5448" font-weight="400">旧通知会压过新通知</text><path d="M26 362H454" fill="none" stroke="#E3D8C1" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="26" y="392" font-size="22" text-anchor="start" fill="#B4472F" font-weight="600">“输出专业一点”</text><text x="26" y="422" font-size="18" text-anchor="start" fill="#26221B" font-weight="400">没有字段，没有核对方式</text><text x="26" y="448" font-size="17" text-anchor="start" fill="#5C5448" font-weight="400">改十遍也判断不了哪版更对</text><path d="M26 512H454" fill="none" stroke="#E3D8C1" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="26" y="542" font-size="17" text-anchor="start" fill="#B4472F" font-weight="400">更隐蔽的一种：要求“附引用”却没说引用要支持结论</text></g></svg>
