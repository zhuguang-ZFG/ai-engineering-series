<svg xmlns="http://www.w3.org/2000/svg" width="480" height="800" viewBox="0 0 480 800" role="img" aria-labelledby="title desc"><title id="title">同一个编号，两段上下文</title><desc id="desc">人工 ID 42 的苹果从同一个初始向量出发，在切成小块与开发软件的不同上下文中得到不同示意表示。</desc><defs><pattern id="figure-grain" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="3" r=".7" fill="#1f2328" opacity=".16"/><circle cx="12" cy="13" r=".55" fill="#1f2328" opacity=".11"/></pattern></defs><rect width="480" height="800" fill="#fbfaf6"/><rect width="480" height="800" fill="url(#figure-grain)" opacity=".34"/><rect x="9" y="9" width="462" height="782" fill="none" stroke="#1f2328" stroke-width=".8" opacity=".22"/><path d="M9 30 V9 H30 M450 9 H471 V30 M9 770 V791 H30 M450 791 H471 V770" fill="none" stroke="#1f2328" stroke-width="1.2" opacity=".38"/><g font-family="Microsoft YaHei,sans-serif"><text x="28" y="48" font-size="30" fill="#1f2328">同一个编号，两段上下文</text><path d="M28 66 Q238 61 448 65" fill="none" stroke="#1f883d" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M100 101 Q240 95 380 98 L378 214 Q240 218 100 213Z" fill="#fffdf8" stroke="#1f2328" stroke-width="2.5"/><text x="168" y="137" font-size="26" fill="#1f2328">“苹果”</text><text x="140" y="176" font-size="26" fill="#1f2328">人工 ID 42</text><path d="M240 221 Q237 239 240 257 M231 246 L240 257 L249 246" fill="none" stroke="#1f883d" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><text x="54" y="297" font-size="26" fill="#1f2328">初始向量 [0.8, 0.2, 0.1]</text><path d="M240 316 L240 343 Q130 342 121 371 M111 360 L121 371 L131 360 M240 343 Q350 342 360 371 M350 360 L360 371 L370 360" fill="none" stroke="#1f883d" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M28 392 Q125.5 386 223 389 L221 513 Q125.5 517 28 512Z" fill="#fffdf8" stroke="#1f2328" stroke-width="2.5"/><path d="M256 391 Q353.5 385 451 388 L449 512 Q353.5 516 256 511Z" fill="#fffdf8" stroke="#1f2328" stroke-width="2.5"/><text x="48" y="430" font-size="26" fill="#1f2328">切成小块</text><text x="276" y="430" font-size="26" fill="#1f2328">开发软件</text><text x="48" y="478" font-size="26" fill="#1f2328">水果语境</text><text x="276" y="478" font-size="26" fill="#1f2328">公司语境</text><path d="M125 522 Q122 540 125 558 M116 547 L125 558 L134 547" fill="none" stroke="#1f883d" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M354 522 Q351 540 354 558 M345 547 L354 558 L363 547" fill="none" stroke="#1f883d" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><text x="28" y="604" font-size="26" fill="#1f2328">[0.9,0.1,0.1]</text><text x="256" y="604" font-size="24" fill="#1f2328">[0.1,0.3,0.95]</text><path d="M30 618 Q125 613 220 617" fill="none" stroke="#1f883d" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M258 618 Q353 613 448 617" fill="none" stroke="#1f883d" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><text x="40" y="677" font-size="26" fill="#1f2328">查表起点相同，语境结果可不同</text><text x="40" y="739" font-size="26" fill="#57606a">数字是人工表，不是网络实测</text></g></svg>
