<svg xmlns="http://www.w3.org/2000/svg" width="480" height="640" viewBox="0 0 480 640" role="img" aria-labelledby="title desc"><title id="title">碎字节，拼回来再读</title><desc id="desc">X01中的复合emoji包含电脑字符；cl100k_base用两个token保存它的四个UTF-8字节：93273含F0 9F 92，119含BB，接齐才可解码为电脑。</desc><g font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif"><text x="27" y="48" font-size="30" fill="#1f2328" text-anchor="start">碎字节，拼回来再读</text><path d="M28 67 Q232 61 451 66" stroke="#B4472F" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="32" y="112" font-size="26" fill="#1f2328" text-anchor="start">取出 emoji 中的电脑部分</text><path d="M174 139 L305 141 L301 220 L178 219Z M163 230 L315 230 L328 245 L150 245Z" stroke="#1f2328" stroke-width="3" fill="#f0e9d8" stroke-linecap="round" stroke-linejoin="round"/><text x="240" y="192" font-size="40" fill="#1f2328" text-anchor="middle">💻</text><path d="M199 260 Q167.5 277 130 300" stroke="#B4472F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M135.22950463902572 290.32258912567994 L130 300 L140.99666281877177 300.27093698574186" stroke="#B4472F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M281 260 Q321 277 355 300" stroke="#B4472F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M344.0163013835497 300.59863570139754 L355 300 L349.48432836558965 290.4827857846237" stroke="#B4472F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M27 320 Q103.2 315.4 296 319 L294.6 410 Q193.3 411.8 26 408.4 Q26.6 363.5 27 320Z" stroke="#1f2328" stroke-width="2.5" fill="#fffdf8" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="347" font-size="26" fill="#1f2328" text-anchor="start">token 93273</text><text x="44" y="391" font-size="28" fill="#1f2328" text-anchor="start">F0  9F  92</text><path d="M317 320 Q355.68 315.4 452 319 L450.6 410 Q400.22 411.8 316 408.4 Q316.6 363.5 317 320Z" stroke="#1f2328" stroke-width="2.5" fill="#fffdf8" stroke-linecap="round" stroke-linejoin="round"/><text x="332" y="347" font-size="26" fill="#1f2328" text-anchor="start">ID 119</text><text x="354" y="391" font-size="28" fill="#1f2328" text-anchor="start">BB</text><path d="M30 425 L30 449 L449 449 L449 425" stroke="#B4472F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M240 452 Q243 461.5 240 477" stroke="#B4472F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M234.25044048176275 467.62223025734545 L240 477 L245.74955951823725 467.62223025734545" stroke="#B4472F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="240" y="513" font-size="30" fill="#1f2328" text-anchor="middle">F0  9F  92  BB</text><text x="240" y="550" font-size="26" fill="#1f2328" text-anchor="middle">接齐后才是完整的 💻</text><path d="M28 572 L451 572" stroke="#e6e1d4" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="28" y="591" font-size="24" fill="#57606a" text-anchor="start">单个 token 不必是完整字符。</text><text x="28" y="627" font-size="24" fill="#57606a" text-anchor="start">拼接顺序不能打乱。</text></g></svg>
