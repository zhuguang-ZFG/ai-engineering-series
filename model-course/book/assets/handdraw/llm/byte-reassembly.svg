<svg xmlns="http://www.w3.org/2000/svg" width="480" height="640" viewBox="0 0 480 640" role="img" aria-labelledby="title desc"><title id="title">碎字节，拼回来再读</title><desc id="desc">X01中的复合emoji包含电脑字符；cl100k_base用两个token保存它的四个UTF-8字节：93273含F0 9F 92，119含BB，接齐才可解码为电脑。</desc><g font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif"><text x="27" y="48" font-size="30" fill="#26221B" text-anchor="start">碎字节，拼回来再读</text><path d="M 28 67 Q 232 64.78 451 66" stroke="#B4472F" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="32" y="112" font-size="26" fill="#26221B" text-anchor="start">取出 emoji 中的电脑部分</text><path d="M 174 139 Q 239.48 141.38 305 141 Q 304.86 180.6 301 220 Q 239.5 218.28 178 219 Z M 163 230 Q 239 231.1 315 230 L 328 245 Q 239 244.02 150 245 Z" stroke="#26221B" stroke-width="3" fill="#F3EAD8" stroke-linecap="round" stroke-linejoin="round"/><text x="240" y="192" font-size="40" fill="#26221B" text-anchor="middle">💻</text><path d="M 199 260 Q 167.38 276.8 130 300" stroke="#B4472F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M135.22950463902572 290.32258912567994 L130 300 L140.99666281877177 300.27093698574186" stroke="#B4472F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M 281 260 Q 319.88 279.04 355 300" stroke="#B4472F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M344.0163013835497 300.59863570139754 L355 300 L349.48432836558965 290.4827857846237" stroke="#B4472F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M 27 320 Q 103.2 318.16 296 319 Q 296.64 364.52 294.6 410 Q 193.28 411.48 26 408.4 Q 27.5 363.52 27 320 Z" stroke="#26221B" stroke-width="2.5" fill="#fffdf8" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="347" font-size="26" fill="#26221B" text-anchor="start">token 93273</text><text x="44" y="391" font-size="28" fill="#26221B" text-anchor="start">F0  9F  92</text><path d="M 317 320 Q 355.68 318.1 452 319 Q 450.14 364.48 450.6 410 Q 400.18 410.88 316 408.4 Q 317.84 363.52 317 320 Z" stroke="#26221B" stroke-width="2.5" fill="#fffdf8" stroke-linecap="round" stroke-linejoin="round"/><text x="332" y="347" font-size="26" fill="#26221B" text-anchor="start">ID 119</text><text x="354" y="391" font-size="28" fill="#26221B" text-anchor="start">BB</text><path d="M 30 425 L 30 449 Q 239.5 450.32 449 449 L 449 425" stroke="#B4472F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M240 452 Q243 461.5 240 477" stroke="#B4472F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M234.25044048176275 467.62223025734545 L240 477 L245.74955951823725 467.62223025734545" stroke="#B4472F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="240" y="513" font-size="30" fill="#26221B" text-anchor="middle">F0  9F  92  BB</text><text x="240" y="550" font-size="26" fill="#26221B" text-anchor="middle">接齐后才是完整的 💻</text><path d="M 28 572 Q 239.5 573.6 451 572" stroke="#E3D8C1" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="28" y="591" font-size="24" fill="#5C5448" text-anchor="start">单个 token 不必是完整字符。</text><text x="28" y="627" font-size="24" fill="#5C5448" text-anchor="start">拼接顺序不能打乱。</text></g></svg>
