<svg xmlns="http://www.w3.org/2000/svg" width="480" height="990" viewBox="0 0 480 990" role="img" aria-labelledby="g49-title g49-desc"><title id="g49-title">一句话，接着往下写</title><desc id="g49-desc">1．先列本轮候选：输入停在“他端起杯子，喝了一口”。三个候选按分数计算后，“水”的概率是 56.44%。此时还没有选词。 2．从分布中选一个：固定种子 42 的这次抽样选中“水”。抽中后先停一下：它只是本轮选出的片段，概率并不证明杯子里装着什么。 3．追加到输入末尾：把“水”接到句尾，输入变成“他端起杯子，喝了一口水”。刚才的输出，现在也成了下一轮能读到的内容。 4．用新输入重算：新上下文的候选变成了句号 83.20%、逗号 16.80%。上一轮的水、茶、咖啡已经不是这一步的候选；接下来重复选择和追加，直到停止。</desc><rect width="480" height="990" fill="#fbfaf6"/><g font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif"><text x="24" y="39" font-size="30" text-anchor="start" fill="#1f2328">一句话，接着往下写</text><path d="M26 57 Q240 61 454 56" stroke="#B4472F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" /><g transform="translate(0 72)"><circle cx="43" cy="20" r="18" fill="#f0e9d8" stroke="#1f2328" stroke-width="2.5"/><text x="43" y="29" font-size="24" text-anchor="middle" fill="#1f2328">1</text><text x="74" y="29" font-size="27" text-anchor="start" fill="#1f2328">先列本轮候选</text><g transform="translate(0 49)"><text x="34" y="28" font-size="27" text-anchor="start" fill="#1f2328">水</text><path d="M111 10 L306 10" stroke="#e6e1d4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-dasharray="4 5"/><path d="M114 3 Q166.0243807142856 0 221.0487614285712 5 L219.0487614285712 34 Q166.0243807142856 36 111 32Z" stroke="#1f2328" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="#f0e9d8" /><text x="318" y="27" font-size="24" text-anchor="start" fill="#1f2328">56.44%</text><text x="34" y="77" font-size="27" text-anchor="start" fill="#1f2328">茶</text><path d="M111 59 L306 59" stroke="#e6e1d4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-dasharray="4 5"/><path d="M114 52 Q141.1980204048677 49 171.39604080973535 54 L169.39604080973535 83 Q141.1980204048677 85 111 81Z" stroke="#1f2328" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="#f0e9d8" /><text x="318" y="76" font-size="24" text-anchor="start" fill="#1f2328">30.97%</text><text x="34" y="126" font-size="27" text-anchor="start" fill="#1f2328">咖啡</text><path d="M111 108 L306 108" stroke="#e6e1d4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-dasharray="4 5"/><path d="M114 101 Q123.27759888084672 98 135.55519776169345 103 L133.55519776169345 132 Q123.27759888084672 134 111 130Z" stroke="#1f2328" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="#f0e9d8" /><text x="318" y="125" font-size="24" text-anchor="start" fill="#1f2328">12.59%</text></g><path d="M27 222 L452 222" stroke="#e6e1d4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" /></g><g transform="translate(0 300)"><circle cx="43" cy="20" r="18" fill="#f0e9d8" stroke="#1f2328" stroke-width="2.5"/><text x="43" y="29" font-size="24" text-anchor="middle" fill="#1f2328">2</text><text x="74" y="29" font-size="27" text-anchor="start" fill="#1f2328">从分布中选一个</text><g transform="translate(0 49)"><text x="32" y="40" font-size="28" text-anchor="start" fill="#1f2328">固定种子 42，抽中</text><g class="mechanism-change"><circle cx="370" cy="30" r="37" fill="#f0e9d8" stroke="#1f2328" stroke-width="2.5"/><text x="370" y="40" font-size="30" text-anchor="middle" fill="#1f2328">水</text></g><text x="32" y="111" font-size="28" text-anchor="start" fill="#1f2328">本步概率 56.44%</text><text x="32" y="154" font-size="24" text-anchor="start" fill="#1f2328">概率高，也不能证明杯里是水。</text></g><path d="M27 222 L452 222" stroke="#e6e1d4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" /></g><g transform="translate(0 528)"><circle cx="43" cy="20" r="18" fill="#f0e9d8" stroke="#1f2328" stroke-width="2.5"/><text x="43" y="29" font-size="24" text-anchor="middle" fill="#1f2328">3</text><text x="74" y="29" font-size="27" text-anchor="start" fill="#1f2328">追加到输入末尾</text><g transform="translate(0 49)"><path d="M32 4 Q239.5 1 450 6 L448 61 Q239.5 63 29 59Z" stroke="#1f2328" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="#fbfaf6" /><text x="44" y="42" font-size="28" text-anchor="start" fill="#1f2328">他端起杯子，喝了一口</text><path d="M240 66 Q244 81 240 96 M232 86 L240 96 L248 86" stroke="#B4472F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" class="mechanism-flow"/><g class="mechanism-change"><path d="M32 105 Q239.5 102 450 107 L448 162 Q239.5 164 29 160Z" stroke="#1f2328" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="#f0e9d8" /><text x="44" y="143" font-size="28" text-anchor="start" fill="#1f2328">他端起杯子，喝了一口水</text></g></g><path d="M27 222 L452 222" stroke="#e6e1d4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" /></g><g transform="translate(0 756)"><circle cx="43" cy="20" r="18" fill="#f0e9d8" stroke="#1f2328" stroke-width="2.5"/><text x="43" y="29" font-size="24" text-anchor="middle" fill="#1f2328">4</text><text x="74" y="29" font-size="27" text-anchor="start" fill="#1f2328">用新输入重算</text><g transform="translate(0 49)"><text x="32" y="30" font-size="28" text-anchor="start" fill="#1f2328">新输入：……一口水</text><text x="34" y="83" font-size="27" text-anchor="start" fill="#1f2328">。</text><path d="M111 65 L306 65" stroke="#e6e1d4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-dasharray="4 5"/><path d="M114 58 Q192.12179255055764 55 273.2435851011153 60 L271.2435851011153 89 Q192.12179255055764 91 111 87Z" stroke="#1f2328" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="#f0e9d8" /><text x="318" y="82" font-size="24" text-anchor="start" fill="#1f2328">83.20%</text><text x="34" y="136" font-size="27" text-anchor="start" fill="#1f2328">，</text><path d="M111 118 L306 118" stroke="#e6e1d4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-dasharray="4 5"/><path d="M114 111 Q127.37820744944236 108 143.7564148988847 113 L141.7564148988847 142 Q127.37820744944236 144 111 140Z" stroke="#1f2328" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="#f0e9d8" /><text x="318" y="135" font-size="24" text-anchor="start" fill="#1f2328">16.80%</text></g></g></g></svg>
