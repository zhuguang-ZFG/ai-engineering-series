<svg xmlns="http://www.w3.org/2000/svg" width="480" height="420" viewBox="0 0 480 420" role="img" aria-labelledby="title desc">
  <title id="title">把任务和材料放进本次输入，逐项检查输出证据</title>
  <desc id="desc">任务和通知原文一起构成本次输入；输出中时间有原句支持，地点在材料中未提供，应标记未知。</desc>
  
  <g font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif" fill="#26221B">
    <text x="24" y="43" font-size="28" font-weight="600">给材料，也给检查标准</text>
    <path d="M24 56q65 7 130 0t80 0" fill="none" stroke="#B4472F" stroke-width="4" stroke-linecap="round"/>
    <rect x="24" y="81" width="432" height="131" rx="13" fill="#fffdf8" stroke="#26221B" stroke-width="3"/>
    <g font-size="26"><text x="42" y="118">任务：整理活动安排</text><text x="42" y="157">材料：周六 14:00 开始…</text><text x="42" y="196">要求：每项附原文依据</text></g>
    <path d="M238 220v30m-8-8 8 8 8-8" fill="none" stroke="#26221B" stroke-width="3"/>
    <path d="M24 285h432" stroke="#F3EAD8" stroke-width="36"/>
    <text x="35" y="293" font-size="26">时间 → 周六 14:00，有证据</text>
    <path d="M24 342h432" stroke="#E3D8C1" stroke-width="36"/>
    <text x="35" y="350" font-size="26">地点 → 未提供，先留作未知</text>
    <text x="24" y="399" font-size="25" fill="#5C5448">写得合理，也要回查原文</text>
  </g>
</svg>
