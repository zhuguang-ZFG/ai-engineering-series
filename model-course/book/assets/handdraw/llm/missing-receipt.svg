<svg xmlns="http://www.w3.org/2000/svg" width="480" height="640" viewBox="0 0 480 640" role="img" aria-labelledby="title desc"><title id="title">超时后，结果还未知</title><desc id="desc">客户端发送job-7，服务端可能已完成，但返回箭头中断；客户端时钟超时后，应先按请求号查询结果而非认定未执行。</desc><defs><pattern id="figure-grain" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="3" r=".7" fill="#1f2328" opacity=".16"/><circle cx="12" cy="13" r=".55" fill="#1f2328" opacity=".11"/></pattern></defs><rect width="480" height="640" fill="#fbfaf6"/><rect width="480" height="640" fill="url(#figure-grain)" opacity=".34"/><rect x="9" y="9" width="462" height="622" fill="none" stroke="#1f2328" stroke-width=".8" opacity=".22"/><path d="M9 30 V9 H30 M450 9 H471 V30 M9 610 V631 H30 M450 631 H471 V610" fill="none" stroke="#1f2328" stroke-width="1.2" opacity=".38"/><g font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif"><text x="27" y="48" font-size="30" fill="#1f2328" text-anchor="start">超时后，结果还未知</text><path d="M28 67 Q232 61 451 66" stroke="#B4472F" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="36" y="111" font-size="27" fill="#1f2328" text-anchor="start">客户端</text><text x="333" y="111" font-size="27" fill="#1f2328" text-anchor="start">服务端</text><path d="M92 132 L92 485" stroke="#e6e1d4" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 7"/><path d="M385 132 L385 485" stroke="#e6e1d4" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 7"/><path d="M96 177 Q241 174 380 177" stroke="#B4472F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M370.62223025734545 182.74955951823725 L380 177 L370.62223025734545 171.25044048176275" stroke="#B4472F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="241" y="157" font-size="28" fill="#1f2328" text-anchor="middle">job-7</text><circle cx="385" cy="255" r="28" fill="#f0e9d8" stroke="#1f2328" stroke-width="2.7"/><path d="M372 258 l9 10 l20 -26" stroke="#B4472F" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="193" y="263" font-size="25" fill="#1f2328" text-anchor="start">可能已完成</text><path d="M380 327 Q327.5 324 269 327" stroke="#57606a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5"/><path d="M278.37776974265455 321.2504404817627 L269 327 L278.37776974265455 332.7495595182372" stroke="#57606a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M223 309 l36 36 M223 345 l36 -36" stroke="#B4472F" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M214 327 Q158 324 96 327" stroke="#57606a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5"/><path d="M105.37776974265456 321.2504404817627 L96 327 L105.37776974265456 332.7495595182372" stroke="#57606a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="240" y="371" font-size="26" fill="#1f2328" text-anchor="middle">回执丢失</text><circle cx="93" cy="435" r="32" fill="#fffdf8" stroke="#1f2328" stroke-width="2.7"/><path d="M93 435 L93 416" stroke="#1f2328" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M93 435 L110 445" stroke="#1f2328" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="146" y="442" font-size="26" fill="#1f2328" text-anchor="start">这里只知道：超时</text><path d="M96 510 Q241 507 380 510" stroke="#B4472F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M370.62223025734545 515.7495595182372 L380 510 L370.62223025734545 504.2504404817627" stroke="#B4472F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="240" y="550" font-size="27" fill="#1f2328" text-anchor="middle">先按请求号查询状态</text><path d="M28 572 L451 572" stroke="#e6e1d4" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="28" y="591" font-size="24" fill="#57606a" text-anchor="start">没收到回执，不能认定没执行。</text><text x="28" y="627" font-size="24" fill="#57606a" text-anchor="start">重试是否去重要看服务端约定。</text></g></svg>
