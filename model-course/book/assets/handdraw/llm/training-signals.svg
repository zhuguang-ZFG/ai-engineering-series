<svg xmlns="http://www.w3.org/2000/svg" width="480" height="800" viewBox="0 0 480 800" role="img" aria-labelledby="title desc"><title id="title">三种信号，分别在教什么？</title><desc id="desc">普通文本提供续写目标，任务示范提供回答样式，偏好对提供比较标准；消息角色模板另行组织本次输入。</desc><g font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif"><text x="28" y="48" font-size="30" fill="#26221B">三种信号，分别在教什么？</text><path d="M 28 66 Q 238 64.32 448 65" fill="none" stroke="#B4472F" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M 47 110 Q 48.64 362.5 47 615" fill="none" stroke="#E3D8C1" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><text x="28" y="117" font-size="26" fill="#26221B">1</text><text x="77" y="117" font-size="28" fill="#26221B">文本 → 续写目标</text><path d="M 77 143 Q 262.98 139.28 449 140 Q 449.52 191.02 447 242 Q 263 243.7 77 241 Z" fill="#fffdf8" stroke="#26221B" stroke-width="2.5"/><text x="94" y="180" font-size="26" fill="#26221B">周六 14 时开始……</text><text x="94" y="220" font-size="26" fill="#26221B">比较下一个 token</text><text x="28" y="302" font-size="26" fill="#26221B">2</text><text x="77" y="302" font-size="28" fill="#26221B">示范 → 如何作答</text><path d="M 77 327 Q 263 324.44 449 324 Q 449.4 375.52 447 427 Q 263 428.78 77 426 Z" fill="#fffdf8" stroke="#26221B" stroke-width="2.5"/><text x="94" y="365" font-size="26" fill="#26221B">问地点 → 地点未知</text><text x="94" y="405" font-size="26" fill="#26221B">学习条件下的示范</text><text x="28" y="487" font-size="26" fill="#26221B">3</text><text x="77" y="487" font-size="28" fill="#26221B">偏好 → 比较标准</text><path d="M 77 513 Q 262.98 510.2 449 510 Q 446 561.46 447 613 Q 263 614.52 77 612 Z" fill="#F3EAD8" stroke="#26221B" stroke-width="2.5"/><text x="94" y="551" font-size="26" fill="#26221B">有据的回答 &gt; 编造</text><text x="94" y="591" font-size="26" fill="#26221B">标准错，也会奖励错</text><path d="M 28 650 Q 239 649.6 451 652" fill="none" stroke="#26221B" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><text x="29" y="698" font-size="26" fill="#26221B">角色模板：组织输入消息</text><text x="29" y="746" font-size="26" fill="#5C5448">模板本身不执行一次训练</text></g></svg>
