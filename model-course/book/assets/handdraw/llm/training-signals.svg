<svg xmlns="http://www.w3.org/2000/svg" width="480" height="800" viewBox="0 0 480 800" role="img" aria-labelledby="title desc"><title id="title">三种信号，分别在教什么？</title><desc id="desc">普通文本提供续写目标，任务示范提供回答样式，偏好对提供比较标准；消息角色模板另行组织本次输入。</desc><defs><pattern id="figure-grain" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="3" r=".7" fill="#1f2328" opacity=".16"/><circle cx="12" cy="13" r=".55" fill="#1f2328" opacity=".11"/></pattern></defs><rect width="480" height="800" fill="#fbfaf6"/><rect width="480" height="800" fill="url(#figure-grain)" opacity=".34"/><rect x="9" y="9" width="462" height="782" fill="none" stroke="#1f2328" stroke-width=".8" opacity=".22"/><path d="M9 30 V9 H30 M450 9 H471 V30 M9 770 V791 H30 M450 791 H471 V770" fill="none" stroke="#1f2328" stroke-width="1.2" opacity=".38"/><g font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif"><text x="28" y="48" font-size="30" fill="#1f2328">三种信号，分别在教什么？</text><path d="M28 66 Q238 61 448 65" fill="none" stroke="#B4472F" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M47 110 L47 615" fill="none" stroke="#e6e1d4" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><text x="28" y="117" font-size="26" fill="#1f2328">1</text><text x="77" y="117" font-size="28" fill="#1f2328">文本 → 续写目标</text><path d="M77 143 Q263 137 449 140 L447 242 Q263 246 77 241Z" fill="#fffdf8" stroke="#1f2328" stroke-width="2.5"/><text x="94" y="180" font-size="26" fill="#1f2328">周六 14 时开始……</text><text x="94" y="220" font-size="26" fill="#1f2328">比较下一个 token</text><text x="28" y="302" font-size="26" fill="#1f2328">2</text><text x="77" y="302" font-size="28" fill="#1f2328">示范 → 如何作答</text><path d="M77 327 Q263 321 449 324 L447 427 Q263 431 77 426Z" fill="#fffdf8" stroke="#1f2328" stroke-width="2.5"/><text x="94" y="365" font-size="26" fill="#1f2328">问地点 → 地点未知</text><text x="94" y="405" font-size="26" fill="#1f2328">学习条件下的示范</text><text x="28" y="487" font-size="26" fill="#1f2328">3</text><text x="77" y="487" font-size="28" fill="#1f2328">偏好 → 比较标准</text><path d="M77 513 Q263 507 449 510 L447 613 Q263 617 77 612Z" fill="#f0e9d8" stroke="#1f2328" stroke-width="2.5"/><text x="94" y="551" font-size="26" fill="#1f2328">有据的回答 &gt; 编造</text><text x="94" y="591" font-size="26" fill="#1f2328">标准错，也会奖励错</text><path d="M28 650 Q239 645 451 652" fill="none" stroke="#1f2328" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><text x="29" y="698" font-size="26" fill="#1f2328">角色模板：组织输入消息</text><text x="29" y="746" font-size="26" fill="#57606a">模板本身不执行一次训练</text></g></svg>
