<svg xmlns="http://www.w3.org/2000/svg" width="480" height="640" viewBox="0 0 480 640" role="img" aria-labelledby="title desc"><title id="title">先切片，再找编号</title><desc id="desc">Hello, world!及换行按 cl100k_base 分成四片，对应 ID 9906、11、1917、4999；world前空格和末尾换行保留。</desc><g font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif"><text x="27" y="48" font-size="30" fill="#26221B" text-anchor="start">先切片，再找编号</text><path d="M 28 67 Q 232 64.78 451 66" stroke="#B4472F" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="32" y="110" font-size="26" fill="#26221B" text-anchor="start">同一条文字纸带</text><path d="M 28 134 Q 147.6 131.82 452 133 Q 449.88 164.96 450.6 197 Q 290.4 198.36 27 195.4 Q 28.96 164.02 28 134 Z" stroke="#26221B" stroke-width="2.5" fill="#F3EAD8" stroke-linecap="round" stroke-linejoin="round"/><text x="49" y="174" font-size="31" fill="#26221B" text-anchor="start">Hello</text><text x="155" y="174" font-size="31" fill="#26221B" text-anchor="start">,</text><text x="203" y="174" font-size="31" fill="#26221B" text-anchor="start">world</text><text x="353" y="174" font-size="31" fill="#26221B" text-anchor="start">!↵</text><path d="M144 123 L144 211" stroke="#5C5448" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"/><path d="M181 123 L181 211" stroke="#5C5448" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"/><path d="M331 123 L331 211" stroke="#5C5448" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"/><path d="M240 213 Q243 228 240 249" stroke="#B4472F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M234.25044048176275 239.62223025734545 L240 249 L245.74955951823725 239.62223025734545" stroke="#B4472F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="34" y="281" font-size="26" fill="#26221B" te