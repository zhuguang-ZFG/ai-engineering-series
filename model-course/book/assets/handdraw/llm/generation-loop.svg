<svg xmlns="http://www.w3.org/2000/svg" width="480" height="484" viewBox="0 0 480 484" role="img" aria-labelledby="title desc">
  <title id="title">选择、追加、重新计算的生成循环</title>
  <desc id="desc">当前句子得到候选分布，选一个片段接回末尾，更新后的句子成为下一轮输入。图是有限状态教学模型示意。</desc>
  
  <g font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif" fill="#1f2328">
    <text x="24" y="43" font-size="28" font-weight="600">一句话，一步步接出来</text>
    <path d="M24 56q66 7 132 0t88 0" fill="none" stroke="#B4472F" stroke-width="4" stroke-linecap="round"/>
    <rect x="24" y="82" width="380" height="62" rx="10" fill="#fffdf8" stroke="#1f2328" stroke-width="3"/>
    <text x="42" y="121" font-size="27">当前句子：喝了一口…</text>
    <path d="M214 150v28m-8-8 8 8 8-8" fill="none" stroke="#1f2328" stroke-width="3"/>
    <text x="24" y="212" font-size="25">候选</text>
    <g fill="#f0e9d8"><path d="M116 190h188v27H116z"/><path d="M116 230h106v27H116z"/><path d="M116 270h60v27H116z"/></g>
    <g font-size="26"><text x="318" y="212">水</text><text x="234" y="252">茶</text><text x="190" y="292">咖啡</text></g>
    <path d="M214 306v25m-8-8 8 8 8-8" fill="none" stroke="#1f2328" stroke-width="3"/>
    <rect x="24" y="340" width="380" height="62" rx="9" fill="#fffdf8" stroke="#1f2328" stroke-width="3"/>
    <path d="M252 381h120" stroke="#f0e9d8" stroke-width="26"/>
    <text x="42" y="380" font-size="27">选中 → 喝了一口水</text>
    <path d="M411 370h32V110h-27m8-8-8 8 8 8" fill="none" stroke="#B4472F" stroke-width="3.5" stroke-linejoin="round"/>
    <text x="24" y="452" font-size="25" fill="#57606a">接回末尾，再算新的候选</text>
  </g>
</svg>
