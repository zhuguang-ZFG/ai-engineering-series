<svg xmlns="http://www.w3.org/2000/svg" width="480" height="640" viewBox="0 0 480 640" role="img" aria-labelledby="title desc"><title id="title">什么时候才拧旋钮</title><desc id="desc">上半幅训练把预测与目标比较，误差反馈到可调参数旋钮；下半幅推理只读取现有旋钮位置并给出预测，没有参数更新箭头。</desc><g font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif"><text x="27" y="48" font-size="30" fill="#1f2328" text-anchor="start">什么时候才拧旋钮</text><path d="M28 67 Q232 61 451 66" stroke="#B4472F" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="29" y="111" font-size="27" fill="#1f2328" text-anchor="start">训练：看误差，改参数</text><path d="M31 143 L109 141 L131 163 L129 246 L33 245Z M109 141 L109 164 L131 163" stroke="#1f2328" stroke-width="2.5" fill="#fffdf8" stroke-linecap="round" stroke-linejoin="round"/><text x="82" y="186" font-size="27" fill="#1f2328" text-anchor="middle">目标</text><text x="82" y="225" font-size="30" fill="#1f2328" text-anchor="middle">水</text><path d="M143 191 Q173.5 188 198 191" stroke="#B4472F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M188.62223025734545 196.74955951823725 L198 191 L188.62223025734545 185.25044048176275" stroke="#B4472F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="266" cy="192" r="56" fill="#f0e9d8" stroke="#1f2328" stroke-width="2.7"/><circle cx="266" cy="192" r="35" fill="#fffdf8" stroke="#1f2328" stroke-width="2.7"/><path d="M266 192 L288 165" stroke="#1f2328" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="389" y="187" font-size="27" fill="#1f2328" text-anchor="middle">参数</text><path d="M323 210 Q407 242 354 270 Q291 288 235 253" stroke="#B4472F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M243 268 L235 253 L252 254" stroke="#B4472F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="141" y="323" font-size="26" fill="#1f2328" text-anchor="start">预测和目标有差距</text><path d="M28 345 L451 345" stroke="#e6e1d4" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="29" y="389" font-size="27" fill="#1f2328" text-anchor="start">推理：读取参数，给出预测</text><circle cx="107" cy="463" r="48" fill="#fffdf8" stroke="#1f2328" stroke-width="2.7"/><circle cx="107" cy="463" r="30" fill="#fffdf8" stroke="#1f2328" stroke-width="2.7"/><path d="M107 463 L126 439" stroke="#1f2328" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M79 517 L79 537 L133 537 L133 517" stroke="#1f2328" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="107" y="559" font-size="25" fill="#1f2328" text-anchor="middle">不更新</text><path d="M168 464 Q209.5 461 245 464" stroke="#B4472F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M235.62223025734545 469.7495595182373 L245 464 L235.62223025734545 458.2504404817627" stroke="#B4472F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M277 420 L409 418 L431 440 L429 536 L279 535Z M409 418 L409 441 L431 440" stroke="#1f2328" stroke-width="2.5" fill="#f0e9d8" stroke-linecap="round" stroke-linejoin="round"/><text x="354" y="466" font-size="28" fill="#1f2328" text-anchor="middle">预测</text><text x="354" y="510" font-size="25" fill="#1f2328" text-anchor="middle">下一片段</text><path d="M28 572 L451 572" stroke="#e6e1d4" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="28" y="591" font-size="24" fill="#57606a" text-anchor="start">训练会沿损失的梯度更新参数。</text><text x="28" y="627" font-size="24" fill="#57606a" text-anchor="start">换提问，通常只是换了输入。</text></g></svg>
