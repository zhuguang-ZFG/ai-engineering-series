<svg xmlns="http://www.w3.org/2000/svg" width="480" height="660" viewBox="0 0 480 660" role="img" aria-labelledby="title desc"><title id="title">六次故障注入，各能证明什么</title><desc id="desc">每次故障都要保存请求、HTTP 码、响应体和时间。预期状态只说明入口拒绝了什么，不说明内部一定没执行、缓存一定没用、权限一定生效。</desc><g font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif" fill="#26221B"><text x="26" y="42" font-size="26" text-anchor="start" fill="#26221B" font-weight="600">六次故障注入，各能证明什么</text><path d="M26 56Q140 53 250 56" fill="none" stroke="#B4472F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M26 76H454" fill="none" stroke="#E3D8C1" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="26" y="104" font-size="20" text-anchor="start" fill="#26221B" font-weight="600">1. 停掉服务</text><text x="454" y="104" font-size="17" text-anchor="end" fill="#B4472F" font-weight="400">连接被拒或超时</text><text x="26" y="134" font-size="17" text-anchor="start" fill="#5C5448" font-weight="400">不能推出服务一定没执行</text><path d="M26 160H454" fill="none" stroke="#E3D8C1" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="26" y="188" font-size="20" text-anchor="start" fill="#26221B" font-weight="600">2. 换错模型路径</text><text x="454" y="188" font-size="17" text-anchor="end" fill="#B4472F" font-weight="400">502 model-unavailable</text><text x="26" y="218" font-size="17" text-anchor="start" fill="#5C5448" font-weight="400">健康检查 200 是假阳性</text><path d="M26 244H454" fill="none" stroke="#E3D8C1" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="26" y="272" font-size="20" text-anchor="start" fill="#26221B" font-weight="600">3. 发非法 JSON</text><text x="454" y="272" font-size="17" text-anchor="end" fill="#B4472F" font-weight="400">400/413 invalid-request</text><text x="26" y="302" font-size="17" text-anchor="start" fill="#5C5448" font-weight="400">请求没有进入模型</text><path d="M26 328H454" fill="none" stroke="#E3D8C1" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="26" y="356" font-size="20" text-anchor="start" fill="#26221B" font-weight="600">4. 源文件缺失或改版</text><text x="454" y="356" font-size="17" text-anchor="end" fill="#B4472F" font-weight="400">409 missing-source</text><text x="26" y="386" font-size="17" text-anchor="start" fill="#5C5448" font-weight="400">不能拿缓存或旧版本顶上</text><path d="M26 412H454" fill="none" stroke="#E3D8C1" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="26" y="440" font-size="20" text-anchor="start" fill="#26221B" font-weight="600">5. 用无权读者提问</text><text x="454" y="440" font-size="17" text-anchor="end" fill="#B4472F" font-weight="400">403 或 insufficient-evidence</text><text x="26" y="470" font-size="17" text-anchor="start" fill="#5C5448" font-weight="400">无权限正文没有进提示与日志</text><path d="M26 496H454" fill="none" stroke="#E3D8C1" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="26" y="524" font-size="20" text-anchor="start" fill="#26221B" font-weight="600">6. 构造超时或断网</text><text x="454" y="524" font-size="17" text-anchor="end" fill="#5C5448" font-weight="400">未知，保留未知状态</text><text x="26" y="554" font-size="17" text-anchor="start" fill="#5C5448" font-weight="400">不等于服务没有答案</text><path d="M26 620H454" fill="none" stroke="#E3D8C1" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="26" y="648" font-size="18" text-anchor="start" fill="#5C5448" font-weight="400">记录实际结果；不要为演示 403 去改代码</text></g></svg>
