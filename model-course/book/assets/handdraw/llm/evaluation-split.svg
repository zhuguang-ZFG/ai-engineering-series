<svg xmlns="http://www.w3.org/2000/svg" width="480" height="800" viewBox="0 0 480 800" role="img" aria-labelledby="title desc"><title id="title">先留一份没见过的材料</title><desc id="desc">开发材料用于修改提示和参数，验证材料用于选择方案，保留测试材料用于最后独立评估；图中没有真实试读成绩。</desc><g font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif"><text x="28" y="48" font-size="30" fill="#1f2328">先留一份没见过的材料</text><path d="M28 66 Q238 61 448 65" fill="none" stroke="#B4472F" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M28 107 Q239 101 450 104 L448 238 Q239 242 28 237Z" fill="#fffdf8" stroke="#1f2328" stroke-width="2.5"/><text x="48" y="146" font-size="28" fill="#1f2328">开发材料</text><text x="48" y="191" font-size="26" fill="#1f2328">修改提示、流程或参数</text><text x="48" y="226" font-size="26" fill="#57606a">反复查错，允许重做</text><path d="M63 284 Q256.5 278 450 281 L448 414 Q256.5 418 63 413Z" fill="#fffdf8" stroke="#1f2328" stroke-width="2.5"/><text x="83" y="325" font-size="28" fill="#1f2328">验证材料</text><text x="83" y="370" font-size="26" fill="#1f2328">比较方法，选择方案</text><path d="M55 360 Q15 357 15 265 Q15 215 27 200 M19 207 L27 200 L32 212" fill="none" stroke="#B4472F" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><text x="93" y="450" font-size="26" fill="#1f2328">最后才打开保留材料</text><path d="M240 465 Q237 482.5 240 500 M231 489 L240 500 L249 489" fill="none" stroke="#B4472F" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M28 517 Q239 511 450 514 L448 665 Q239 669 28 664Z" fill="#f0e9d8" stroke="#1f2328" stroke-width="2.5"/><text x="48" y="558" font-size="28" fill="#1f2328">保留测试材料</text><text x="48" y="603" font-size="26" fill="#1f2328">检查陌生输入与失败情况</text><text x="48" y="642" font-size="26" fill="#1f2328">记录样本数、范围与错误</text><text x="28" y="716" font-size="26" fill="#1f2328">反复看测试题再改，会影响评估</text><text x="28" y="768" font-size="26" fill="#57606a">图中是流程，不是真人试读成绩</text><g pointer-events="none"><rect x="24" y="100" width="430" height="142" rx="10" fill="none" stroke="#B4472F" stroke-width="4" opacity="0"><animate attributeName="opacity" values="0;0.85;0.85;0" keyTimes="0;0.12;0.8;1" dur="7.800000000000001s" begin="0.00s" repeatCount="indefinite"/></rect><rect x="59" y="277" width="395" height="141" rx="10" fill="none" stroke="#B4472F" stroke-width="4" opacity="0"><animate attributeName="opacity" values="0;0.85;0.85;0" keyTimes="0;0.12;0.8;1" dur="7.800000000000001s" begin="2.60s" repeatCount="indefinite"/></rect><rect x="24" y="510" width="430" height="159" rx="10" fill="none" stroke="#B4472F" stroke-width="4" opacity="0"><animate attributeName="opacity" values="0;0.85;0.85;0" keyTimes="0;0.12;0.8;1" dur="7.800000000000001s" begin="5.20s" repeatCount="indefinite"/></rect></g></g></svg>
