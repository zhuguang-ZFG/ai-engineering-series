<svg xmlns="http://www.w3.org/2000/svg" width="480" height="716" viewBox="0 0 480 716" role="img" aria-labelledby="title desc"><title id="title">四种手段，四种持久性</title><desc id="desc">同一个效果的四种来源：改输入只在本次生效，改参数写进权重，改解码只改选择方式，加外部状态不碰参数。判据是关掉哪一层之后效果还在不在。</desc><g font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif" fill="#26221B"><text x="26" y="42" font-size="28" text-anchor="start" fill="#26221B" font-weight="600">四种手段，四种持久性</text><path d="M26 56Q140 53 250 56" fill="none" stroke="#B4472F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M26 92H454" fill="none" stroke="#E3D8C1" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="26" y="126" font-size="24" text-anchor="start" fill="#26221B" font-weight="600">改输入</text><text x="26" y="160" font-size="20" text-anchor="start" fill="#5C5448" font-weight="400">换提示词、贴资料、改聊天模板</text><text x="26" y="194" font-size="20" text-anchor="start" fill="#26221B" font-weight="400">本次有效，重开就没了</text><path d="M26 240H454" fill="none" stroke="#E3D8C1" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="26" y="274" font-size="24" text-anchor="start" fill="#B4472F" font-weight="600">改参数</text><text x="26" y="308" font-size="20" text-anchor="start" fill="#5C5448" font-weight="400">训练一步、微调一批数据</text><text x="26" y="342" font-size="20" text-anchor="start" fill="#B4472F" font-weight="400">写进权重，换设备还在</text><path d="M26 388H454" fill="none" stroke="#E3D8C1" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="26" y="422" font-size="24" text-anchor="start" fill="#26221B" font-weight="600">改解码</text><text x="26" y="456" font-size="20" text-anchor="start" fill="#5C5448" font-weight="400">调温度、改 top-p、换采样</text><text x="26" y="490" font-size="20" text-anchor="start" fill="#26221B" font-weight="400">分布不变，只改怎么选</text><path d="M26 536H454" fill="none" stroke="#E3D8C1" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="26" y="570" font-size="24" text-anchor="start" fill="#26221B" font-weight="600">加外部状态</text><text x="26" y="604" font-size="20" text-anchor="start" fill="#5C5448" font-weight="400">检索、缓存、工具返回</text><text x="26" y="638" font-size="20" text-anchor="start" fill="#26221B" font-weight="400">不改参数，资料换了答案跟着换</text><path d="M26 676H454" fill="none" stroke="#E3D8C1" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="26" y="700" font-size="20" text-anchor="start" fill="#5C5448" font-weight="400">四种可叠加；看关掉哪一个后还剩什么</text></g></svg>
