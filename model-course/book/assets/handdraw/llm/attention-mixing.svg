<svg xmlns="http://www.w3.org/2000/svg" width="480" height="640" viewBox="0 0 480 640" role="img" aria-labelledby="title desc"><title id="title">权重决定各取多少</title><desc id="desc">Q与K比较得到两项权重0.75和0.25，分别乘V1=[2,0]与V2=[0,4]，汇合为[1.5,1]。杯中填充比例表示权重。</desc><g font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif"><text x="27" y="48" font-size="30" fill="#26221B" text-anchor="start">权重决定各取多少</text><path d="M 28 67 Q 232 64.78 451 66" stroke="#B4472F" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="34" y="111" font-size="28" fill="#26221B" text-anchor="start">Q 与 K 比较 → 权重</text><path d="M100 149 L112 173 L140 177 L119 197 L124 225 L100 212 L75 225 L80 197 L60 177 L88 173Z" stroke="#26221B" stroke-width="2.4" fill="#F3EAD8" stroke-linecap="round" stroke-linejoin="round"/><text x="100" y="194" font-size="27" fill="#26221B" text-anchor="middle">Q</text><path d="M 153 186 Q 186 184.46 213 186" stroke="#B4472F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M203.62223025734545 191.74955951823725 L213 186 L203.62223025734545 180.25044048176275" stroke="#B4472F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="228" y="196" font-size="28" fill="#26221B" text-anchor="start">K₁ / K₂</text><path d="M 332 186 Q 369.2 210.66 404 236" stroke="#B4472F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M393.0178569327372 235.37347494050871 L404 236 L399.57690624403034 225.9284439322465" stroke="#B4472F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="104" y="281" font-size="30" fill="#26221B" text-anchor="middle">0.75</text><text x="356" y="281" font-size="30" fill="#26221B" text-anchor="middle">0.25</text><path d="M 59 307 Q 105 305 151 307 Q 148.04 355.22 141 403 Q 105 403.9 69 403 Z" stroke="#26221B" stroke-width="2.7" fill="#fffdf8" stroke-linecap="round" stroke-linejoin="round"/><path d="M 65 335 Q 105.5 336.94 146 335 Q 142.14 368.9 141 403 Q 105 403.9 69 403 Z" stroke="#26221B" stroke-width="1.5" fill="#F3EAD8" stroke-linecap="round" stroke-linejoin="round"/><path d="M 311 307 Q 357 309.08 403 307 Q 399.12 355.12 393 403 Q 357 404.42 321 403 Z" stroke="#26221B" stroke-width="2.7" fill="#fffdf8" stroke-linecap="round" stroke-linejoin="round"/><path d="M 318 380 Q 356.5 378.98 395 380 L 393 403 Q 357 404.42 321 403 Z" stroke="#26221B" stroke-width="1.5" fill="#F3EAD8" stroke-linecap="round" stroke-linejoin="round"/><text x="105" y="438" font-size="25" fill="#26221B" text-anchor="middle">V₁=[2,0]</text><text x="357" y="438" font-size="25" fill="#26221B" text-anchor="middle">V₂=[0,4]</text><path d="M 130 454 Q 172.5 472.56 211 493" stroke="#B4472F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M200.05636508317616 494.1121397426916 L211 493 L205.0448625233276 483.7514142900694" stroke="#B4472F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M 335 454 Q 305.12 469.92 270 493" stroke="#B4472F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M275.08324724557644 483.24497065917586 L270 493 L280.99949518099845 493.1053838848792" stroke="#B4472F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="240" y="533" font-size="31" fill="#26221B" text-anchor="middle">输出 = [1.5, 1]</text><path d="M 28 572 Q 239.5 573.6 451 572" stroke="#E3D8C1" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="28" y="591" font-size="24" fill="#5C5448" text-anchor="start">0.75 × [2,0] + 0.25 × [0,4]</text><text x="28" y="627" font-size="24" fill="#5C5448" text-anchor="start">独立手算例子，不是实验矩阵。</text></g></svg>
