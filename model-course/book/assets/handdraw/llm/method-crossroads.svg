<svg xmlns="http://www.w3.org/2000/svg" width="480" height="640" viewBox="0 0 480 640" role="img" aria-labelledby="title desc"><title id="title">先找缺口，再选办法</title><desc id="desc">中心任务分向四个缺口：要求不清改提示词，缺少资料用RAG，需稳定学习做法考虑微调，需要真实操作接工具。</desc><defs><pattern id="figure-grain" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="3" r=".7" fill="#1f2328" opacity=".16"/><circle cx="12" cy="13" r=".55" fill="#1f2328" opacity=".11"/></pattern></defs><rect width="480" height="640" fill="#fbfaf6"/><rect width="480" height="640" fill="url(#figure-grain)" opacity=".34"/><rect x="9" y="9" width="462" height="622" fill="none" stroke="#1f2328" stroke-width=".8" opacity=".22"/><path d="M9 30 V9 H30 M450 9 H471 V30 M9 610 V631 H30 M450 631 H471 V610" fill="none" stroke="#1f2328" stroke-width="1.2" opacity=".38"/><g font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif"><text x="27" y="48" font-size="30" fill="#1f2328" text-anchor="start">先找缺口，再选办法</text><path d="M28 67 Q232 61 451 66" stroke="#B4472F" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="240" cy="302" r="68" fill="#f0e9d8" stroke="#1f2328" stroke-width="2.7"/><text x="240" y="287" font-size="26" fill="#1f2328" text-anchor="middle">任务卡在</text><text x="240" y="332" font-size="31" fill="#1f2328" text-anchor="middle">哪里？</text><path d="M211 223 Q177.5 195 138 173" stroke="#B4472F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M148.9859537575798 173.55571578735712 L138 173 L142.48792801480397 183.04283337180985" stroke="#B4472F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M273 223 Q316.5 195 354 173" stroke="#B4472F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M349.0401836436618 182.81836145756512 L354 173 L343.0000505430563 173.03334583458422" stroke="#B4472F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M211 382 Q177 403.5 137 431" stroke="#B4472F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M141.6446771444945 421.02869245166863 L137 431 L147.99331021452582 430.6164240268179" stroke="#B4472F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M272 382 Q315.5 403.5 353 431" stroke="#B4472F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M342.0001951930318 431.0655302113475 L353 431 L347.95213019646155 421.2266172464942" stroke="#B4472F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M25 100 L187 98 L209 120 L207 206 L27 205Z M187 98 L187 121 L209 120" stroke="#1f2328" stroke-width="2.5" fill="#fffdf8" stroke-linecap="round" stroke-linejoin="round"/><text x="117" y="141" font-size="26" fill="#1f2328" text-anchor="middle">要求不清</text><text x="117" y="180" font-size="28" fill="#1f2328" text-anchor="middle">改提示词</text><path d="M270 100 L432 98 L454 120 L452 206 L272 205Z M432 98 L432 121 L454 120" stroke="#1f2328" stroke-width="2.5" fill="#fffdf8" stroke-linecap="round" stroke-linejoin="round"/><text x="362" y="141" font-size="26" fill="#1f2328" text-anchor="middle">缺少资料</text><text x="362" y="180" font-size="28" fill="#1f2328" text-anchor="middle">用 RAG</text><path d="M25 445 L187 443 L209 465 L207 551 L27 550Z M187 443 L187 466 L209 465" stroke="#1f2328" stroke-width="2.5" fill="#fffdf8" stroke-linecap="round" stroke-linejoin="round"/><text x="117" y="484" font-size="25" fill="#1f2328" text-anchor="middle">稳定学做法</text><text x="117" y="525" font-size="28" fill="#1f2328" text-anchor="middle">考虑微调</text><path d="M270 445 L432 443 L454 465 L452 551 L272 550Z M432 443 L432 466 L454 465" stroke="#1f2328" stroke-width="2.5" fill="#fffdf8" stroke-linecap="round" stroke-linejoin="round"/><text x="362" y="484" font-size="25" fill="#1f2328" text-anchor="middle">需要真操作</text><text x="362" y="525" font-size="28"