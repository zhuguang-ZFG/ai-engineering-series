<svg xmlns="http://www.w3.org/2000/svg" width="480" height="820" viewBox="0 0 480 820" role="img" aria-labelledby="title desc"><title id="title">答错了，资料在哪一步丢了？</title><desc id="desc">第一种失败是没取回含地点的通知，第二种是取回了通知B但答案仍写错地点；应分别检查检索和资料使用。</desc><g font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif"><text x="28" y="48" font-size="30" fill="#26221B">答错了，资料在哪一步丢了？</text><path d="M 28 66 Q 238 64.32 448 65" fill="none" stroke="#B4472F" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><text x="28" y="112" font-size="28" fill="#26221B">第一种：没拿到相关片段</text><path d="M 28 140 Q 238.98 136.48 450 137 Q 451.16 186.54 448 236 Q 239 237.16 28 235 Z" fill="#fffdf8" stroke="#26221B" stroke-width="2.5"/><text x="48" y="178" font-size="26" fill="#26221B">只取回 A：周六 14 时</text><text x="48" y="219" font-size="26" fill="#26221B">A 没写地点</text><path d="M240 249 Q237 265.5 240 282 M231 271 L240 282 L249 271" fill="none" stroke="#B4472F" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><text x="51" y="325" font-size="26" fill="#26221B">结果：本次没有地点依据</text><path d="M 49 338 Q 232 335.84 415 337" fill="none" stroke="#B4472F" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><text x="52" y="379" font-size="26" fill="#26221B">先查查询、切块和取回内容</text><path d="M 28 417 Q 240 418.04 451 416" fill="none" stroke="#E3D8C1" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><text x="28" y="467" font-size="28" fill="#26221B">第二种：拿到了，仍然用错</text><path d="M 28 492 Q 238.98 488.22 450 489 Q 447.86 538.48 448 588 Q 239 589.66 28 587 Z" fill="#F3EAD8" stroke="#26221B" stroke-width="2.5"/><text x="48" y="530" font-size="26" fill="#26221B">取回 B：社区阅览室</text><path d="M 48 544 Q 180 541.2 312 543" fill="none" stroke="#B4472F" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M240 600 Q237 616.5 240 633 M231 622 L240 633 L249 622" fill="none" stroke="#B4472F" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><text x="49" y="677" font-size="26" fill="#26221B">却回答：城市图书馆</text><path d="M 180 650 Q 275.8 665.82 371 685 M 180 685 Q 275.7 668.62 371 650" fill="none" stroke="#5C5448" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><text x="49" y="730" font-size="26" fill="#26221B">查引用和主张是否真正对应</text><text x="49" y="777" font-size="26" fill="#5C5448">两种失败，需要不同的修正</text></g></svg>
