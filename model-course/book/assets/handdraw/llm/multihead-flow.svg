<svg xmlns="http://www.w3.org/2000/svg" width="480" height="640" viewBox="0 0 480 640" role="img" aria-labelledby="title desc"><title id="title">两条支路，拼接后再混合</title><desc id="desc">D14人工双头矩阵：位置1只看位置0与1。头1取第一维，权重0.5/0.5，输出0.5；头2取第二维，权重0.2689/0.7311，输出0.7311。拼接后乘WO，输出[1.2311,-0.2311]。条长按实际权重绘制。</desc><defs><pattern id="figure-grain" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="3" r=".7" fill="#1f2328" opacity=".16"/><circle cx="12" cy="13" r=".55" fill="#1f2328" opacity=".11"/></pattern></defs><rect width="480" height="640" fill="#fbfaf6"/><rect width="480" height="640" fill="url(#figure-grain)" opacity=".34"/><rect x="9" y="9" width="462" height="622" fill="none" stroke="#1f2328" stroke-width=".8" opacity=".22"/><path d="M9 30 V9 H30 M450 9 H471 V30 M9 610 V631 H30 M450 631 H471 V610" fill="none" stroke="#1f2328" stroke-width="1.2" opacity=".38"/><g font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif"><text x="28" y="43" font-size="30" text-anchor="start" fill="#1f2328">两条支路，拼接后再混合</text><path d="M28 59 Q132 55 226 59" fill="none" stroke="#B4472F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="240" y="99" font-size="27" text-anchor="middle" fill="#1f2328">X → 两组独立的 Q / K / V</text><path d="M240 113 V130 M120 148 V130 H360 V148" fill="none" stroke="#1f2328" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/><text x="120" y="184" font-size="28" text-anchor="middle" fill="#1f2328">头 1</text><text x="120" y="221" font-size="25" text-anchor="middle" fill="#1f2328">投影取第一维</text><rect x="30" y="240" width="90" height="25" fill="#e6e1d4"/><rect x="120" y="240" width="90" height="25" fill="#f0e9d8"/><text x="120" y="299" font-size="25" text-anchor="middle" fill="#1f2328">0.500 / 0.500</text><path d="M120 313 Q118.5 325 120 337 M114 329 L120 337 L126 329" fill="none" stroke="#B4472F" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><text x="120" y="373" font-size="34" text-anchor="middle" fill="#1f2328">0.5000</text><path d="M120 386 Q118.5 397 120 408 M114 400 L120 408 L126 400" fill="none" stroke="#1f2328" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><text x="360" y="184" font-size="28" text-anchor="middle" fill="#1f2328">头 2</text><text x="360" y="221" font-size="25" text-anchor="middle" fill="#1f2328">投影取第二维</text><rect x="270" y="240" width="48.409455846599116" height="25" fill="#e6e1d4"/><rect x="318.40945584659914" y="240" width="131.59054415340088" height="25" fill="#f0e9d8"/><text x="360" y="299" font-size="25" text-anchor="middle" fill="#1f2328">0.269 / 0.731</text><path d="M360 313 Q358.5 325 360 337 M354 329 L360 337 L366 329" fill="none" stroke="#B4472F" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><text x="360" y="373" font-size="34" text-anchor="middle" fill="#1f2328">0.7311</text><path d="M360 386 Q358.5 397 360 408 M354 400 L360 408 L366 400" fill="none" stroke="#1f2328" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M31 422 Q134 419 240 423 L239 468 Q134 471 28 467Z" fill="#e6e1d4" stroke="#1f2328" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M243 422 Q346 419 452 423 L451 468 Q346 471 240 467Z" fill="#f0e9d8" stroke="#1f2328" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="134" y="455" font-size="29" text-anchor="middle" fill="#1f2328">0.5000</text><text x="346" y="455" font-size="29" text-anchor="middle" fill="#1f2328">0.7311</text><text x="240" y="510" font-size="25" text-anchor="middle" fill="#1f2328">拼接 1×2 → 乘 Wᴼ（2×2）</text><text x="240" y="555" font-size="31" text-anchor="middle" fill="#1f2328">[1.2311, −0.2311]</text><text x="28" y="618" font-size="24" text-anchor="start" fill="#1f2328">未来位置 2 遮住；仅演示两个头</text><path d="M28 583 Q240 581 452 583" fill="none" stroke="#e6e1d4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g></svg>
