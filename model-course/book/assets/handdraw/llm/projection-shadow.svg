<svg xmlns="http://www.w3.org/2000/svg" width="480" height="640" viewBox="0 0 480 640" role="img" aria-labelledby="title desc"><title id="title">影子重合，原物不同</title><desc id="desc">三维中的两点x和y相同而z分别为0.95和0.1，沿z方向投到平面后重合；二维重合不能推出原向量相同。</desc><g font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif"><text x="27" y="48" font-size="30" fill="#26221B" text-anchor="start">影子重合，原物不同</text><path d="M 28 67 Q 232 64.78 451 66" stroke="#B4472F" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M 68 349 Q 65.72 240.5 68 132 M 68 349 Q 239.5 350.5 411 350 M 68 349 Q 127.18 300.36 184 249" stroke="#26221B" stroke-width="2.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="48" y="122" font-size="26" fill="#26221B" text-anchor="start">z</text><text x="423" y="358" font-size="26" fill="#26221B" text-anchor="start">x</text><text x="188" y="247" font-size="26" fill="#26221B" text-anchor="start">y</text><path d="M297 172 L297 327" stroke="#5C5448" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7"/><circle cx="297" cy="172" r="13" fill="#F3EAD8" stroke="#26221B" stroke-width="2.7"/><circle cx="297" cy="310" r="13" fill="#fffdf8" stroke="#26221B" stroke-width="2.7"/><text x="29" y="405" font-size="27" fill="#26221B" text-anchor="start">只看前两维</text><text x="29" y="451" font-size="27" fill="#26221B" text-anchor="start">[.9, .1, .95]</text><text x="29" y="491" font-size="27" fill="#26221B" text-anchor="start">[.9, .1, .1]</text><path d="M 291 373 Q 351.5 374.98 412 373 Q 432.74 459.02 449 546 Q 352.5 547.64 256 546 Z" stroke="#26221B" stroke-width="2.5" fill="#E3D8C1" stroke-linecap="round" stroke-linejoin="round"/><path d="M 347 384 Q 348.1 422 347 466" stroke="#B4472F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M341.2504404817627 456.62223025734545 L347 466 L352.7495595182373 456.62223025734545" stroke="#B4472F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="347" cy="496" r="15" fill="#F3EAD8" stroke="#26221B" stroke-width="2.7"/><circle cx="347" cy="496" r="8" fill="#fffdf8" stroke="#26221B" stroke-width="2.7"/><text x="347" y="537" font-size="24" fill="#26221B" text-anchor="middle">二维投影</text><path d="M 28 572 Q 239.5 573.6 451 572" stroke="#E3D8C1" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="28" y="591" font-size="24" fill="#5C5448" text-anchor="start">二维图没画出的维度仍然存在。</text><text x="28" y="627" font-size="24" fill="#5C5448" text-anchor="start">比较余弦时用完整向量。</text></g></svg>
