<svg xmlns="http://www.w3.org/2000/svg" width="480" height="640" viewBox="0 0 480 640" role="img" aria-labelledby="title desc"><title id="title">说得漂亮，依据在哪</title><desc id="desc">上方虚构回答礼貌且自信地说城市图书馆，下方通知A只有周六14时而未写地点，连接箭头指向空白地点栏。</desc><g font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif"><text x="27" y="48" font-size="30" fill="#26221B" text-anchor="start">说得漂亮，依据在哪</text><path d="M28 67 Q232 61 451 66" stroke="#B4472F" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M35 109 Q241 99 442 109 L442 258 L329 258 L296 288 L298 258 L35 258Z" stroke="#26221B" stroke-width="3" fill="#F3EAD8" stroke-linecap="round" stroke-linejoin="round"/><text x="60" y="155" font-size="25" fill="#26221B" text-anchor="start">“当然可以！</text><text x="60" y="194" font-size="25" fill="#26221B" text-anchor="start">读书会在城市图书馆。</text><text x="60" y="233" font-size="25" fill="#26221B" text-anchor="start">祝你参加愉快！”</text><path d="M304 302 Q307 318.5 304 341" stroke="#B4472F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M298.2504404817627 331.62223025734545 L304 341 L309.7495595182373 331.62223025734545" stroke="#B4472F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M54 361 L404 359 L426 381 L424 536 L56 535Z M404 359 L404 382 L426 381" stroke="#26221B" stroke-width="2.5" fill="#fffdf8" stroke-linecap="round" stroke-linejoin="round"/><text x="79" y="402" font-size="28" fill="#26221B" text-anchor="start">原通知 A</text><path d="M77 419 L400 419" stroke="#E3D8C1" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="79" y="457" font-size="26" fill="#26221B" text-anchor="start">时间：周六 14:00</text><text x="79" y="508" font-size="26" fill="#26221B" text-anchor="start">地点：</text><path d="M165 526 Q268 520 394 526" stroke="#B4472F" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="284" y="514" font-size="34" fill="#26221B" text-anchor="middle">？</text><path d="M28 572 L451 572" stroke="#E3D8C1" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="28" y="591" font-size="24" fill="#5C5448" text-anchor="start">语气礼貌，不会补出缺失证据。</text><text x="28" y="627" font-size="24" fill="#5C5448" text-anchor="start">地点要从材料里找。</text></g></svg>
