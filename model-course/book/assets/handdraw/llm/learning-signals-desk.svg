<svg xmlns="http://www.w3.org/2000/svg" width="480" height="640" viewBox="0 0 480 640" role="img" aria-labelledby="title desc"><title id="title">三种练习，教三件事</title><desc id="desc">续写卷保留下一片段目标，示范卷展示问地点却缺材料时回答未知，偏好卷比较有据与编造两份答案。角色模板另负责输入格式。</desc><g font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif"><text x="27" y="48" font-size="30" fill="#26221B" text-anchor="start">三种练习，教三件事</text><path d="M 28 67 Q 232 64.78 451 66" stroke="#B4472F" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="42" cy="117" r="19" fill="#F3EAD8" stroke="#26221B" stroke-width="2.7"/><text x="42" y="126" font-size="25" fill="#26221B" text-anchor="middle">1</text><text x="79" y="126" font-size="27" fill="#26221B" text-anchor="start">续写：后面接什么</text><path d="M 75 148 Q 246.48 145.22 418 146 L 440 168 Q 436.94 199.94 438 232 Q 257.5 233.5 77 231 Z M 418 146 L 418 169 L 440 168" stroke="#26221B" stroke-width="2.5" fill="#fffdf8" stroke-linecap="round" stroke-linejoin="round"/><text x="95" y="186" font-size="28" fill="#26221B" text-anchor="start">周六 14 时……</text><path d="M 93 212 Q 170 212.92 247 212" stroke="#5C5448" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="321" y="216" font-size="24" fill="#26221B" text-anchor="start">目标</text><circle cx="42" cy="286" r="19" fill="#F3EAD8" stroke="#26221B" stroke-width="2.7"/><text x="42" y="295" font-size="25" fill="#26221B" text-anchor="middle">2</text><text x="79" y="295" font-size="27" fill="#26221B" text-anchor="start">示范：怎样回答</text><path d="M 77 318 Q 257.5 318.98 438 318 Q 436.62 356.5 438 395 Q 282 396.7 126 395 L 104 411 L 105 395 L 77 395 Z" stroke="#26221B" stroke-width="2.5" fill="#F3EAD8" stroke-linecap="round" stroke-linejoin="round"/><text x="95" y="351" font-size="26" fill="#26221B" text-anchor="start">问地点 → 地点未知</text><text x="95" y="384" font-size="24" fill="#26221B" text-anchor="start">照着合适的回答学</text><circle cx="42" cy="458" r="19" fill="#F3EAD8" stroke="#26221B" stroke-width="2.7"/><text x="42" y="467" font-size="25" fill="#26221B" text-anchor="middle">3</text><text x="79" y="467" font-size="27" fill="#26221B" text-anchor="start">偏好：两份选哪份</text><path d="M 134 526 Q 254.5 528 375 526 M 255 494 Q 253.12 524 255 554 M 230 554 L 280 554" stroke="#26221B" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="151" cy="526" r="28" fill="#F3EAD8" stroke="#26221B" stroke-width="2.7"/><path d="M137 529 l9 10 l20 -26" stroke="#B4472F" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="357" cy="526" r="28" fill="#FFFDF8" stroke="#26221B" stroke-width="2.7"/><path d="M346 515 l22 22 M346 537 l22 -22" stroke="#B4472F" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M 28 572 Q 239.5 573.6 451 572" stroke="#E3D8C1" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="28" y="591" font-size="24" fill="#5C5448" text-anchor="start">三类信号改变不同的行为倾向。</text><text x="28" y="627" font-size="24" fill="#5C5448" text-anchor="start">聊天角色模板负责组织消息。</text></g></svg>
