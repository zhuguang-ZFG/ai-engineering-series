<svg xmlns="http://www.w3.org/2000/svg" width="480" height="640" viewBox="0 0 480 640" role="img" aria-labelledby="title desc"><title id="title">三种练习，教三件事</title><desc id="desc">续写卷保留下一片段目标，示范卷展示问地点却缺材料时回答未知，偏好卷比较有据与编造两份答案。角色模板另负责输入格式。</desc><defs><pattern id="figure-grain" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="3" r=".7" fill="#1f2328" opacity=".16"/><circle cx="12" cy="13" r=".55" fill="#1f2328" opacity=".11"/></pattern></defs><rect width="480" height="640" fill="#fbfaf6"/><rect width="480" height="640" fill="url(#figure-grain)" opacity=".34"/><rect x="9" y="9" width="462" height="622" fill="none" stroke="#1f2328" stroke-width=".8" opacity=".22"/><path d="M9 30 V9 H30 M450 9 H471 V30 M9 610 V631 H30 M450 631 H471 V610" fill="none" stroke="#1f2328" stroke-width="1.2" opacity=".38"/><g font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif"><text x="27" y="48" font-size="30" fill="#1f2328" text-anchor="start">三种练习，教三件事</text><path d="M28 67 Q232 61 451 66" stroke="#B4472F" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="42" cy="117" r="19" fill="#f0e9d8" stroke="#1f2328" stroke-width="2.7"/><text x="42" y="126" font-size="25" fill="#1f2328" text-anchor="middle">1</text><text x="79" y="126" font-size="27" fill="#1f2328" text-anchor="start">续写：后面接什么</text><path d="M75 148 L418 146 L440 168 L438 232 L77 231Z M418 146 L418 169 L440 168" stroke="#1f2328" stroke-width="2.5" fill="#fffdf8" stroke-linecap="round" stroke-linejoin="round"/><text x="95" y="186" font-size="28" fill="#1f2328" text-anchor="start">周六 14 时……</text><path d="M93 212 L247 212" stroke="#57606a" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="321" y="216" font-size="24" fill="#1f2328" text-anchor="start">目标</text><circle cx="42" cy="286" r="19" fill="#f0e9d8" stroke="#1f2328" stroke-width="2.7"/><text x="42" y="295" font-size="25" fill="#1f2328" text-anchor="middle">2</text><text x="79" y="295" font-size="27" fill="#1f2328" text-anchor="start">示范：怎样回答</text><path d="M77 318 L438 318 L438 395 L126 395 L104 411 L105 395 L77 395Z" stroke="#1f2328" stroke-width="2.5" fill="#f0e9d8" stroke-linecap="round" stroke-linejoin="round"/><text x="95" y="351" font-size="26" fill="#1f2328" text-anchor="start">问地点 → 地点未知</text><text x="95" y="384" font-size="24" fill="#1f2328" text-anchor="start">照着合适的回答学</text><circle cx="42" cy="458" r="19" fill="#f0e9d8" stroke="#1f2328" stroke-width="2.7"/><text x="42" y="467" font-size="25" fill="#1f2328" text-anchor="middle">3</text><text x="79" y="467" font-size="27" fill="#1f2328" text-anchor="start">偏好：两份选哪份</text><path d="M134 526 L375 526 M255 494 L255 554 M230 554 L280 554" stroke="#1f2328" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="151" cy="526" r="28" fill="#f0e9d8" stroke="#1f2328" stroke-width="2.7"/><path d="M137 529 l9 10 l20 -26" stroke="#B4472F" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="357" cy="526" r="28" fill="#fbfaf6" stroke="#1f2328" stroke-width="2.7"/><path d="M346 515 l22 22 M346 537 l22 -22" stroke="#B4472F" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M28 572 L451 572" stroke="#e6e1d4" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="28" y="591" font-size="24" fill="#57606a" text-anchor="start">三类信号改变不同的行为倾向。</text><text x="28" y="627" font-size="24" fill="#57606a" text-anchor="start">聊天角色模板负责组织消息。</text></g></svg>
