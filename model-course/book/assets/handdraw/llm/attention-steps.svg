<svg xmlns="http://www.w3.org/2000/svg" width="480" height="990" viewBox="0 0 480 990" role="img" aria-labelledby="g50-title g50-desc"><title id="g50-title">先挡未来，再汇总</title><desc id="g50-desc">1．先确定哪些位置可见：当前位置是“把”，可见“我”和“把”；“苹果”“切开”在未来，要先屏蔽。后面的文字即使已经画在纸上，也不能参与当前位置的汇总。 2．比较 Q 与可见的 K：Q = [0.2, 1]。和“我”的 K 点积得 0.2，和“把”的 K 点积得 1.04；除以 √2，分数分别是 0.1414 和 0.7354。 3．把分数变成汇总份额：只对可见分数做 softmax，得到“我” 35.57%、“把” 64.43%。未来两项是 0，可见权重加起来是 1。权重用于决定从各个 V 取多少。 4．各取一份，再逐维相加：0.3557 × [1, 0] + 0.6443 × [0, 2] = [0.3557, 1.2886]。图上保留四位小数，计算使用未舍入值。这个结果仍是向量，后面还要继续计算，不能直接当成完整推理的解释。</desc><rect width="480" height="990" fill="#FFFDF8"/><g font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif"><text x="24" y="39" font-size="30" text-anchor="start" fill="#26221B">先挡未来，再汇总</text><path d="M 26 57 Q 240 58.06 454 56" stroke="#B4472F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" /><g transform="translate(0 72)"><circle cx="43" cy="20" r="18" fill="#F3EAD8" stroke="#26221B" stroke-width="2.5"/><text x="43" y="29" font-size="24" text-anchor="middle" fill="#26221B">1</text><text x="74" y="29" font-size="27" text-anchor="start" fill="#26221B">先确定哪些位置可见</text><g transform="translate(0 49)"><path d="M 27 6 Q 69.94 4.82 116 8 L 114 62 Q 70.08 61.92 24 60 Z" stroke="#26221B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="#F3EAD8" /><text x="70" y="44" font-size="26" text-anchor="middle" fill="#26221B">我</text><path d="M 141 6 Q 183.94 5.22 230 8 L 228 62 Q 184.06 62.86 138 60 Z" stroke="#26221B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="#F3EAD8" /><text x="184" y="44" font-size="26" text-anchor="middle" fill="#26221B">把</text><path d="M 255 6 Q 297.92 5.94 344 8 L 342 62 Q 298.06 62.4 252 60 Z" stroke="#26221B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="#E3D8C1" /><text x="298" y="44" font-size="26" text-anchor="middle" fill="#26221B">苹果</text><path d="M255 11 l84 46" stroke="#5C5448" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" /><path d="M 369 6 Q 411.94 5.16 458 8 L 456 62 Q 412.06 63.08 366 60 Z" stroke="#26221B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="#E3D8C1" /><text x="412" y="44" font-size="26" text-anchor="middle" fill="#26221B">切开</text><path d="M369 11 l84 46" stroke="#5C5448" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" /><text x="30" y="113" font-size="26" text-anchor="start" fill="#26221B">当前在“把”：只看我、把。</text><text x="30" y="157" font-size="24" text-anchor="start" fill="#26221B">苹果、切开：未来位置先挡住。</text></g><path d="M 27 222 Q 239.5 224.12 452 222" stroke="#E3D8C1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" /></g><g transform="translate(0 300)"><circle cx="43" cy="20" r="18" fill="#F3EAD8" stroke="#26221B" stroke-width="2.5"/><text x="43" y="29" font-size="24" text-anchor="middle" fill="#26221B">2</text><text x="74" y="29" font-size="27" text-anchor="start" fill="#26221B">比较 Q 与可见的 K</text><g transform="translate(0 49)"><text x="30" y="34" font-size="28" text-anchor="start" fill="#26221B">Q = [0.2, 1]</text><text x="30" y="92" font-size="25" text-anchor="start" fill="#26221B">我：0.2 / √2 = 0.1414</text><text x="30" y="148" font-size="25" text-anchor="start" fill="#26221B">把：1.04 / √2 = 0.7354</text></g><path d="M 27 222 Q 239.5 224.12 452 222" stroke="#E3D8C1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" /></g><g transform="translate(0 528)"><circle cx="43" cy="20" r="18" fill="#F3EAD8" stroke="#26221B" stroke-width="2.5"/><text x="43" y="29" font-size="24" text-anchor="middle" fill="#26221B">3</text><text x="74" y="29" font-size="27" text-anchor="start" fill="#26221B">把分数变成汇总份额</text><g transform="translate(0 49)"><text x="34" y="29" font-size="27" text-anchor="start" fill="#26221B">我</text><path d="M111 11 L306 11" stroke="#E3D8C1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-dasharray="4 5"/><path d="M 114 4 Q 145.62 3.78 180.36 6 L 178.36 35 Q 145.76 34.96 111 33 Z" stroke="#26221B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="#F3EAD8" /><text x="318" y="28" font-size="24" text-anchor="start" fill="#26221B">35.57%</text><text x="34" y="87" font-size="27" text-anchor="start" fill="#26221B">把</text><path d="M111 69 L306 69" stroke="#E3D8C1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-dasharray="4 5"/><path d="M 114 62 Q 173.74 61.04 236.64 64 L 234.64 93 Q 173.8 93.26 111 91 Z" stroke="#26221B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="#F3EAD8" /><text x="318" y="86" font-size="24" text-anchor="start" fill="#26221B">64.43%</text><text x="30" y="158" font-size="24" text-anchor="start" fill="#26221B">未来权重为 0；可见权重和为 1。</text></g><path d="M 27 222 Q 239.5 224.12 452 222" stroke="#E3D8C1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" /></g><g transform="translate(0 756)"><circle cx="43" cy="20" r="18" fill="#F3EAD8" stroke="#26221B" stroke-width="2.5"/><text x="43" y="29" font-size="24" text-anchor="middle" fill="#26221B">4</text><text x="74" y="29" font-size="27" text-anchor="start" fill="#26221B">各取一份，再逐维相加</text><g transform="translate(0 49)"><text x="30" y="36" font-size="28" text-anchor="start" fill="#26221B">0.3557 × [1, 0]</text><text x="30" y="88" font-size="28" text-anchor="start" fill="#26221B">+ 0.6443 × [0, 2]</text><g class="mechanism-change"><text x="30" y="148" font-size="29" text-anchor="start" fill="#26221B">= [0.3557, 1.2886]</text></g></g></g></g></svg>
