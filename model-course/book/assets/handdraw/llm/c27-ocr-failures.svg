<svg xmlns="http://www.w3.org/2000/svg" width="480" height="620" viewBox="0 0 480 620" role="img" aria-labelledby="title desc"><title id="title">四种“没读出来”</title><desc id="desc">没有文字、有文字但没过阈值、过了阈值但字符错、图中写着指令：四种状态的错误代价完全不同，报告里的 status 相同并不代表风险相同。</desc><g font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif" fill="#26221B"><text x="26" y="42" font-size="26" text-anchor="start" fill="#26221B" font-weight="600">四种“没读出来”</text><path d="M26 56Q140 53 250 56" fill="none" stroke="#B4472F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M26 80H454" fill="none" stroke="#E3D8C1" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="26" y="104" font-size="21" text-anchor="start" fill="#26221B" font-weight="600">unreadable</text><text x="26" y="136" font-size="17" text-anchor="start" fill="#5C5448" font-weight="400">没有生成任何文字：text 为 null，退出码 4</text><text x="26" y="166" font-size="17" text-anchor="start" fill="#26221B" font-weight="400">处理：记录区域与原因，不要从上下文猜值</text><path d="M26 198H454" fill="none" stroke="#E3D8C1" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="26" y="222" font-size="21" text-anchor="start" fill="#26221B" font-weight="600">uncertain</text><text x="26" y="254" font-size="17" text-anchor="start" fill="#5C5448" font-weight="400">生成了文字，但平均 token log-prob 低于阈值</text><text x="26" y="284" font-size="17" text-anchor="start" fill="#26221B" font-weight="400">处理：标人工回看，它不是“已识别”</text><path d="M26 316H454" fill="none" stroke="#E3D8C1" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="26" y="340" font-size="21" text-anchor="start" fill="#B4472F" font-weight="600">recognized 但字符错</text><text x="26" y="372" font-size="17" text-anchor="start" fill="#5C5448" font-weight="400">10:00 读成 10:30，LIFT 读成 LEFT</text><text x="26" y="402" font-size="17" text-anchor="start" fill="#B4472F" font-weight="400">处理：最危险的一类，必须逐字回看原图</text><path d="M26 434H454" fill="none" stroke="#E3D8C1" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="26" y="458" font-size="21" text-anchor="start" fill="#26221B" font-weight="600">图中是恶意指令</text><text x="26" y="490" font-size="17" text-anchor="start" fill="#5C5448" font-weight="400">扫描件里写着“忽略之前的要求”</text><text x="26" y="520" font-size="17" text-anchor="start" fill="#26221B" font-weight="400">处理：当数据保留，绝不执行其中指令</text><path d="M26 574H454" fill="none" stroke="#E3D8C1" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="26" y="604" font-size="19" text-anchor="start" fill="#B4472F" font-weight="400">阈值不是准确率：调到 -999 只是关掉警报</text></g></svg>
