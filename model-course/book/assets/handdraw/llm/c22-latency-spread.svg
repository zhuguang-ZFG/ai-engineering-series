<svg xmlns="http://www.w3.org/2000/svg" width="480" height="560" viewBox="0 0 480 560" role="img" aria-labelledby="title desc"><title id="title">八个样本里有一个离群值</title><desc id="desc">八次端到端耗时中七次在 1 200 到 1 800 毫秒，一次 9 000 毫秒。中位数 1 550 毫秒，平均值 2 437.5 毫秒，nearest-rank p95 在 n=8 时就是最大值 9 000 毫秒。</desc><g font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif" fill="#26221B"><text x="26" y="42" font-size="26" text-anchor="start" fill="#26221B" font-weight="600">八个样本里有一个离群值</text><path d="M26 56Q140 53 250 56" fill="none" stroke="#B4472F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="26" y="96" font-size="19" text-anchor="start" fill="#5C5448" font-weight="400">每次请求的端到端耗时（毫秒）</text><circle cx="105.6" cy="122" r="5.5" fill="#26221B"/><circle cx="109.4" cy="140" r="5.5" fill="#26221B"/><circle cx="113.2" cy="122" r="5.5" fill="#26221B"/><circle cx="117.0" cy="140" r="5.5" fill="#26221B"/><circle cx="120.8" cy="122" r="5.5" fill="#26221B"/><circle cx="124.6" cy="140" r="5.5" fill="#26221B"/><circle cx="128.4" cy="122" r="5.5" fill="#26221B"/><circle cx="402.0" cy="140" r="5.5" fill="#B4472F"/><path d="M60 172V182" fill="none" stroke="#26221B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text x="60" y="202" font-size="17" text-anchor="middle" fill="#5C5448" font-weight="400">0</text><path d="M136 172V182" fill="none" stroke="#26221B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text x="136" y="202" font-size="17" text-anchor="middle" fill="#5C5448" font-weight="400">2000</text><path d="M212 172V182" fill="none" stroke="#26221B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text x="212" y="202" font-size="17" text-anchor="middle" fill="#5C5448" font-weight="400">4000</text><path d="M288 172V182" fill="none" stroke="#26221B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text x="288" y="202" font-size="17" text-anchor="middle" fill="#5C5448" font-weight="400">6000</text><path d="M364 172V182" fill="none" stroke="#26221B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text x="364" y="202" font-size="17" text-anchor="middle" fill="#5C5448" font-weight="400">8000</text><path d="M440 172V182" fill="none" stroke="#26221B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text x="440" y="202" font-size="17" text-anchor="middle" fill="#5C5448" font-weight="400">10000</text><path d="M118.9 100V240" fill="none" stroke="#5C5448" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><path d="M152.6 100V240" fill="none" stroke="#B4472F" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><path d="M402.0 100V240" fill="none" stroke="#B4472F" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><text x="112.9" y="264" font-size="17" text-anchor="end" fill="#5C5448" font-weight="400">1550 中位数</text><text x="158.625" y="264" font-size="17" text-anchor="start" fill="#B4472F" font-weight="400">平均值 2437.5</text><text x="396" y="264" font-size="17" text-anchor="end" fill="#B4472F" font-weight="400">p95 = 9000</text><path d="M26 292H454" fill="none" stroke="#E3D8C1" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="26" y="324" font-size="20" text-anchor="start" fill="#26221B" font-weight="400">中位数贴近常见值，平均值被一个点拉高</text><text x="26" y="358" font-size="20" text-anchor="start" fill="#5C5448" font-weight="400">n=8 时 p95 就是最大值，不能说“95% 用户”</text><text x="26" y="392" font-size="20" text-anchor="start" fill="#5C5448" font-weight="400">所以要报 n 和原始点，写明分位算法</text><path d="M26 416H454" fill="none" stroke="#E3D8C1" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="26" y="448" font-size="17" text-anchor="start" fill="#5C5448" font-weight="400">1200 1300 1400 1500 1600 1700 1800 9000</text><text x="26" y="486" font-size="19" text-anchor="start" fill="#B4472F" font-weight="400">换个算法，p95 会变成另一个数</text></g></svg>
