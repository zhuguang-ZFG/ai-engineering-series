<svg xmlns="http://www.w3.org/2000/svg" width="480" height="640" viewBox="0 0 480 640" role="img" aria-labelledby="title desc"><title id="title">灯光只照到当前位置</title><desc id="desc">我、把、苹果、切开四个位置中，当前在把；光锥覆盖我和把，未来两位置遮挡，只有前两项进入当前汇总。</desc><defs><pattern id="figure-grain" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="3" r=".7" fill="#1f2328" opacity=".16"/><circle cx="12" cy="13" r=".55" fill="#1f2328" opacity=".11"/></pattern></defs><rect width="480" height="640" fill="#fbfaf6"/><rect width="480" height="640" fill="url(#figure-grain)" opacity=".34"/><rect x="9" y="9" width="462" height="622" fill="none" stroke="#1f2328" stroke-width=".8" opacity=".22"/><path d="M9 30 V9 H30 M450 9 H471 V30 M9 610 V631 H30 M450 631 H471 V610" fill="none" stroke="#1f2328" stroke-width="1.2" opacity=".38"/><g font-family="Microsoft YaHei,Noto Sans SC,sans-serif"><text x="27" y="48" font-size="30" fill="#1f2328" text-anchor="start">灯光只照到当前位置</text><path d="M28 67 Q232 61 451 66" stroke="#1f883d" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="32" y="111" font-size="26" fill="#1f2328" text-anchor="start">当前走到“把”</text><path d="M179 156 L42 319 L221 319Z" stroke="#1f883d" stroke-width="2" fill="#d3efd9" stroke-linecap="round" stroke-linejoin="round"/><circle cx="179" cy="148" r="24" fill="#d3efd9" stroke="#1f2328" stroke-width="2.7"/><path d="M169 147 L186 139 L191 152 L174 160Z" stroke="#1f2328" stroke-width="2" fill="#fffdf8" stroke-linecap="round" stroke-linejoin="round"/><path d="M27 333 Q70 330 116 335 L114 398 Q70 401 24 396Z" stroke="#1f2328" stroke-width="2.5" fill="#d3efd9" stroke-linecap="round" stroke-linejoin="round"/><text x="70" y="376" font-size="27" fill="#1f2328" text-anchor="middle">我</text><path d="M141 333 Q184 330 230 335 L228 398 Q184 401 138 396Z" stroke="#1f2328" stroke-width="2.5" fill="#d3efd9" stroke-linecap="round" stroke-linejoin="round"/><text x="184" y="376" font-size="27" fill="#1f2328" text-anchor="