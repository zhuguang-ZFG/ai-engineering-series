<svg xmlns="http://www.w3.org/2000/svg" width="480" height="852" viewBox="0 0 480 852" role="img" aria-labelledby="title desc"><title id="title">一个位置走完一个块</title><desc id="desc">图书馆位置的完整数值流水：h 经 LayerNorm 到 ln，经 W1 与 ReLU 只剩第二维，加残差得到 y，再由输出头得到三个分数。去掉 LayerNorm 时 y 变成 0.1723、1.1584、1.5031、1.2891，概率转为 0.3501、0.3803、0.2696，签到反超。</desc><g font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif" fill="#26221B"><text x="26" y="42" font-size="28" text-anchor="start" fill="#26221B" font-weight="600">一个位置走完一个块</text><path d="M26 56Q140 53 250 56" fill="none" stroke="#B4472F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M26 92H454V196H26Z" fill="#FFFDF8" stroke="none"/><path d="M26 92H454V196H26Z" fill="none" stroke="#E3D8C1" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="40" y="124" font-size="22" text-anchor="start" fill="#26221B" font-weight="600">h</text><text x="40" y="152" font-size="19" text-anchor="start" fill="#5C5448" font-weight="400">注意力输出加残差</text><text x="40" y="182" font-size="20" text-anchor="start" fill="#26221B" font-weight="400">[0.1723, 0.7584, 0.5723, 0.3584]</text><path d="M240 200V216M235 209L240 216L245 209" fill="none" stroke="#B4472F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M26 220H454V324H26Z" fill="#FFFDF8" stroke="none"/><path d="M26 220H454V324H26Z" fill="none" stroke="#E3D8C1" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="40" y="252" font-size="22" text-anchor="start" fill="#26221B" font-weight="600">LayerNorm</text><text x="40" y="280" font-size="19" text-anchor="start" fill="#5C5448" font-weight="400">mean 0.4654 · sd 0.2206</text><text x="40" y="310" font-size="20" text-anchor="start" fill="#26221B" font-weight="400">[−1.3285, 1.3285, 0.4850, −0.4850]</text><path d="M240 328V344M235 337L240 344L245 337" fill="none" stroke="#B4472F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M26 348H454V452H26Z" fill="#FFFDF8" stroke="none"/><path d="M26 348H454V452H26Z" fill="none" stroke="#E3D8C1" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="40" y="380" font-size="22" text-anchor="start" fill="#26221B" font-weight="600">W1 → ReLU</text><text x="40" y="408" font-size="19" text-anchor="start" fill="#5C5448" font-weight="400">两个负项被门掉</text><text x="40" y="438" font-size="20" text-anchor="start" fill="#26221B" font-weight="400">[0.0000, 1.8134, 0.0000, 0.0000]</text><path d="M240 456V472M235 465L240 472L245 465" fill="none" stroke="#B4472F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M26 476H454V580H26Z" fill="#FFFDF8" stroke="none"/><path d="M26 476H454V580H26Z" fill="none" stroke="#E3D8C1" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="40" y="508" font-size="22" text-anchor="start" fill="#26221B" font-weight="600">W2 + 残差</text><text x="40" y="536" font-size="19" text-anchor="start" fill="#5C5448" font-weight="400">前馈只动本位置</text><text x="40" y="566" font-size="20" text-anchor="start" fill="#26221B" font-weight="400">[−1.3285, 3.1419, 0.4850, −0.4850]</text><path d="M240 584V600M235 593L240 600L245 593" fill="none" stroke="#B4472F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M26 604H454V708H26Z" fill="#F3EAD8" stroke="none"/><path d="M26 604H454V708H26Z" fill="none" stroke="#E3D8C1" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="40" y="636" font-size="22" text-anchor="start" fill="#B4472F" font-weight="600">W_U → softmax</text><text x="40" y="664" font-size="19" text-anchor="start" fill="#5C5448" font-weight="400">三个候选的分数</text><text x="40" y="694" font-size="20" text-anchor="start" fill="#26221B" font-weight="400">0.7444 / 0.1063 / 0.1493</text><path d="M26 772H454" fill="none" stroke="#E3D8C1" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="26" y="796" font-size="21" text-anchor="start" fill="#B4472F" font-weight="600">去掉 LayerNorm</text><text x="26" y="824" font-size="20" text-anchor="start" fill="#5C5448" font-weight="400">0.3501 / 0.3803 / 0.2696，第一名从报名换成签到</text></g></svg>
