<svg xmlns="http://www.w3.org/2000/svg" width="480" height="640" viewBox="0 0 480 640" role="img" aria-labelledby="title desc"><title id="title">减去梯度，分数怎样移动</title><desc id="desc">人工两候选例子：目标水，学习率0.4。初始概率各50%；梯度为-0.5与+0.5；新分数0.2与-0.2，概率59.9%与40.1%，交叉熵从0.693降到0.513。前后条长使用相同总宽度与实际概率。</desc><defs><pattern id="figure-grain" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="3" r=".7" fill="#1f2328" opacity=".16"/><circle cx="12" cy="13" r=".55" fill="#1f2328" opacity=".11"/></pattern></defs><rect width="480" height="640" fill="#fbfaf6"/><rect width="480" height="640" fill="url(#figure-grain)" opacity=".34"/><rect x="9" y="9" width="462" height="622" fill="none" stroke="#1f2328" stroke-width=".8" opacity=".22"/><path d="M9 30 V9 H30 M450 9 H471 V30 M9 610 V631 H30 M450 631 H471 V610" fill="none" stroke="#1f2328" stroke-width="1.2" opacity=".38"/><g font-family="Microsoft YaHei,sans-serif"><text x="28" y="43" font-size="30" text-anchor="start" fill="#1f2328">减去梯度，分数怎样移动</text><path d="M28 59 Q132 55 226 59" fill="none" stroke="#1f883d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="28" y="96" font-size="26" text-anchor="start" fill="#1f2328">目标：水（1）/ 茶（0）</text><text x="28" y="139" font-size="26" text-anchor="start" fill="#1f2328">更新前 · 分数 [0, 0]</text><rect x="28" y="156" width="212" height="36" fill="#d3efd9"/><rect x="240" y="156" width="212" height="36" fill="#e6e1d4"/><path d="M28 193 H452 M240 153 V196" fill="none" stroke="#1f2328" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="28" y="226" font-size="27" text-anchor="start" fill="#1f2328">水 50.0%</text><text x="452" y="226" font-size="27" text-anchor="end" fill="#1f2328">茶 50.0%</text><text x="240" y="276" font-size="27" text-anchor="middle" fill="#1f2328">梯度 = 概率 − 目标</text><text x="120" y="322" font-size="34" text-anchor="middle" fill="#1f2328">−0.5</text><text x="360" y="322" font-size="34" text-anchor="middle" fill="#1f2328">+0.5</text><path d="M120 338 Q118.5 350.5 120 363 M114 355 L120 363 L126 355" fill="none" stroke="#1f883d" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M360 338 Q358.5 350.5 360 363 M354 355 L360 363 L366 355" fill="none" stroke="#1f883d" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><text x="240" y="399" font-size="27" text-anchor="middle" fill="#1f2328">新分数 = 0 − 0.4 × 梯度</text><text x="28" y="444" font-size="26" text-anchor="start" fill="#1f2328">更新后 · 分数 [0.2, −0.2]</text><rect x="28" y="461" width="253.84356788767965" height="36" fill="#d3efd9"/><rect x="281.8435678876797" y="461" width="170.15643211232035" height="36" fill="#e6e1d4"/><path d="M28 498 H452 M281.8435678876797 458 V501" fill="none" stroke="#1f2328" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="28" y="531" font-size="27" text-anchor="start" fill="#1f2328">水 59.9%</text><text x="452" y="531" font-size="27" text-anchor="end" fill="#1f2328">茶 40.1%</text><text x="240" y="571" font-size="29" text-anchor="middle" fill="#1f2328">损失 0.693 → 0.513</text><text x="28" y="618" font-size="24" text-anchor="start" fill="#1f2328">一步更像训练目标，仍需留出评测</text><g pointer-events="none"><rect x="24" y="129" width="432" height="101" rx="10" fill="none" stroke="#1f883d" stroke-width="4" opacity="0"><animate attributeName="opacity" values="0;0.85;0.85;0" keyTimes="0;0.12;0.8;1" dur="8.8s" begin="0.00s" repeatCount="indefinite"/></rect><rect x="24" y="264" width="432" height="106" rx="10" fill="none" stroke="#1f883d" stroke-width="4" opacity="0"><animate attributeName="opacity" values="0;0.85;0.85;0" keyTimes="0;0.12;0.8;1" dur="8.8s" begin="2.20s" repeatCount="indefinite"/></rect><rect x="24" y="434" width="432" height="101" rx="10" fill="none" stroke="#1f883d" stroke-width="4" opacity="0"><animate attributeName="opacity" values="0;0.85;0.85;0" keyTimes="0;0.12;0.8;1" dur="8.8s" begin="4.40s" repeatCount="indefinite"/></rect><rect x="24" y="553" width="432" height="43" rx="10" fill="none" stroke="#1f883d" stroke-width="4" opacity="0"><animate attributeName="opacity" values="0;0.85;0.85;0" keyTimes="0;0.12;0.8;1" dur="8.8s" begin="6.60s" repeatCount="indefinite"/></rect></g><path d="M28 583 Q240 581 452 583" fill="none" stroke="#e6e1d4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g></svg>
