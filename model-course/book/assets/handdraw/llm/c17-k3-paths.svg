<svg xmlns="http://www.w3.org/2000/svg" width="480" height="660" viewBox="0 0 480 660" role="img" aria-labelledby="title desc"><title id="title">六类结果，缺一类就没过 K3</title><desc id="desc">阶段门不看某一次运行是否“看起来不错”：换一份文档、从干净环境重做，六类路径都要留下真实报告。</desc><g font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif" fill="#26221B"><text x="26" y="42" font-size="26" text-anchor="start" fill="#26221B" font-weight="600">六类结果，缺一类就没过 K3</text><path d="M26 56Q140 53 250 56" fill="none" stroke="#B4472F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M26 76H454" fill="none" stroke="#E3D8C1" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="26" y="104" font-size="20" text-anchor="start" fill="#26221B" font-weight="600">1. 正常有证据</text><text x="454" y="104" font-size="16" text-anchor="end" fill="#B4472F" font-weight="400">answered</text><text x="26" y="134" font-size="17" text-anchor="start" fill="#5C5448" font-weight="400">唯一可以标 answered 的路径</text><path d="M26 160H454" fill="none" stroke="#E3D8C1" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="26" y="188" font-size="20" text-anchor="start" fill="#26221B" font-weight="600">2. 材料缺失</text><text x="454" y="188" font-size="16" text-anchor="end" fill="#26221B" font-weight="400">insufficient-evidence</text><text x="26" y="218" font-size="17" text-anchor="start" fill="#5C5448" font-weight="400">不得用常识补价格</text><path d="M26 244H454" fill="none" stroke="#E3D8C1" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="26" y="272" font-size="20" text-anchor="start" fill="#26221B" font-weight="600">3. 两版冲突</text><text x="454" y="272" font-size="16" text-anchor="end" fill="#26221B" font-weight="400">conflict</text><text x="26" y="302" font-size="17" text-anchor="start" fill="#5C5448" font-weight="400">不能悄悄选一个</text><path d="M26 328H454" fill="none" stroke="#E3D8C1" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="26" y="356" font-size="20" text-anchor="start" fill="#26221B" font-weight="600">4. 无命中</text><text x="454" y="356" font-size="16" text-anchor="end" fill="#26221B" font-weight="400">证据不足</text><text x="26" y="386" font-size="17" text-anchor="start" fill="#5C5448" font-weight="400">不把最低分片段当证据</text><path d="M26 412H454" fill="none" stroke="#E3D8C1" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="26" y="440" font-size="20" text-anchor="start" fill="#26221B" font-weight="600">5. 越权</text><text x="454" y="440" font-size="16" text-anchor="end" fill="#26221B" font-weight="400">unauthorized</text><text x="26" y="470" font-size="17" text-anchor="start" fill="#5C5448" font-weight="400">正文不得进入模型上下文</text><path d="M26 496H454" fill="none" stroke="#E3D8C1" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="26" y="524" font-size="20" text-anchor="start" fill="#26221B" font-weight="600">6. 服务或模型失败</text><text x="454" y="524" font-size="16" text-anchor="end" fill="#26221B" font-weight="400">model-unavailable</text><text x="26" y="554" font-size="17" text-anchor="start" fill="#5C5448" font-weight="400">不回退成手工或缓存答案</text><path d="M26 620H454" fill="none" stroke="#E3D8C1" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="26" y="650" font-size="18" text-anchor="start" fill="#B4472F" font-weight="400">每个结果都要能指向实际文件</text></g></svg>
