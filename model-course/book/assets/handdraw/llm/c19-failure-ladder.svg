<svg xmlns="http://www.w3.org/2000/svg" width="480" height="800" viewBox="0 0 480 800" role="img" aria-labelledby="title desc"><title id="title">先看更早的边界，再看现象</title><desc id="desc">一条请求按实际顺序经过十一个边界。只要更早的环节已经偏离，后面的现象都只是后果；程序报出的 first_failure 是第一个异常，不一定是第一边界。</desc><g font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif" fill="#26221B"><text x="26" y="42" font-size="26" text-anchor="start" fill="#26221B" font-weight="600">先看更早的边界，再看现象</text><path d="M26 56Q140 53 250 56" fill="none" stroke="#B4472F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="26" y="126" font-size="19" text-anchor="#5C5448" fill="start" font-weight="600">1</text><text x="58" y="126" font-size="21" text-anchor="start" fill="#26221B" font-weight="400">读者/权限</text><text x="58" y="150" font-size="16" text-anchor="start" fill="#5C5448" font-weight="400">unauthorized · filtered_doc_count</text><path d="M44 98V154" fill="none" stroke="#E3D8C1" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="26" y="182" font-size="19" text-anchor="#5C5448" fill="start" font-weight="600">2</text><text x="58" y="182" font-size="21" text-anchor="start" fill="#26221B" font-weight="400">清单/文件/版本</text><text x="58" y="206" font-size="16" text-anchor="start" fill="#5C5448" font-weight="400">missing-source · source-version-mismatch</text><path d="M44 154V210" fill="none" stroke="#E3D8C1" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="26" y="238" font-size="19" text-anchor="#5C5448" fill="start" font-weight="600">3</text><text x="58" y="238" font-size="21" text-anchor="start" fill="#26221B" font-weight="400">切块</text><text x="58" y="262" font-size="16" text-anchor="start" fill="#5C5448" font-weight="400">chunk_count · chunks[].start/end</text><path d="M44 210V266" fill="none" stroke="#E3D8C1" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="26" y="294" font-size="19" text-anchor="#5C5448" fill="start" font-weight="600">4</text><text x="58" y="294" font-size="21" text-anchor="start" fill="#26221B" font-weight="400">检索</text><text x="58" y="318" font-size="16" text-anchor="start" fill="#5C5448" font-weight="400">hits=[] · usage.calls=0</text><path d="M44 266V322" fill="none" stroke="#E3D8C1" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="26" y="350" font-size="19" text-anchor="#B4472F" fill="start" font-weight="600">5</text><text x="58" y="350" font-size="21" text-anchor="start" fill="#B4472F" font-weight="600">提示组装</text><text x="58" y="374" font-size="16" text-anchor="start" fill="#5C5448" font-weight="400">used_chunk_ids · prompt budget dropped</text><path d="M44 322V378" fill="none" stroke="#E3D8C1" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="26" y="406" font-size="19" text-anchor="#5C5448" fill="start" font-weight="600">6</text><text x="58" y="406" font-size="21" text-anchor="start" fill="#26221B" font-weight="400">模型调用</text><text x="58" y="430" font-size="16" text-anchor="start" fill="#5C5448" font-weight="400">generation-failed · calls&gt;0</text><path d="M44 378V434" fill="none" stroke="#E3D8C1" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="26" y="462" font-size="19" text-anchor="#5C5448" fill="start" font-weight="600">7</text><text x="58" y="462" font-size="21" text-anchor="start" fill="#26221B" font-weight="400">解析</text><text x="58" y="486" font-size="16" text-anchor="start" fill="#5C5448" font-weight="400">invalid-response · first_raw_response</text><path d="M44 434V490" fill="none" stroke="#E3D8C1" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="26" y="518" font-size="19" text-anchor="#5C5448" fill="start" font-weight="600">8</text><text x="58" y="518" font-size="21" text-anchor="start" fill="#26221B" font-weight="400">schema/语义</text><text x="58" y="542" font-size="16" text-anchor="start" fill="#5C5448" font-weight="400">first_failure.stage=validate</text><path d="M44 490V546" fill="none" stroke="#E3D8C1" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="26" y="574" font-size="19" text-anchor="#5C5448" fill="start" font-weight="600">9</text><text x="58" y="574" font-size="21" text-anchor="start" fill="#26221B" font-weight="400">引用/提取</text><text x="58" y="598" font-size="16" text-anchor="start" fill="#5C5448" font-weight="400">citation-failed · citation_errors</text><path d="M44 546V602" fill="none" stroke="#E3D8C1" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="26" y="630" font-size="19" text-anchor="#5C5448" fill="start" font-weight="600">10</text><text x="58" y="630" font-size="21" text-anchor="start" fill="#26221B" font-weight="400">工具</text><text x="58" y="654" font-size="16" text-anchor="start" fill="#5C5448" font-weight="400">tool-failed · budget-exhausted</text><path d="M44 602V658" fill="none" stroke="#E3D8C1" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="26" y="686" font-size="19" text-anchor="#5C5448" fill="start" font-weight="600">11</text><text x="58" y="686" font-size="21" text-anchor="start" fill="#26221B" font-weight="400">最终回答</text><text x="58" y="710" font-size="16" text-anchor="start" fill="#5C5448" font-weight="400">answered，但答非所问</text><path d="M26 726H454" fill="none" stroke="#E3D8C1" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="26" y="758" font-size="21" text-anchor="start" fill="#B4472F" font-weight="600">例：命中片段被提示预算丢掉</text><text x="26" y="786" font-size="19" text-anchor="start" fill="#5C5448" font-weight="400">程序不报错，边界在第 5 步而不是第 11 步</text></g></svg>
