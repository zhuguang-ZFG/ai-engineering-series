<svg xmlns="http://www.w3.org/2000/svg" width="480" height="700" viewBox="0 0 480 700" role="img" aria-labelledby="title desc"><title id="title">命中率 100%，召回却只有三分之一</title><desc id="desc">两个查询都至少取回一个相关片段，所以命中率是 1.0；但 Q1 只取回三块相关片段中的一块，精确率与召回率都是 1/3。微平均先把两列合计再相除，宏平均先算每列再平均，两者给出不同的数。</desc><g font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif" fill="#26221B"><text x="26" y="42" font-size="26" text-anchor="start" fill="#26221B" font-weight="600">命中率 100%，召回却只有三分之一</text><path d="M26 56Q140 53 250 56" fill="none" stroke="#B4472F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="26" y="108" font-size="22" text-anchor="start" fill="#26221B" font-weight="600">查询 Q1</text><path d="M26 120H230" fill="none" stroke="#E3D8C1" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="26" y="154" font-size="20" text-anchor="start" fill="#5C5448" font-weight="400">相关 A, B, C</text><text x="26" y="188" font-size="20" text-anchor="start" fill="#5C5448" font-weight="400">取回 A, D, E</text><text x="26" y="230" font-size="20" text-anchor="start" fill="#26221B" font-weight="400">精确率 1/3</text><text x="26" y="264" font-size="20" text-anchor="start" fill="#26221B" font-weight="400">召回率 1/3</text><text x="26" y="298" font-size="20" text-anchor="start" fill="#B4472F" font-weight="400">命中 1</text><text x="248" y="108" font-size="22" text-anchor="start" fill="#26221B" font-weight="600">查询 Q2</text><path d="M248 120H452" fill="none" stroke="#E3D8C1" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="248" y="154" font-size="20" text-anchor="start" fill="#5C5448" font-weight="400">相关 D, E</text><text x="248" y="188" font-size="20" text-anchor="start" fill="#5C5448" font-weight="400">取回 D, E</text><text x="248" y="230" font-size="20" text-anchor="start" fill="#26221B" font-weight="400">精确率 1</text><text x="248" y="264" font-size="20" text-anchor="start" fill="#26221B" font-weight="400">召回率 1</text><text x="248" y="298" font-size="20" text-anchor="start" fill="#26221B" font-weight="400">命中 1</text><path d="M26 322H454" fill="none" stroke="#E3D8C1" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="26" y="360" font-size="22" text-anchor="start" fill="#26221B" font-weight="600">微平均：合计数再相除</text><text x="26" y="392" font-size="21" text-anchor="start" fill="#5C5448" font-weight="400">精确率 3/5 = 0.600　召回率 3/5 = 0.600</text><path d="M26 418H454" fill="none" stroke="#E3D8C1" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="26" y="456" font-size="22" text-anchor="start" fill="#26221B" font-weight="600">宏平均：先算每列再平均</text><text x="26" y="488" font-size="21" text-anchor="start" fill="#5C5448" font-weight="400">精确率 (1/3 + 1)/2 ≈ 0.667</text><text x="26" y="520" font-size="21" text-anchor="start" fill="#5C5448" font-weight="400">召回率 (1/3 + 1)/2 ≈ 0.667</text><path d="M26 546H454" fill="none" stroke="#E3D8C1" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="26" y="584" font-size="21" text-anchor="start" fill="#B4472F" font-weight="400">命中率 2/2 = 1.000，但 Q1 只取回三分之一</text><text x="26" y="616" font-size="20" text-anchor="start" fill="#5C5448" font-weight="400">缺页仍是失败，只是命中了别的片段</text><text x="26" y="672" font-size="20" text-anchor="start" fill="#5C5448" font-weight="400">三个数一起给，并写明是微平均还是宏平均</text></g></svg>
