<svg xmlns="http://www.w3.org/2000/svg" width="480" height="640" viewBox="0 0 480 640" role="img" aria-labelledby="title desc"><title id="title">教师给的是一份分布</title><desc id="desc">T=1时教师分数[3,2,0]对应水70.54%、茶25.95%、咖啡3.51%；学生初始均匀。教师软分布与材料核实的硬标签共同形成损失，更新学生而冻结教师。</desc><defs><pattern id="figure-grain" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="3" r=".7" fill="#1f2328" opacity=".16"/><circle cx="12" cy="13" r=".55" fill="#1f2328" opacity=".11"/></pattern></defs><rect width="480" height="640" fill="#fbfaf6"/><rect width="480" height="640" fill="url(#figure-grain)" opacity=".34"/><rect x="9" y="9" width="462" height="622" fill="none" stroke="#1f2328" stroke-width=".8" opacity=".22"/><path d="M9 30 V9 H30 M450 9 H471 V30 M9 610 V631 H30 M450 631 H471 V610" fill="none" stroke="#1f2328" stroke-width="1.2" opacity=".38"/><g font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif"><text x="27" y="48" font-size="30" fill="#1f2328" text-anchor="start">教师给的是一份分布</text><path d="M28 67 Q232 61 451 66" stroke="#B4472F" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="28" y="109" font-size="28" fill="#1f2328" text-anchor="start">教师固定</text><text x="300" y="109" font-size="28" fill="#1f2328" text-anchor="start">学生可更新</text><path d="M37 262 L37 159.71924565875503 L67 160.71924565875503 L68 262Z" stroke="#1f2328" stroke-width="2" fill="#f0e9d8" stroke-linecap="round" stroke-linejoin="round"/><text x="52" y="294" font-size="24" fill="#1f2328" text-anchor="middle">水</text><path d="M85 262 L85 224.37301325034923 L115 225.37301325034923 L116 262Z" stroke="#1f2328" stroke-width="2" fill="#e6e1d4" stroke-linecap="round" stroke-linejoin="round"/><text x="100" y="294" font-size="24" fill="#1f2328" text-anchor="middle">茶</text><path d="M133 262 L133 256.90774109089574 L163 257.90774109089574 L164 262Z" stroke="#1f2328" stroke-width="2" fill="#e6e1d4" stroke-linecap="round" stroke-linejoin="round"/><text x="148" 