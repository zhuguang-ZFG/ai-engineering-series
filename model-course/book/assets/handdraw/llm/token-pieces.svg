<svg xmlns="http://www.w3.org/2000/svg" width="480" height="396" viewBox="0 0 480 396" role="img" aria-labelledby="title desc">
  <title id="title">文字先编码成片段，再用编号交给模型</title>
  <desc id="desc">从原文 Hello, world! 到片段和 token ID。空格和标点仍然保留。示例使用 cl100k_base。</desc>
  
  <g font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif" fill="#1f2328">
    <text x="24" y="43" font-size="28" font-weight="600">先拆开，再编号</text>
    <path d="M24 56q56 7 120 0t88 0" fill="none" stroke="#B4472F" stroke-width="4" stroke-linecap="round"/>
    <text x="24" y="104" font-size="25">原文</text>
    <rect x="110" y="74" width="344" height="50" rx="9" fill="#fffdf8" stroke="#1f2328" stroke-width="3"/>
    <text x="126" y="108" font-size="28">Hello, world!</text>
    <path d="M268 135q-4 16 0 30m-8-8 8 8 8-8" fill="none" stroke="#1f2328" stroke-width="3" stroke-linecap="round"/>
    <text x="24" y="211" font-size="25">片段</text>
    <g fill="#f0e9d8" stroke="#1f2328" stroke-width="2.5">
      <rect x="110" y="180" width="104" height="52" rx="8"/><rect x="222" y="180" width="40" height="52" rx="7"/>
      <rect x="270" y="180" width="132" height="52" rx="9"/><rect x="410" y="180" width="42" height="52" rx="7"/>
    </g>
    <g font-size="26" text-anchor="middle"><text x="162" y="215">Hello</text><text x="242" y="215">,</text><text x="336" y="215">␠world</text><text x="431" y="215">!</text></g>
    <path d="M268 244v28m-8-8 8 8 8-8" fill="none" stroke="#1f2328" stroke-width="3" stroke-linecap="round"/>
    <text x="24" y="310" font-size="25">编号</text>
    <g font-size="25" text-anchor="middle"><text x="162" y="310">9906</text><text x="242" y="310">11</text><text x="336" y="310">1917</text><text x="431" y="310">0</text></g>
    <text x="24" y="365" font-size="25" fill="#57606a">空格也保留；图中 ␠ 表示空格</text>
  </g>
</svg>
