<svg xmlns="http://www.w3.org/2000/svg" width="480" height="640" viewBox="0 0 480 640" role="img" aria-labelledby="title desc"><title id="title">S4 · 会改进</title><desc id="desc">一个闭环包住前后对照：基线、改动、复测；折线只上升一小段，外面的一圈浅色带表示小样本的置信区间。</desc><rect width="480" height="640" fill="#f7f2e7"/><pattern id="grain" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="3" r=".8" fill="#26221B" opacity=".16"/><circle cx="14" cy="15" r=".7" fill="#26221B" opacity=".12"/></pattern><rect width="480" height="640" fill="url(#grain)" opacity=".28"/><rect x="26" y="26" width="428" height="588" fill="none" stroke="#26221B" stroke-width="1" opacity=".22"/><path d="M20 52 V20 H52 M428 20 H460 V52 M20 588 V620 H52 M428 620 H460 V588" fill="none" stroke="#26221B" stroke-width="1.6" opacity=".5"/><g><text x="46" y="118" font-family="'Noto Serif SC','Songti SC','SimSun',serif" font-size="112" font-weight="600" fill="none" stroke="#26221B" stroke-width="1.7" letter-spacing="2">04</text><text x="432" y="74" font-family="'Noto Serif SC','Songti SC','SimSun',serif" font-size="13" font-weight="500" fill="#6b6457" text-anchor="end" letter-spacing="3">STAGE 04</text><text x="432" y="96" font-family="ui-monospace,monospace" font-size="13" font-weight="500" fill="#6b6457" text-anchor="end" letter-spacing="2">K4</text><path d="M44 150 L436 150" fill="none" stroke="#26221B" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 6"/><path d="M118 350 a102 102 0 1 1 102 102" fill="none" stroke="#6b6457" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 7"/><path d="M218 452 l-14 2 l8 11" fill="none" stroke="#6b6457" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M142 352 L316 314 L316 266 L142 304 Z" fill="#e9e2d0" fill-opacity=".45"/><circle cx="142" cy="352" r="6" fill="#fdfaf1" stroke="#26221B" stroke-width="1.6"/><circle cx="200" cy="334" r="6" fill="#fdfaf1" stroke="#26221B" stroke-width="1.6"/><circle cx="258" cy="338" r="6" fill="#fdfaf1" stroke="#26221B" stroke-width="1.6"/><circle cx="316" cy="314" r="6" fill="#26221B" stroke="#26221B" stroke-width="1.6"/><path d="M142 352 L200 334 L258 338 L316 314" fill="none" stroke="#26221B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M132 372 L340 372" fill="none" stroke="#26221B" stroke-width="1.2" stroke-linecap="round"/><text x="142" y="402" font-family="'Noto Serif SC','Songti SC','SimSun',serif" font-size="14" font-weight="400" fill="#6b6457" text-anchor="start">基线</text><text x="300" y="402" font-family="'Noto Serif SC','Songti SC','SimSun',serif" font-size="14" font-weight="400" fill="#6b6457" text-anchor="start">改动</text><text x="58" y="500" font-family="'Noto Serif SC','Songti SC','SimSun',serif" font-size="18" font-weight="500" fill="#26221B" text-anchor="start">先有同一把尺子</text><text x="58" y="528" font-family="'Noto Serif SC','Songti SC','SimSun',serif" font-size="16" font-weight="400" fill="#6b6457" text-anchor="start">再谈变好</text><text x="44" y="596" font-family="'Noto Serif SC','Songti SC','SimSun',serif" font-size="15" font-weight="400" fill="#6b6457" text-anchor="start" letter-spacing="2">五阶段 · 三十章</text><text x="436" y="596" font-family="'Noto Serif SC','Songti SC','SimSun',serif" font-size="15" font-weight="400" fill="#6b6457" text-anchor="end" letter-spacing="1">把大模型拆开看</text></g></svg>
