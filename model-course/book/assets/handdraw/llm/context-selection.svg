    <path d="M240 326 Q238 339 240 352" fill="none" stroke="#1f2328" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M26 366 Q146.72000000000003 361.4 454 365 L452.6 461 Q290.88 462.8 25 459.4 Q25.6 412 26 366 Z" fill="#fbfaf6" stroke="#1f2328" stroke-width="2.5" stroke-linejoin="round"/>
