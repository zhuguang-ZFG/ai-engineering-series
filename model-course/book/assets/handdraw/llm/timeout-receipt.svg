<svg xmlns="http://www.w3.org/2000/svg" width="480" height="800" viewBox="0 0 480 800" role="img" aria-labelledby="title desc"><title id="title">超时，能断定没有执行吗？</title><desc id="desc">客户端发出job7，远端可能已经执行但回执丢失；客户端超时后应先按请求ID查状态，重试去重依赖服务端约定。</desc><g font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif"><text x="28" y="48" font-size="30" fill="#1f2328">超时，能断定没有执行吗？</text><path d="M28 66 Q238 61 448 65" fill="none" stroke="#B4472F" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="113" font-size="28" fill="#1f2328">客户端</text><text x="307" y="113" font-size="28" fill="#1f2328">服务端</text><path d="M99 134 L99 632 M358 134 L358 632" fill="none" stroke="#e6e1d4" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 7"/><text x="34" y="177" font-size="26" fill="#1f2328">① 发出请求 job-7</text><path d="M99 198 Q235 203 358 198 M347 189 L358 198 L347 207" fill="none" stroke="#B4472F" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><text x="149" y="260" font-size="26" fill="#1f2328">② 可能已经完成</text><path d="M252 284 Q349.5 278 447 281 L445 355 Q349.5 359 252 354Z" fill="#f0e9d8" stroke="#1f2328" stroke-width="2.5"/><text x="273" y="330" font-size="26" fill="#1f2328">外部状态已变</text><text x="130" y="398" font-size="26" fill="#1f2328">③ 回执丢失</text><path d="M358 420 L252 420 M199 420 L99 420 M110 411 L99 420 L110 429" fill="none" stroke="#57606a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7"/><path d="M212 405 L239 435 M212 435 L239 405" fill="none" stroke="#1f2328" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><text x="28" y="485" font-size="26" fill="#1f2328">④ 客户端只知道：超时</text><text x="28" y="547" font-size="26" fill="#1f2328">⑤ 先按 job-7 查询状态</text><path d="M99 572 Q234 577 358 572 M347 563 L358 572 L347 581" fill="none" stroke="#B4472F" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><text x="28" y="679" font-size="26" fill="#1f2328">重试是否去重，要看服务端约定</text><text x="28" y="731" font-size="26" fill="#57606a">示意流程；本课没有远端副作用</text></g></svg>
