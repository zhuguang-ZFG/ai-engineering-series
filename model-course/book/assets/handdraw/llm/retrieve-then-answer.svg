<svg xmlns="http://www.w3.org/2000/svg" width="480" height="688" viewBox="0 0 480 688" role="img" aria-labelledby="title desc">
  <title id="title">检索到的片段才进入输入</title>
  <desc id="desc">资料先切块，查询决定取回哪些片段，命中片段连同问题进入上下文；无命中时停止，检索不改参数。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#26221B" stroke-width="1.5"/></marker></defs>
  <g font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif" fill="#26221B">
    <text x="24" y="40" font-size="28">从一叠文件，取回几段依据</text>
    <path d="M 40 72 Q 149 69.64 426 71 L 424.6 127 Q 278.9 128.32 39 125.4 Q 39.6 98 40 72 Z" fill="#FFFDF8" stroke="#26221B" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 32 80 Q 141 78.14 418 79 L 416.6 135 Q 270.9 136.2 31 133.4 Q 31.6 106 32 80 Z" fill="#FFFDF8" stroke="#26221B" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 24 88 Q 133 86.1 410 87 L 408.6 143 Q 262.9 143.36 23 141.4 Q 23.6 114 24 88 Z" fill="#F3EAD8" stroke="#26221B" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="46" y="124" font-size="26">文件 + 文档编号 + 版本</text>
    <path d="M240 152 Q238 166 240 180" fill="none" stroke="#26221B" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M 24 194 Q 145.3 191.58 454 193 Q 451.14 224.96 452.6 257 Q 290.1 257.94 23 255.4 Q 25.5 224.04 24 194 Z" fill="#FFFDF8" stroke="#26221B" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="46" y="234" font-size="26">切成片段，保留原文位置</text>
    <path d="M240 266 Q238 280 240 294" fill="none" stroke="#26221B" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M 24 308 Q 145.3 305.48 454 307 Q 451.26 354.98 452.6 403 Q 290.1 404.42 23 401.4 Q 24.58 354.02 24 308 Z" fill="#F3EAD8" stroke="#26221B" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="46" y="344" font-size="26">查询 → 检索 → 取回</text>
    <text x="46" y="382" font-size="26">无命中：停止，不补零分项</text>
    <path d="M240 412 Q238 426 240 440" fill="none" stroke="#26221B" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M 24 454 Q 145.3 452.58 454 453 Q 451.58 495.98 452.6 539 Q 290.1 539.66 23 537.4 Q 25.52 495.02 24 454 Z" fill="#FFFDF8" stroke="#26221B" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="46" y="489" font-size="26">本次输入：问题 + 命中片段</text>
    <text x="46" y="524" font-size="26">没有取回的文件不在这里</text>
    <path d="M240 548 Q238 562 240 576" fill="none" stroke="#26221B" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="26" y="616" font-size="26">带出处回答；版本仍需核对</text>
    <text x="26" y="662" font-size="26">检索没有把文件训练进参数</text>
    <g pointer-events="none"><rect x="22" y="66" width="432" height="80" rx="10" fill="none" stroke="#B4472F" stroke-width="4" opacity="0"><animate attributeName="opacity" values="0;0.85;0.85;0" keyTimes="0;0.12;0.8;1" dur="10.4s" begin="0.00s" repeatCount="indefinite"/></rect><rect x="22" y="188" width="434" height="72" rx="10" fill="none" stroke="#B4472F" stroke-width="4" opacity="0"><animate attributeName="opacity" values="0;0.85;0.85;0" keyTimes="0;0.12;0.8;1" dur="10.4s" begin="2.60s" repeatCount="indefinite"/></rect><rect x="22" y="302" width="434" height="104" rx="10" fill="none" stroke="#B4472F" stroke-width="4" opacity="0"><animate attributeName="opacity" values="0;0.85;0.85;0" keyTimes="0;0.12;0.8;1" dur="10.4s" begin="5.20s" repeatCount="indefinite"/></rect><rect x="22" y="448" width="434" height="94" rx="10" fill="none" stroke="#B4472F" stroke-width="4" opacity="0"><animate attributeName="opacity" values="0;0.85;0.85;0" keyTimes="0;0.12;0.8;1" dur="10.4s" begin="7.80s" repeatCount="indefinite"/></rect></g>
  </g>
</svg>
