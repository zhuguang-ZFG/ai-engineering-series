<svg xmlns="http://www.w3.org/2000/svg" width="480" height="620" viewBox="0 0 480 620" role="img" aria-labelledby="title desc"><title id="title">整本手册，塞不进 32k 窗口</title><desc id="desc">96 页、每页约 500 字符，合计约 48 000 字符；按 0.6 到 1.2 token/字符估，整本约 28 800 到 57 600 token。上界已越过 32 768 的上下文窗口，还要留 2 000 到 4 000 给问题与输出。</desc><g font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif" fill="#26221B"><text x="26" y="42" font-size="26" text-anchor="start" fill="#26221B" font-weight="600">整本手册，塞不进 32k 窗口</text><path d="M26 56Q140 53 250 56" fill="none" stroke="#B4472F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="26" y="96" font-size="22" text-anchor="start" fill="#26221B" font-weight="600">整本手册放进提示</text><rect x="242.4" y="112" width="182.4" height="40" fill="none" stroke="#B4472F" stroke-width="1.8"/><rect x="267.53066666666666" y="112" width="157.26933333333335" height="40" fill="#B4472F" stroke="none" stroke-width="0"/><text x="248.4" y="106" font-size="19" text-anchor="start" fill="#B4472F" font-weight="400">28 800</text><text x="424.8" y="106" font-size="19" text-anchor="end" fill="#B4472F" font-weight="400">57 600</text><text x="346.16533333333336" y="176" font-size="19" text-anchor="middle" fill="#B4472F" font-weight="400">超出部分被截断</text><text x="26" y="214" font-size="22" text-anchor="start" fill="#26221B" font-weight="600">上下文窗口</text><rect x="60" y="226" width="207.53066666666666" height="38" fill="#F3EAD8" stroke="#E3D8C1" stroke-width="1.2"/><text x="66" y="252" font-size="20" text-anchor="start" fill="#26221B" font-weight="600">32 768</text><path d="M267.53066666666666 218V272" fill="none" stroke="#B4472F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/><text x="273.53066666666666" y="218" font-size="18" text-anchor="start" fill="#B4472F" font-weight="400">上界</text><path d="M60 286H440" fill="none" stroke="#E3D8C1" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M60 286V296" fill="none" stroke="#26221B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text x="60" y="320" font-size="19" text-anchor="middle" fill="#5C5448" font-weight="400">0</text><path d="M186.66666666666666 286V296" fill="none" stroke="#26221B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text x="186.66666666666666" y="320" font-size="19" text-anchor="middle" fill="#5C5448" font-weight="400">20 000</text><path d="M313.3333333333333 286V296" fill="none" stroke="#26221B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text x="313.3333333333333" y="320" font-size="19" text-anchor="middle" fill="#5C5448" font-weight="400">40 000</text><path d="M440 286V296" fill="none" stroke="#26221B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text x="440" y="320" font-size="19" text-anchor="middle" fill="#5C5448" font-weight="400">60 000</text><text x="26" y="358" font-size="22" text-anchor="start" fill="#26221B" font-weight="600">其中留给问题与输出</text><rect x="242.19733333333332" y="372" width="12.666666666666686" height="24" fill="#B4472F" stroke="none" stroke-width="0"/><text x="234.19733333333332" y="390" font-size="19" text-anchor="end" fill="#B4472F" font-weight="400">2 000–4 000</text><path d="M26 418H454" fill="none" stroke="#E3D8C1" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="26" y="448" font-size="21" text-anchor="start" fill="#26221B" font-weight="400">96 页 × 500 字符 ≈ 48 000 字符</text><text x="26" y="480" font-size="21" text-anchor="start" fill="#5C5448" font-weight="400">0.6–1.2 token/字符 → 28 800–57 600 token</text><text x="26" y="512" font-size="21" text-anchor="start" fill="#5C5448" font-weight="400">窗口 32 768，余量 2 000–4 000</text><path d="M26 536H454" fill="none" stroke="#E3D8C1" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="26" y="572" font-size="21" text-anchor="start" fill="#B4472F" font-weight="400">20 页、约 8 000 字符的小手册</text><text x="26" y="602" font-size="20" text-anchor="start" fill="#5C5448" font-weight="400">此时整本提示更小更稳，上检索是过度设计</text></g></svg>
