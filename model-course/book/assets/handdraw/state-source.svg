<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="t">
  <title id="t">状态管理：一处记账，多处对账——组件把意图上送，仓库把状态下发；反面是同一份购物车数据被抄了三份</title>
  <rect width="1200" height="780" fill="#fbfaf6"/>
  <defs>
    <filter id="card-shadow" x="-8%" y="-8%" width="116%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1f2328" flood-opacity="0.10"/>
    </filter>
  </defs>

  <g font-family="'Microsoft YaHei', system-ui, sans-serif">
    <text x="72" y="80" fill="#1f2328" font-size="34" font-weight="700">状态管理：一处记账，多处对账</text>
    <text x="72" y="120" fill="#57606a" font-size="22">购物车只记在一个地方，谁要用谁来对账</text>
    <path d="M72 142q42 6 84 0t84 0" fill="none" stroke="#B4472F" stroke-width="5" stroke-linecap="round" opacity="0.85"/>

    <!-- 组件列：三个都惦记着同一份购物车 -->
    <g stroke="#1f2328" stroke-width="4" stroke-linejoin="round" fill="#fffdf8" filter="url(#card-shadow)">
      <rect x="80" y="190" width="190" height="80" rx="14"/>
      <rect x="80" y="280" width="190" height="80" rx="9"/>
      <rect x="80" y="370" width="190" height="80" rx="15"/>
    </g>
    <g stroke="#1f2328" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="94" y="220" width="20" height="20" rx="3"/>
      <path d="M104 225v10M99 230h10"/>
      <path d="M92 309h6l4 14h12l3-10h-17"/>
      <circle cx="103" cy="328" r="2.5"/><circle cx="113" cy="328" r="2.5"/>
      <rect x="90" y="409" width="24" height="8" rx="4"/>
    </g>
    <circle cx="114" cy="405" r="5.5" fill="#B4472F" stroke="#1f2328" stroke-width="2.5"/>
    <g fill="#1f2328" font-size="21" font-weight="700">
      <text x="126" y="224">商品详情页</text>
      <text x="126" y="314">购物车页面</text>
      <text x="126" y="404">头部导航</text>
    </g>
    <g fill="#57606a" font-size="19">
      <text x="126" y="254">加入购物车</text>
      <text x="126" y="344">改数量、删除</text>
      <text x="126" y="434">购物车数量</text>
    </g>

    <!-- 每个组件一对箭头：意图上送 / 状态下发 -->
    <g stroke="#1f2328" stroke-width="4" stroke-linecap="round" fill="none">
      <path d="M270 219h252M270 309h252M270 399h252"/>
    </g>
    <g fill="#1f2328">
      <path d="M530 219l-15-8v16z"/><path d="M530 309l-15-8v16z"/><path d="M530 399l-15-8v16z"/>
    </g>
    <g stroke="#B4472F" stroke-width="4" stroke-linecap="round" fill="none">
      <path d="M530 241H278M530 331H278M530 421H278"/>
    </g>
    <g fill="#B4472F">
      <path d="M270 241l15-8v16z"/><path d="M270 331l15-8v16z"/><path d="M270 421l15-8v16z"/>
    </g>
    <text x="330" y="300" fill="#1f2328" font-size="19">意图上送（Events）</text>
    <text x="330" y="358" fill="#B4472F" font-size="19">状态下发（Props）</text>

    <!-- 账本 = 全局仓库 -->
    <text x="655" y="180" fill="#57606a" font-size="20" text-anchor="middle">所有组件从这里读写数据</text>
    <g stroke="#1f2328" stroke-width="3" fill="none">
      <circle cx="570" cy="200" r="7"/><circle cx="612" cy="200" r="7"/>
      <circle cx="654" cy="200" r="7"/><circle cx="696" cy="200" r="7"/><circle cx="738" cy="200" r="7"/>
    </g>
    <rect x="530" y="200" width="250" height="250" rx="16" fill="#fffdf8" stroke="#1f2328" stroke-width="4" filter="url(#card-shadow)"/>
    <text x="655" y="240" fill="#1f2328" font-size="22" font-weight="700" text-anchor="middle">仓库 Store</text>
    <g fill="#f0e9d8">
      <rect x="548" y="252" width="214" height="32" rx="6"/>
      <rect x="548" y="290" width="214" height="32" rx="6"/>
    </g>
    <g fill="#1f2328" font-size="19" text-anchor="middle">
      <text x="655" y="274">购物车 items</text>
      <text x="655" y="312">用户信息 userInfo</text>
    </g>
    <text x="655" y="352" fill="#B4472F" font-size="20" font-weight="700" text-anchor="middle">只此一份</text>
    <path d="M548 366h214" stroke="#e6e1d4" stroke-width="3" stroke-linecap="round"/>
    <g fill="#57606a" font-size="19" text-anchor="middle">
      <text x="655" y="392">Pinia · Vue</text>
      <text x="655" y="418">Redux / Zustand · React</text>
    </g>

    <!-- 反面：各组件自己记 -->
    <rect x="820" y="190" width="308" height="310" rx="14" fill="#e6e1d4" stroke="#1f2328" stroke-width="4" filter="url(#card-shadow)"/>
    <path d="M888 206l18 18M906 206l-18 18" stroke="#B4472F" stroke-width="4" stroke-linecap="round" fill="none"/>
    <text x="920" y="224" fill="#1f2328" font-size="22" font-weight="700">各组件自己记</text>
    <g fill="#fffdf8" stroke="#1f2328" stroke-width="3">
      <rect x="848" y="244" width="252" height="50" rx="8"/>
      <rect x="848" y="306" width="252" height="50" rx="8"/>
      <rect x="848" y="368" width="252" height="50" rx="8"/>
    </g>
    <g fill="#1f2328" font-size="19">
      <text x="862" y="276">cart</text>
      <text x="862" y="338">cartItems</text>
      <text x="862" y="400">cartCount</text>
    </g>
    <g fill="#57606a" font-size="19" text-anchor="end">
      <text x="1086" y="276">商品详情页</text>
      <text x="1086" y="338">购物车页面</text>
      <text x="1086" y="400">头部导航</text>
    </g>
    <text x="974" y="444" fill="#1f2328" font-size="20" text-anchor="middle">同一份数据抄了三份</text>
    <text x="974" y="476" fill="#B4472F" font-size="20" font-weight="700" text-anchor="middle">改一处，漏两处</text>

    <!-- 什么时候才需要仓库 -->
    <text x="80" y="540" fill="#1f2328" font-size="22" font-weight="700">什么时候才需要仓库？</text>
    <g stroke="#1f2328" stroke-width="4" stroke-linejoin="round">
      <rect x="80" y="558" width="336" height="92" rx="16" fill="#fffdf8" filter="url(#card-shadow)"/>
      <rect x="432" y="558" width="336" height="92" rx="10" fill="#fffdf8" filter="url(#card-shadow)"/>
      <rect x="784" y="558" width="344" height="92" rx="17" fill="#f7f3e8" filter="url(#card-shadow)"/>
    </g>
    <g fill="#B4472F">
      <circle cx="112" cy="590" r="16"/><circle cx="464" cy="590" r="16"/><circle cx="816" cy="590" r="16"/>
    </g>
    <g fill="#fbfaf6" font-size="19" font-weight="700" text-anchor="middle">
      <text x="112" y="597">1</text><text x="464" y="597">2</text><text x="816" y="597">3</text>
    </g>
    <g fill="#1f2328" font-size="21" font-weight="700">
      <text x="138" y="598">只有一个组件用</text>
      <text x="490" y="598">两三个组件共享</text>
      <text x="842" y="598">五个以上或常变</text>
    </g>
    <g fill="#57606a" font-size="19">
      <text x="138" y="632">输入框、弹窗开关 → ref</text>
      <text x="490" y="632">props / events 就够</text>
      <text x="842" y="632">才考虑状态管理库</text>
    </g>

    <!-- 结论 -->
    <rect x="72" y="674" width="1056" height="78" rx="18" fill="#f7f3e8" stroke="#B4472F" stroke-width="3" filter="url(#card-shadow)"/>
    <text x="600" y="706" fill="#1f2328" font-size="22" font-weight="700" text-anchor="middle">单一数据源：同一份数据只在一个地方存储</text>
    <text x="600" y="736" fill="#1f2328" font-size="20" text-anchor="middle">从简单开始，按需升级：先 props / events，共享的组件多了再上仓库</text>
  </g>
</svg>
