<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="t">
  <title id="t">The Mom Test：少问未来的意愿，多问过去发生过什么</title>
  <rect width="1200" height="620" fill="#fbfaf6"/>
  <defs>
    <filter id="card-shadow" x="-8%" y="-8%" width="116%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1f2328" flood-opacity="0.10"/>
    </filter>
  </defs>

  <text x="72" y="80" fill="#1f2328" font-family="'Microsoft YaHei', system-ui, sans-serif" font-size="34" font-weight="700">The Mom Test：别问出好听的假话</text>
  <text x="338" y="152" fill="#1f2328" font-family="'Microsoft YaHei', system-ui, sans-serif" font-size="26" font-weight="700" text-anchor="middle">少问：未来的意愿</text>
  <text x="858" y="152" fill="#1f2328" font-family="'Microsoft YaHei', system-ui, sans-serif" font-size="26" font-weight="700" text-anchor="middle">多问：过去的事实</text>
  <path d="M600 180v376" stroke="#e6e1d4" stroke-width="3"/>

  <g font-family="'Microsoft YaHei', system-ui, sans-serif" font-size="22">
    <g fill="#57606a">
      <path d="M108 200h480a20 20 0 0 1 20 20v52a20 20 0 0 1-20 20H108a20 20 0 0 1-20-20v-52a20 20 0 0 1 20-20z" fill="#e6e1d4" stroke="#57606a" stroke-width="3" filter="url(#card-shadow)"/>
      <text x="140" y="252">你会买吗？</text>
      <path d="M108 320h480a20 20 0 0 1 20 20v52a20 20 0 0 1-20 20H108a20 20 0 0 1-20-20v-52a20 20 0 0 1 20-20z" fill="#e6e1d4" stroke="#57606a" stroke-width="3" filter="url(#card-shadow)"/>
      <text x="140" y="372">你觉得这个想法好吗？</text>
    </g>
    <g stroke="#57606a" stroke-width="5" stroke-linecap="round">
      <path d="M528 206l14 14m0-14l-14 14"/><path d="M528 326l14 14m0-14l-14 14"/>
    </g>
    <g>
      <rect x="660" y="196" width="396" height="64" rx="20" fill="#f1f7f2" stroke="#1f883d" stroke-width="3" filter="url(#card-shadow)"/>
      <text x="686" y="237" fill="#1f2328">上次遇到这问题是什么时候？</text>
      <rect x="660" y="288" width="396" height="64" rx="20" fill="#f1f7f2" stroke="#1f883d" stroke-width="3" filter="url(#card-shadow)"/>
      <text x="686" y="329" fill="#1f2328">你当时是怎么处理的？</text>
      <rect x="660" y="380" width="396" height="64" rx="20" fill="#f1f7f2" stroke="#1f883d" stroke-width="3" filter="url(#card-shadow)"/>
      <text x="686" y="421" fill="#1f2328">为此付出了多少时间或钱？</text>
    </g>
  </g>

  <text x="72" y="500" fill="#57606a" font-family="'Microsoft YaHei', system-ui, sans-serif" font-size="21">左边这些问题只会换来「挺好的」「应该会吧」，那是礼貌，不是证据；</text>
  <text x="72" y="532" fill="#57606a" font-family="'Microsoft YaHei', system-ui, sans-serif" font-size="21">右边问的是已经发生过的事，回答里带着时间、步骤和金额，你才能判断需求真假。</text>
</svg>
