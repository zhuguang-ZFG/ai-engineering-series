<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="804" viewBox="0 0 1200 804" role="img" aria-labelledby="t">
  <title id="t">冯·诺依曼计算机的五大件：输入设备 → 存储器 → CPU（控制器指挥、运算器计算、寄存器记地址）→ 输出设备，全部挂在系统总线（地址总线单向、数据总线双向、控制总线）上；内存装正在跑的程序和数据、断电就忘，硬盘长期保存；一条指令按取指→译码→执行→访存→写回转一圈；取数据的速度差可达上百万倍，瓶颈常在取数据而不是算</title>
  <rect width="1200" height="804" fill="#fbfaf6"/>
  <defs>
    <filter id="card-shadow" x="-8%" y="-8%" width="116%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1f2328" flood-opacity="0.10"/>
    </filter>
  </defs>

  <text x="72" y="80" fill="#1f2328" font-family="'Microsoft YaHei', system-ui, sans-serif" font-size="34" font-weight="700">冯·诺依曼计算机：五大件 + 一条总线</text>
  <text x="72" y="120" fill="#57606a" font-family="'Microsoft YaHei', system-ui, sans-serif" font-size="22">存储程序：程序和数据一样存在内存里，CPU 逐条取来执行</text>
  <text x="1128" y="120" fill="#57606a" font-family="'Microsoft YaHei', system-ui, sans-serif" font-size="22" text-anchor="end">数据通路：输入 · 存储 · 运算 · 输出</text>
  <path d="M72 142q42 6 84 0t84 0" fill="none" stroke="#B4472F" stroke-width="5" stroke-linecap="round" opacity="0.85"/>

  <g font-family="'Microsoft YaHei', system-ui, sans-serif">

    <!-- 总线 -->
    <g stroke="#1f2328" stroke-width="4" stroke-linecap="round" fill="none">
      <path d="M147 356v64"/><path d="M394 400v20"/><path d="M746 400v20"/><path d="M1053 356v64"/>
    </g>
    <rect x="100" y="420" width="1028" height="72" rx="18" fill="#f7f3e8" stroke="#1f2328" stroke-width="4" filter="url(#card-shadow)"/>
    <text x="614" y="450" fill="#1f2328" font-size="21" font-weight="700" text-anchor="middle">系统总线：所有部件共用的通道</text>
    <text x="614" y="478" fill="#57606a" font-size="19" text-anchor="middle">地址总线（CPU 单向发给内存）· 数据总线（来回双向）· 控制总线（控制器发号施令）</text>

    <!-- 输入设备：一把键盘 -->
    <rect x="72" y="232" width="150" height="124" rx="16" fill="#fffdf8" stroke="#1f2328" stroke-width="4" filter="url(#card-shadow)"/>
    <rect x="88" y="248" width="118" height="36" rx="6" fill="#f7f3e8" stroke="#1f2328" stroke-width="3"/>
    <g fill="#e6e1d4" stroke="#1f2328" stroke-width="2">
      <rect x="96" y="254" width="10" height="5" rx="2"/><rect x="110" y="254" width="10" height="5" rx="2"/><rect x="124" y="254" width="10" height="5" rx="2"/><rect x="138" y="254" width="10" height="5" rx="2"/><rect x="152" y="254" width="10" height="5" rx="2"/><rect x="166" y="254" width="10" height="5" rx="2"/><rect x="180" y="254" width="10" height="5" rx="2"/>
      <rect x="96" y="264" width="10" height="5" rx="2"/><rect x="110" y="264" width="10" height="5" rx="2"/><rect x="124" y="264" width="10" height="5" rx="2"/><rect x="138" y="264" width="10" height="5" rx="2"/><rect x="152" y="264" width="10" height="5" rx="2"/><rect x="166" y="264" width="10" height="5" rx="2"/><rect x="180" y="264" width="10" height="5" rx="2"/>
      <rect x="110" y="274" width="74" height="5" rx="2"/>
    </g>
    <text x="147" y="314" fill="#1f2328" font-size="21" font-weight="700" text-anchor="middle">输入设备</text>
    <text x="147" y="340" fill="#57606a" font-size="19" text-anchor="middle">键盘 · 鼠标</text>

    <!-- 存储器：内存 / 硬盘 -->
    <rect x="272" y="178" width="244" height="222" rx="16" fill="#fffdf8" stroke="#1f2328" stroke-width="4" filter="url(#card-shadow)"/>
    <text x="288" y="208" fill="#1f2328" font-size="21" font-weight="700">存储器</text>
    <rect x="452" y="190" width="44" height="18" rx="4" fill="#e6e1d4" stroke="#1f2328" stroke-width="3"/>
    <g stroke="#1f2328" stroke-width="3" stroke-linecap="round" fill="none">
      <path d="M460 208v6"/><path d="M474 208v6"/><path d="M488 208v6"/>
    </g>
    <rect x="288" y="220" width="212" height="92" rx="12" fill="#f7f3e8" stroke="#1f2328" stroke-width="3"/>
    <text x="302" y="246" fill="#1f2328" font-size="19" font-weight="700">内存（主存）</text>
    <text x="302" y="272" fill="#57606a" font-size="19">程序和数据都放这儿</text>
    <text x="302" y="300" fill="#B4472F" font-size="19" font-weight="700">断电就忘</text>
    <g stroke="#B4472F" stroke-width="3" stroke-linecap="round" fill="none">
      <path d="M471 289a10 10 0 1 0 14 0"/><path d="M478 283v10"/>
    </g>
    <rect x="288" y="320" width="212" height="72" rx="12" fill="#fffdf8" stroke="#1f2328" stroke-width="3"/>
    <text x="302" y="346" fill="#1f2328" font-size="19" font-weight="700">硬盘（外存）</text>
    <text x="302" y="376" fill="#B4472F" font-size="19" font-weight="700">关机也长期保存</text>
    <g stroke="#57606a" stroke-width="3" fill="none">
      <circle cx="474" cy="372" r="11"/><circle cx="474" cy="372" r="3.5"/>
    </g>

    <!-- CPU：控制器指挥 + 运算器算 + 寄存器 -->
    <rect x="566" y="178" width="360" height="222" rx="16" fill="#fffdf8" stroke="#1f2328" stroke-width="4" filter="url(#card-shadow)"/>
    <text x="584" y="210" fill="#1f2328" font-size="23" font-weight="700">CPU</text>
    <text x="908" y="210" fill="#57606a" font-size="19" text-anchor="end">运算器 + 控制器 + 寄存器</text>
    <rect x="584" y="222" width="324" height="56" rx="12" fill="#f7f3e8" stroke="#1f2328" stroke-width="3"/>
    <text x="600" y="256" fill="#1f2328" font-size="21" font-weight="700">控制器 CU · 指挥</text>
    <g stroke="#1f2328" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M802 256v-16l26-12v40l-26-12z"/><path d="M840 238q10 12 0 24"/><path d="M854 232q16 18 0 36"/>
    </g>
    <rect x="584" y="288" width="324" height="56" rx="12" fill="#f7f3e8" stroke="#1f2328" stroke-width="3"/>
    <text x="600" y="322" fill="#1f2328" font-size="21" font-weight="700">运算器 ALU · 计算</text>
    <g stroke="#1f2328" stroke-width="4" stroke-linecap="round" fill="none">
      <path d="M816 306v24M804 318h24"/><path d="M850 308l20 20M870 308l-20 20"/>
    </g>
    <rect x="584" y="354" width="324" height="38" rx="10" fill="none" stroke="#1f2328" stroke-width="3" stroke-dasharray="9 7"/>
    <text x="602" y="380" fill="#1f2328" font-size="19" font-weight="700">寄存器 PC · IR</text>
    <text x="896" y="380" fill="#57606a" font-size="19" text-anchor="end">记住取到哪儿</text>

    <!-- 输出设备：一台显示器 -->
    <rect x="978" y="232" width="150" height="124" rx="16" fill="#fffdf8" stroke="#1f2328" stroke-width="4" filter="url(#card-shadow)"/>
    <rect x="994" y="244" width="118" height="34" rx="6" fill="#f7f3e8" stroke="#1f2328" stroke-width="3"/>
    <g stroke="#57606a" stroke-width="3" stroke-linecap="round" fill="none">
      <path d="M1006 256h52"/><path d="M1006 266h32"/>
    </g>
    <path d="M1043 278h20v6h-20z" fill="#e6e1d4" stroke="#1f2328" stroke-width="3" stroke-linejoin="round"/>
    <path d="M1026 284h54" stroke="#1f2328" stroke-width="4" stroke-linecap="round" fill="none"/>
    <text x="1053" y="314" fill="#1f2328" font-size="21" font-weight="700" text-anchor="middle">输出设备</text>
    <text x="1053" y="340" fill="#57606a" font-size="19" text-anchor="middle">显示器 · 打印机</text>

    <!-- 数据流箭头 -->
    <g stroke="#1f2328" stroke-width="4" stroke-linecap="round" fill="none">
      <path d="M226 288h32"/><path d="M534 288h20"/>
      <path d="M930 288h32"/>
    </g>
    <g fill="#1f2328">
      <path d="M272 288l-14-7v14z"/>
      <path d="M566 288l-14-7v14z"/><path d="M520 288l14-7v14z"/>
      <path d="M978 288l-14-7v14z"/>
    </g>

    <!-- 指令周期 -->
    <rect x="72" y="512" width="576" height="168" rx="16" fill="#fffdf8" stroke="#1f2328" stroke-width="4" filter="url(#card-shadow)"/>
    <text x="90" y="542" fill="#1f2328" font-size="21" font-weight="700">一条指令转一圈（指令周期）</text>
    <g fill="#f7f3e8" stroke="#1f2328" stroke-width="3">
      <rect x="90" y="560" width="88" height="44" rx="10"/><rect x="203" y="560" width="88" height="44" rx="10"/><rect x="316" y="560" width="88" height="44" rx="10"/><rect x="429" y="560" width="88" height="44" rx="10"/><rect x="542" y="560" width="88" height="44" rx="10"/>
    </g>
    <g fill="#1f2328" font-size="21" font-weight="700" text-anchor="middle">
      <text x="134" y="589">取指</text><text x="247" y="589">译码</text><text x="360" y="589">执行</text><text x="473" y="589">访存</text><text x="586" y="589">写回</text>
    </g>
    <g stroke="#1f2328" stroke-width="3" stroke-linecap="round" fill="none">
      <path d="M182 582h9"/><path d="M295 582h9"/><path d="M408 582h9"/><path d="M521 582h9"/>
    </g>
    <g fill="#1f2328">
      <path d="M203 582l-11-6v12z"/><path d="M316 582l-11-6v12z"/><path d="M429 582l-11-6v12z"/><path d="M542 582l-11-6v12z"/>
    </g>
    <path d="M586 604v14c0 8-7 15-15 15H149c-8 0-15-7-15-15v-14" fill="none" stroke="#B4472F" stroke-width="4" stroke-linecap="round"/>
    <path d="M134 604l-7 14h14z" fill="#B4472F"/>
    <text x="360" y="660" fill="#B4472F" font-size="19" font-weight="700" text-anchor="middle">自动取下一条，一圈圈不停</text>

    <!-- 取纸比喻：速度层次 -->
    <rect x="672" y="512" width="456" height="168" rx="16" fill="#fffdf8" stroke="#1f2328" stroke-width="4" filter="url(#card-shadow)"/>
    <text x="690" y="542" fill="#1f2328" font-size="21" font-weight="700">取一张纸要多久</text>
    <g fill="#1f2328" font-size="19">
      <text x="690" y="574">桌上拿纸 · 寄存器</text>
      <text x="690" y="602">下楼便利店 · 内存</text>
      <text x="690" y="630">另一个国家 · 硬盘</text>
    </g>
    <g stroke="#e6e1d4" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 9" fill="none">
      <path d="M850 568h135"/><path d="M850 596h135"/><path d="M850 624h135"/>
    </g>
    <g fill="#57606a" font-size="19" text-anchor="end">
      <text x="1110" y="574">不到 1 纳秒</text>
      <text x="1110" y="602">50–100 纳秒</text>
      <text x="1110" y="630">5–10 毫秒</text>
    </g>
    <text x="690" y="660" fill="#B4472F" font-size="19" font-weight="700">速度差异可达上百万倍</text>

    <!-- 结论 -->
    <rect x="72" y="696" width="1056" height="84" rx="18" fill="#f7f3e8" stroke="#B4472F" stroke-width="3" filter="url(#card-shadow)"/>
    <text x="600" y="730" fill="#1f2328" font-size="22" font-weight="700" text-anchor="middle">真正的瓶颈常常不在「算」，而在「取数据」</text>
    <text x="600" y="760" fill="#57606a" font-size="19" text-anchor="middle">所以现代计算机的优化都围着它转：缓存 · 指令流水线 · 超标量 · 多核并行</text>
  </g>
</svg>
