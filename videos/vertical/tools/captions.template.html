<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    #cap-stage {
      position: absolute;
      left: 0;
      top: 1300px;
      width: 1080px;
      text-align: center;
      overflow: visible;
    }
    .cap-group {
      position: absolute;
      left: 0;
      width: 1080px;
      text-align: center;
      font-family: "Noto Sans JP", sans-serif;
      font-weight: 700;
      font-size: 48px;
      line-height: 1.34;
      color: #ffffff;
      visibility: hidden;
    }
    .cap-group span {
      background: rgba(31, 35, 40, 0.78);
      border-radius: 10px;
      padding: 12px 26px;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }
  </style>
  <div data-hf-id="hf-jn2k" id="root" data-composition-id="reel-captions" data-width="1080" data-height="1920">
    <div data-hf-id="hf-fhg2" id="cap-stage"></div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    const GROUPS = __DATA__;
    const stage = document.getElementById("cap-stage");
    GROUPS.forEach((g, i) => {
      const div = document.createElement("div");
      div.className = "cap-group";
      div.id = "cap-" + i;
      const inner = document.createElement("span");
      inner.textContent = g.text;
      div.appendChild(inner);
      stage.appendChild(div);
      gsap.set(div, { opacity: 0, visibility: "hidden" });
      const start = Math.max(g.start, 0.1);
      const end = Math.max(g.end, start + 0.3);
      tl.set(div, { visibility: "visible" }, start);
      tl.fromTo(div, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power2.out" }, start);
      tl.to(div, { opacity: 0, duration: 0.12, ease: "power2.in" }, end - 0.12);
      tl.set(div, { visibility: "hidden" }, end);
    });
    window.__timelines["reel-captions"] = tl;
  </script>
</template>
