            const frag = document.createDocumentFragment();
            parts.forEach((p) => {

              const s = document.createElement("span");
              s.className = "k-word";
              s.setAttribute("data-hf-id", "hf-k" + (++kid));
              s.textContent = p;
              frag.appendChild(s);
            });

        });
      };
      walk(el);
    }
