  <script>

    // kinetic type: split glyphs/words so headlines can be choreographed
    let kid = 0;
    function ksplit(el) {
      const walk = (node) => {
        Array.from(node.childNodes).forEach((ch) => {
          if (ch.nodeType === 3) {
            const parts = ch.textContent.match(/[A-Za-z0-9_:.\/@#-]+|\s+|[\s\S]/g) || [];
            const frag = document.createDocumentFragment();
            parts.forEach((p) => {
              if (/^\s+$/.test(p)) { frag.appendChild(document.createTextNode(p)); return; }
              const s = document.createElement("span");
              s.className = "k-word";
              s.setAttribute("data-hf-id", "hf-k" + (++kid));
              s.textContent = p;
              frag.appendChild(s);
            });
            ch.replaceWith(frag);
          } else if (ch.nodeType === 1 && ch.tagName !== "BR") walk(ch);
        });
      };
      walk(el);
    }
    const tl = gsap.timeline({ paused: true });
    const vars = window.__hyperframes.getVariables();
    document.getElementById("e-tag").textContent = vars.tag;
    document.getElementById("e-big").innerHTML = vars.big;
    document.getElementById("e-sub").textContent = vars.sub;
    document.getElementById("e-card").textContent = vars.card;
    document.getElementById("e-foot").textContent = vars.foot;
    tl.set("#e-tag, #e-big", { opacity: 1 }, 0);
    tl.fromTo("#e-rule", { scaleX: 0.18, transformOrigin: "left center" }, { scaleX: 1, duration: 0.45, ease: "power3.out" }, 0);
