    function ksplit(el) {

          if (ch.nodeType === 3) {
            const parts = ch.textContent.match(/[A-Za-z0-9_:.\/@#-]+|\s+|[\s\S]/g) || [];
            const frag = document.createDocumentFragment();
            parts.forEach((p) => {
              if (/^\s+$/.test(p)) { frag.appendChild(document.createTextNode(p)); return; }
              const s = document.createElement("span");
              s.className = "k-word";
              s.setAttribute("data-hf-id", "hf-k" + (++kid));
              s.textContent = p;
              frag.appendChild(s);
            });
            ch.replaceWith(frag);
          } else if (ch.nodeType === 1 && ch.tagName !== "BR") walk(ch);
        });
      };
      walk(el);
    }
