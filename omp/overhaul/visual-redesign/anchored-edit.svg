<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
<title id="title">改对内容，也要改对位置。</title><desc id="desc">对比按文本替换与按锚点定位；相同文本可能出现在两个位置，锚点过期时重新读取。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#DB582C" stroke-width="1.5"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}.ink{fill:#252923}.muted{fill:#72786C}.accent{fill:#DB582C}.paper{fill:#FAF7EF}.mono{font-family:Consolas,"Liberation Mono",monospace;fill:#252923}.white{fill:#FFFDF7}.line{fill:none;stroke:#252923;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.flow{fill:none;stroke:#DB582C;stroke-width:3;stroke-linecap:round;marker-end:url(#arrow)}</style>
<rect width="1440" height="960" fill="#FAF7EF"/><path d="M72 80 H112" stroke="#DB582C" stroke-width="5" stroke-linecap="round"/><text x="132" y="88" class="muted" font-size="20">代码编辑</text><text x="72" y="171" class="ink" font-size="54">改对内容，也要改对位置。</text><text x="74" y="219" class="muted" font-size="24">同一句代码出现两次时，位置本身就是信息。</text><path d="M720 286V745" stroke="#CFD0C4" stroke-dasharray="4 8"/><text x="96" y="303" class="ink" font-size="30">仅凭相同文本</text><rect x="96" y="342" width="550" height="223" rx="12" fill="#F0EEE4" stroke="#D6D7C9"/>
<rect x="108" y="377" width="526" height="54" rx="5" fill="#E8E5D9"/>
<rect x="108" y="452" width="526" height="54" rx="5" fill="#E8E5D9"/><text x="124" y="415" class="muted" font-size="20">12</text><text x="216" y="415" class="mono" font-size="27">config = 'old'</text><text x="124" y="490" class="muted" font-size="20">37</text><text x="216" y="490" class="mono" font-size="27">config = 'old'</text><text x="120" y="542" class="muted" font-size="18">两处相同文本</text><path d="M374 587V629" class="flow"/><text x="106" y="686" class="ink" font-size="27">相同文本 ≠ 相同位置</text><text x="106" y="728" class="muted" font-size="23">先确认目标，再执行替换。</text><text x="790" y="303" class="ink" font-size="30">按锚点定位</text><rect x="790" y="342" width="550" height="223" rx="12" fill="#F0EEE4" stroke="#D6D7C9"/>
<rect x="802" y="452" width="526" height="54" rx="5" fill="#E3EAD9"/>
<text x="818" y="415" class="muted" font-size="20">12#AB</text><text x="910" y="415" class="mono" font-size="27">config = 'old'</text><text x="818" y="490" class="muted" font-size="20">37#CD</text><text x="910" y="490" class="mono" font-size="27">config = 'new'</text><text x="814" y="542" class="muted" font-size="18">目标行已定位</text><path d="M1068 587V629" class="flow"/><text x="800" y="686" class="accent" font-size="27">读出标签 → 定位 → 修改</text><text x="800" y="728" class="muted" font-size="23">锚点过期，先重新读取。</text><path d="M72 858H1368" stroke="#CFD0C4"/><text x="72" y="907" class="muted" font-size="20">示意数据 · 行号与标签用于说明定位，不是 API 调用签名</text><text x="1100" y="907" class="muted" font-size="18">OMP / 编辑</text></svg>
