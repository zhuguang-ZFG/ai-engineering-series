<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
<title id="title">编辑锚定的是快照，不是猜测。</title><desc id="desc">hashline 用 PATH#TAG 锚定；TAG 来自 read/grep/成功 edit。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#DB582C" stroke-width="1.5"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}.ink{fill:#252923}.muted{fill:#72786C}.accent{fill:#DB582C}.mono{font-family:Consolas,"Liberation Mono",monospace;fill:#252923}.white{fill:#FFFDF7}.line{fill:none;stroke:#252923;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.flow{fill:none;stroke:#DB582C;stroke-width:3;stroke-linecap:round;marker-end:url(#arrow)}.soft{fill:#F0EEE4;stroke:#D6D7C9}.card{fill:#FFFDF7;stroke:#ABB19F;stroke-width:1.5}.hi{fill:#E3EAD9;stroke:#ABB19F;stroke-width:1.5}.warn{fill:#F7E6DC;stroke:#DB582C;stroke-width:1.5}</style>
<rect width="1440" height="960" fill="#FAF7EF"/>
<path d="M72 80 H112" stroke="#DB582C" stroke-width="5" stroke-linecap="round"/>
<text x="132" y="88" class="muted" font-size="20">代码编辑</text>

<text x="72" y="171" class="ink" font-size="52">编辑锚定的是快照，不是猜测。</text>
<text x="74" y="219" class="muted" font-size="24">四位十六进制 TAG 来自最近一次 read / grep / 成功 edit。</text>
<rect x="96" y="300" width="560" height="420" rx="14" class="soft"/>
<text x="128" y="360" class="ink" font-size="28">锚定来源</text>
<rect x="128" y="390" width="496" height="70" rx="8" class="card"/>
<text x="148" y="435" class="mono" font-size="26">read   src/app.ts</text>
<rect x="128" y="480" width="496" height="70" rx="8" class="card"/>
<text x="148" y="525" class="mono" font-size="26">grep   "config"</text>
<rect x="128" y="570" width="496" height="70" rx="8" class="hi"/>
<text x="148" y="615" class="mono" font-size="26">edit   成功落地</text>
<text x="128" y="680" class="muted" font-size="20">三者之一即可刷新锚点</text>
<path d="M700 510 H820" class="flow"/>
<rect x="840" y="340" width="520" height="340" rx="14" class="soft"/>
<text x="872" y="400" class="ink" font-size="28">补丁头写法</text>
<rect x="872" y="440" width="456" height="90" rx="8" fill="#DB582C"/>
<text x="892" y="497" class="white mono" font-size="28">[src/app.ts#1A2B]</text>
<text x="872" y="580" class="muted" font-size="22">PATH # TAG</text>
<text x="872" y="630" class="ink" font-size="24">TAG 对不上 → 拒绝或恢复</text>
<text x="872" y="675" class="muted" font-size="20">不静默改错地方</text>

<path d="M72 858 H1368" stroke="#CFD0C4"/>
<text x="72" y="907" class="muted" font-size="20">对应正文 §9 · hashline 锚点</text>
<text x="1100" y="907" class="muted" font-size="18">OMP / 编辑</text>
</svg>
