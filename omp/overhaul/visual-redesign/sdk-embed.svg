<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
<title id="title">宿主进程内：创建、订阅、提问、释放。</title><desc id="desc">SDK 用 createAgentSession；生命周期归宿主，不替你装信号处理器。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#DB582C" stroke-width="1.5"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}.ink{fill:#252923}.muted{fill:#72786C}.accent{fill:#DB582C}.mono{font-family:Consolas,"Liberation Mono",monospace;fill:#252923}.white{fill:#FFFDF7}.line{fill:none;stroke:#252923;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.flow{fill:none;stroke:#DB582C;stroke-width:3;stroke-linecap:round;marker-end:url(#arrow)}.soft{fill:#F0EEE4;stroke:#D6D7C9}.card{fill:#FFFDF7;stroke:#ABB19F;stroke-width:1.5}.hi{fill:#E3EAD9;stroke:#ABB19F;stroke-width:1.5}.warn{fill:#F7E6DC;stroke:#DB582C;stroke-width:1.5}</style>
<rect width="1440" height="960" fill="#FAF7EF"/>
<path d="M72 80 H112" stroke="#DB582C" stroke-width="5" stroke-linecap="round"/>
<text x="132" y="88" class="muted" font-size="20">SDK 嵌入</text>

<text x="72" y="171" class="ink" font-size="44">宿主进程内：创建、订阅、提问、释放。</text>
<text x="74" y="219" class="muted" font-size="24">SDK ≠ RPC；编辑器若要 ACP，别误接 --mode rpc。</text>
<rect x="100" y="320" width="280" height="360" rx="14" class="soft"/>
<text x="140" y="400" class="ink" font-size="26">01 创建</text>
<text x="130" y="460" class="mono" font-size="18">createAgent</text>
<text x="130" y="500" class="mono" font-size="18">Session</text>
<path d="M400 500 H480" class="flow"/>
<rect x="500" y="320" width="280" height="360" rx="14" class="soft"/>
<text x="540" y="400" class="ink" font-size="26">02 订阅</text>
<text x="530" y="470" class="muted" font-size="20">事件流</text>
<path d="M800 500 H880" class="flow"/>
<rect x="900" y="320" width="220" height="360" rx="14" class="hi"/>
<text x="940" y="400" class="ink" font-size="26">03 提问</text>
<text x="930" y="470" class="muted" font-size="20">prompt</text>
<path d="M1140 500 H1200" class="flow"/>
<rect x="1220" y="320" width="160" height="360" rx="14" class="warn"/>
<text x="1250" y="400" class="ink" font-size="24">04 释放</text>
<text x="1245" y="470" class="muted" font-size="18">dispose</text>
<text x="100" y="730" class="muted" font-size="20">进程卡住？检查宿主是否处理了信号与退出——SDK 不代劳。</text>

<path d="M72 858 H1368" stroke="#CFD0C4"/>
<text x="72" y="907" class="muted" font-size="20">对应正文第 28 章 · SDK 入门</text>
<text x="1100" y="907" class="muted" font-size="18">OMP / SDK</text>
</svg>
