<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
<title id="title">模型看见的是描述，不是代码。</title><desc id="desc">自定义工具挂进同一工具循环；description 决定能否被检索。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#DB582C" stroke-width="1.5"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}.ink{fill:#252923}.muted{fill:#72786C}.accent{fill:#DB582C}.mono{font-family:Consolas,"Liberation Mono",monospace;fill:#252923}.white{fill:#FFFDF7}.line{fill:none;stroke:#252923;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.flow{fill:none;stroke:#DB582C;stroke-width:3;stroke-linecap:round;marker-end:url(#arrow)}.soft{fill:#F0EEE4;stroke:#D6D7C9}.card{fill:#FFFDF7;stroke:#ABB19F;stroke-width:1.5}.hi{fill:#E3EAD9;stroke:#ABB19F;stroke-width:1.5}.warn{fill:#F7E6DC;stroke:#DB582C;stroke-width:1.5}</style>
<rect width="1440" height="960" fill="#FAF7EF"/>
<path d="M72 80 H112" stroke="#DB582C" stroke-width="5" stroke-linecap="round"/>
<text x="132" y="88" class="muted" font-size="20">自定义工具</text>

<text x="72" y="171" class="ink" font-size="48">模型看见的是描述，不是代码。</text>
<text x="74" y="219" class="muted" font-size="24">工具再对，描述写成 helper 就等于没写。</text>
<rect x="96" y="300" width="520" height="420" rx="14" class="soft"/>
<text x="128" y="360" class="ink" font-size="28">你的实现</text>
<rect x="128" y="400" width="456" height="200" rx="10" fill="#252923"/>
<text x="160" y="460" fill="#E8E5D9" font-family="Consolas,monospace" font-size="22">function countTsFiles()</text>
<text x="160" y="520" fill="#A8B0A0" font-family="Consolas,monospace" font-size="20">// 代码正确 ≠ 会被调用</text>
<text x="128" y="650" class="muted" font-size="20">注册进运行时还不够</text>
<path d="M650 510 H750" class="flow"/>
<rect x="770" y="300" width="590" height="420" rx="14" class="hi"/>
<text x="810" y="360" class="ink" font-size="28">工具卡片 · 同一循环</text>
<rect x="810" y="400" width="510" height="90" rx="8" fill="#DB582C"/>
<text x="840" y="455" class="white" font-size="24">description：说人话的场景</text>
<rect x="810" y="520" width="510" height="70" rx="8" class="card"/>
<text x="840" y="565" class="mono" font-size="22">name / schema / handler</text>
<text x="810" y="640" class="ink" font-size="22">改完描述要重开会话</text>
<text x="810" y="685" class="muted" font-size="18">检索不到 = 描述失效，不一定是 bug</text>

<path d="M72 858 H1368" stroke="#CFD0C4"/>
<text x="72" y="907" class="muted" font-size="20">对应正文第 21 章 · Custom tools</text>
<text x="1100" y="907" class="muted" font-size="18">OMP / 扩展</text>
</svg>
