<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
<title id="title">元数据常驻；正文按需拉取。</title><desc id="desc">skill 描述常驻上下文；正文经 skill:// 按需加载。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#DB582C" stroke-width="1.5"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}.ink{fill:#252923}.muted{fill:#72786C}.accent{fill:#DB582C}.mono{font-family:Consolas,"Liberation Mono",monospace;fill:#252923}.white{fill:#FFFDF7}.line{fill:none;stroke:#252923;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.flow{fill:none;stroke:#DB582C;stroke-width:3;stroke-linecap:round;marker-end:url(#arrow)}.soft{fill:#F0EEE4;stroke:#D6D7C9}.card{fill:#FFFDF7;stroke:#ABB19F;stroke-width:1.5}.hi{fill:#E3EAD9;stroke:#ABB19F;stroke-width:1.5}.warn{fill:#F7E6DC;stroke:#DB582C;stroke-width:1.5}</style>
<rect width="1440" height="960" fill="#FAF7EF"/>
<path d="M72 80 H112" stroke="#DB582C" stroke-width="5" stroke-linecap="round"/>
<text x="132" y="88" class="muted" font-size="20">技能系统</text>

<text x="72" y="171" class="ink" font-size="48">元数据常驻；正文按需拉取。</text>
<text x="74" y="219" class="muted" font-size="24">发现失败先怀疑深度与 provider 开关，别先怪模型。</text>
<rect x="96" y="300" width="560" height="420" rx="14" class="soft"/>
<text x="128" y="360" class="ink" font-size="28">会话里一直看见</text>
<rect x="128" y="400" width="496" height="120" rx="10" class="card"/>
<text x="160" y="450" class="mono" font-size="24">SKILL.md · description</text>
<text x="160" y="495" class="muted" font-size="20">场景说得清，才会被检索到</text>
<text x="128" y="560" class="muted" font-size="20">也可直接：</text>
<rect x="128" y="590" width="496" height="70" rx="8" fill="#DB582C"/>
<text x="160" y="635" class="white mono" font-size="24">/skill:hello</text>
<path d="M700 510 H800" class="flow"/>
<rect x="820" y="300" width="540" height="420" rx="14" class="hi"/>
<text x="860" y="360" class="ink" font-size="28">用到再取正文</text>
<rect x="860" y="420" width="460" height="100" rx="10" class="card"/>
<text x="890" y="480" class="mono" font-size="26">skill://hello</text>
<text x="860" y="580" class="muted" font-size="22">非递归发现</text>
<text x="860" y="630" class="muted" font-size="20">两层深目录 → 预期消失</text>
<text x="860" y="680" class="muted" font-size="20">.omp/skills/&lt;name&gt;/SKILL.md</text>

<path d="M72 858 H1368" stroke="#CFD0C4"/>
<text x="72" y="907" class="muted" font-size="20">对应正文第 19 章 · Skills</text>
<text x="1100" y="907" class="muted" font-size="18">OMP / 技能</text>
</svg>
