<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
<title id="title">不同角色，插不同模型。</title><desc id="desc">default / smol / slow / vision / advisor 等角色插座表。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#DB582C" stroke-width="1.5"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}.ink{fill:#252923}.muted{fill:#72786C}.accent{fill:#DB582C}.mono{font-family:Consolas,"Liberation Mono",monospace;fill:#252923}.white{fill:#FFFDF7}.line{fill:none;stroke:#252923;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.flow{fill:none;stroke:#DB582C;stroke-width:3;stroke-linecap:round;marker-end:url(#arrow)}.soft{fill:#F0EEE4;stroke:#D6D7C9}.card{fill:#FFFDF7;stroke:#ABB19F;stroke-width:1.5}.hi{fill:#E3EAD9;stroke:#ABB19F;stroke-width:1.5}.warn{fill:#F7E6DC;stroke:#DB582C;stroke-width:1.5}</style>
<rect width="1440" height="960" fill="#FAF7EF"/>
<path d="M72 80 H112" stroke="#DB582C" stroke-width="5" stroke-linecap="round"/>
<text x="132" y="88" class="muted" font-size="20">模型角色</text>

<text x="72" y="171" class="ink" font-size="52">不同角色，插不同模型。</text>
<text x="74" y="219" class="muted" font-size="24">小活别占满席；硬推理再上 slow / default。</text>
<rect x="96" y="300" width="280" height="200" rx="14" class="soft"/>
<text x="120" y="360" class="ink" font-size="26">default</text>
<text x="120" y="410" class="muted" font-size="20">主对话</text>
<text x="120" y="455" class="accent" font-size="18">插座 · 主模型</text>
<rect x="400" y="300" width="280" height="200" rx="14" class="hi"/>
<text x="424" y="360" class="ink" font-size="26">smol / tiny</text>
<text x="424" y="410" class="muted" font-size="20">短、便宜、结构化</text>
<text x="424" y="455" class="accent" font-size="18">插座 · 小活</text>
<rect x="704" y="300" width="280" height="200" rx="14" class="soft"/>
<text x="728" y="360" class="ink" font-size="26">slow</text>
<text x="728" y="410" class="muted" font-size="20">肯花时间的硬推理</text>
<text x="728" y="455" class="accent" font-size="18">插座 · 深想</text>
<rect x="1008" y="300" width="340" height="200" rx="14" class="soft"/>
<text x="1032" y="360" class="ink" font-size="26">vision</text>
<text x="1032" y="410" class="muted" font-size="20">看图</text>
<text x="1032" y="455" class="accent" font-size="18">插座 · 视觉</text>
<rect x="96" y="540" width="400" height="180" rx="14" class="warn"/>
<text x="120" y="600" class="ink" font-size="26">advisor</text>
<text x="120" y="650" class="muted" font-size="20">第二模型监督 · 高风险再开</text>
<text x="120" y="690" class="muted" font-size="18">配置入口：modelRoles</text>
<rect x="540" y="540" width="800" height="180" rx="14" class="soft"/>
<text x="580" y="600" class="ink" font-size="24">覆盖层提醒</text>
<text x="580" y="655" class="mono" font-size="20">PI_SMOL_MODEL / --smol=… 压过文件里的值</text>
<text x="580" y="700" class="muted" font-size="18">角色名拼写以本机 omp config get modelRoles 为准</text>

<path d="M72 858 H1368" stroke="#CFD0C4"/>
<text x="72" y="907" class="muted" font-size="20">对应正文第 17 章 · 模型角色路由</text>
<text x="1100" y="907" class="muted" font-size="18">OMP / 角色</text>
</svg>
