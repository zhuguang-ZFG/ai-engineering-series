<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="t">
  <title id="t">Agent 的核心循环：感知、决策、行动、观察转成一圈，循环持续进行直到任务完成</title>
  <rect width="1200" height="740" fill="#fbfaf6"/>
  <defs>
    <filter id="card-shadow" x="-8%" y="-8%" width="116%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1f2328" flood-opacity="0.10"/>
    </filter>
  </defs>

  <text x="72" y="80" fill="#1f2328" font-family="'Microsoft YaHei', system-ui, sans-serif" font-size="34" font-weight="700">Agent 的核心循环</text>
  <text x="72" y="120" fill="#57606a" font-family="'Microsoft YaHei', system-ui, sans-serif" font-size="22">从「能说」到「能做」：LLM 生成调用指令，外部系统替它动手</text>
  <path d="M72 142q42 6 84 0t84 0" fill="none" stroke="#1f883d" stroke-width="5" stroke-linecap="round" opacity="0.85"/>

  <g stroke="#1f2328" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M190 188v26"/>
  </g>
  <path d="M190 228l-8-14h16z" fill="#1f2328"/>
  <text x="210" y="210" fill="#57606a" font-family="'Microsoft YaHei', system-ui, sans-serif" font-size="19">输入：用户目标 + 当前状态 + 可用工具列表</text>

  <g font-family="'Microsoft YaHei', system-ui, sans-serif">
    <g>
      <rect x="72" y="230" width="246" height="200" rx="18" fill="#fffdf8" stroke="#1f2328" stroke-width="4" filter="url(#card-shadow)"/>
      <circle cx="102" cy="258" r="18" fill="#1f883d"/>
      <text x="102" y="266" fill="#fffdf8" font-size="20" text-anchor="middle" font-weight="700">1</text>
      <text x="130" y="266" fill="#1f2328" font-size="24" font-weight="700">感知</text>
      <g stroke="#57606a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <rect x="238" y="246" width="38" height="26" rx="5"/><path d="M238 258h38"/><path d="M250 251h6"/>
      </g>
      <text x="90" y="302" fill="#1f883d" font-size="19" font-weight="700">Memory 三层记忆</text>
      <text x="90" y="332" fill="#57606a" font-size="19">短期记忆 · 工作记忆</text>
      <text x="90" y="358" fill="#57606a" font-size="19">长期记忆（持久化）</text>
      <text x="90" y="384" fill="#57606a" font-size="19">避免重复与跑偏</text>
    </g>
    <g>
      <rect x="342" y="230" width="246" height="200" rx="18" fill="#fffdf8" stroke="#1f2328" stroke-width="4" filter="url(#card-shadow)"/>
      <circle cx="372" cy="258" r="18" fill="#1f883d"/>
      <text x="372" y="266" fill="#fffdf8" font-size="20" text-anchor="middle" font-weight="700">2</text>
      <text x="400" y="266" fill="#1f2328" font-size="24" font-weight="700">决策</text>
      <g stroke="#57606a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M514 250h30"/><path d="M514 260h30"/><path d="M514 270h20"/>
        <circle cx="506" cy="250" r="2.5"/><circle cx="506" cy="260" r="2.5"/><circle cx="506" cy="270" r="2.5"/>
      </g>
      <text x="360" y="302" fill="#1f883d" font-size="19" font-weight="700">Planning 规划</text>
      <text x="360" y="332" fill="#57606a" font-size="19">理解目标 → 任务分解</text>
      <text x="360" y="358" fill="#57606a" font-size="19">步骤执行 → 动态调整</text>
      <text x="360" y="384" fill="#57606a" font-size="19">步骤清单 + 停止条件</text>
    </g>
    <g>
      <rect x="612" y="230" width="246" height="200" rx="18" fill="#fffdf8" stroke="#1f2328" stroke-width="4" filter="url(#card-shadow)"/>
      <circle cx="642" cy="258" r="18" fill="#1f883d"/>
      <text x="642" y="266" fill="#fffdf8" font-size="20" text-anchor="middle" font-weight="700">3</text>
      <text x="670" y="266" fill="#1f2328" font-size="24" font-weight="700">行动</text>
      <g stroke="#57606a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <circle cx="800" cy="258" r="11"/>
        <path d="M800 247v-5m0 23v-5m11-11h5m-23 0h5m7.5-7.5l3.5-3.5m0 17l3.5 3.5m-17-3.5l-3.5 3.5m0-17l-3.5-3.5"/>
      </g>
      <text x="630" y="302" fill="#1f883d" font-size="19" font-weight="700">Tool Calling</text>
      <text x="630" y="332" fill="#57606a" font-size="19">不直接执行操作</text>
      <text x="630" y="358" fill="#57606a" font-size="19">生成「调用指令」</text>
      <text x="630" y="384" fill="#57606a" font-size="19">由外部系统执行</text>
    </g>
    <g>
      <rect x="882" y="230" width="246" height="200" rx="18" fill="#fffdf8" stroke="#1f2328" stroke-width="4" filter="url(#card-shadow)"/>
      <circle cx="912" cy="258" r="18" fill="#1f883d"/>
      <text x="912" y="266" fill="#fffdf8" font-size="20" text-anchor="middle" font-weight="700">4</text>
      <text x="940" y="266" fill="#1f2328" font-size="24" font-weight="700">观察</text>
      <g stroke="#57606a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M1070 246h34a6 6 0 0 1 6 6v14a6 6 0 0 1-6 6h-22l-10 8v-8h-2a6 6 0 0 1-6-6v-14a6 6 0 0 1 6-6z"/>
        <path d="M1078 258h18"/>
      </g>
      <text x="900" y="302" fill="#1f883d" font-size="19" font-weight="700">Tools 执行结果</text>
      <text x="900" y="332" fill="#57606a" font-size="19">写回记忆</text>
      <text x="900" y="358" fill="#57606a" font-size="19">对照停止条件</text>
      <text x="900" y="384" fill="#57606a" font-size="19">输出最终回答</text>
    </g>
  </g>

  <g stroke="#1f2328" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M318 330h24"/><path d="M588 330h24"/><path d="M858 330h24"/>
  </g>
  <g fill="#1f2328">
    <path d="M342 330l-15-8v16z"/><path d="M612 330l-15-8v16z"/><path d="M882 330l-15-8v16z"/>
  </g>

  <g stroke="#1f883d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M1005 430v40c0 22-18 40-40 40H230c-22 0-40-18-40-40v-24"/>
  </g>
  <path d="M190 432l-8 14h16z" fill="#1f883d"/>
  <text x="600" y="482" fill="#1f883d" font-family="'Microsoft YaHei', system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="middle">循环会持续进行，直到任务完成</text>
  <text x="600" y="548" fill="#57606a" font-family="'Microsoft YaHei', system-ui, sans-serif" font-size="21" text-anchor="middle">根据中间结果动态调整：没到停止条件，就再转一圈</text>

  <rect x="72" y="576" width="1056" height="68" rx="18" fill="#f1f7f2" stroke="#1f883d" stroke-width="3" filter="url(#card-shadow)"/>
  <text x="600" y="618" fill="#1f2328" font-family="'Microsoft YaHei', system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Tool Calling 的本质：LLM 不直接执行操作，而是生成结构化文本，告诉外部系统该做什么</text>

  <text x="72" y="676" fill="#57606a" font-family="'Microsoft YaHei', system-ui, sans-serif" font-size="21">Guardrails（护栏）压住跑偏：权限白名单 · 预算上限 · 敏感操作二次确认 · 沙箱环境执行</text>
  <text x="72" y="712" fill="#57606a" font-family="'Microsoft YaHei', system-ui, sans-serif" font-size="21">循环转到「自主迭代」，Agent 才能主动反思和改进。</text>
</svg>
