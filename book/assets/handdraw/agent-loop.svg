<svg xmlns="http://www.w3.org/2000/svg" width="480" height="680" viewBox="0 0 480 680" role="img" aria-labelledby="title desc">
  <title id="title">工具请求与执行回执</title>
  <desc id="desc">先提出请求，再由程序校验和执行，回传数值后结束；失败或取消进入终态。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#1f2328" stroke-width="1.5"/></marker></defs>
  <rect width="480" height="680" fill="#fbfaf6"/>
  <g font-family="'Microsoft YaHei',sans-serif" fill="#1f2328">
    <text x="24" y="40" font-size="28">说要计算，到真的计算</text>
    <path d="M36 70 L448 71 Q452 72 452 78 L451 132 Q450 136 444 136 L32 135 Q28 134 28 128 L29 76 Q30 70 36 70 Z" fill="#fbfaf6" stroke="#1f2328" stroke-width="2.5"/>
    <text x="48" y="113" font-size="26">请求：12.5 × 8</text>
    <path d="M240 146 Q238 158 240 170" fill="none" stroke="#1f2328" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M36 182 L448 183 Q452 184 452 190 L451 254 Q450 258 444 258 L32 257 Q28 256 28 250 L29 188 Q30 182 36 182 Z" fill="#d3efd9" stroke="#1f2328" stroke-width="2.5"/>
    <text x="48" y="225" font-size="26">程序校验：工具、类型、范围</text>
    <path d="M240 268 Q238 280 240 292" fill="none" stroke="#1f2328" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M36 304 L448 305 Q452 306 452 312 L451 366 Q450 370 444 370 L32 369 Q28 368 28 362 L29 310 Q30 304 36 304 Z" fill="#fbfaf6" stroke="#1f2328" stroke-width="2.5"/>
    <text x="48" y="347" font-size="26">本地执行 → 数值 100</text>
    <path d="M240 380 Q238 392 240 404" fill="none" stroke="#1f2328" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M36 416 L448 417 Q452 418 452 424 L451 478 Q450 482 444 482 L32 481 Q28 480 28 474 L29 422 Q30 416 36 416 Z" fill="#d3efd9" stroke="#1f2328" stroke-width="2.5"/>
    <text x="48" y="459" font-size="26">回传结果 → 才能汇报完成</text>
    <g pointer-events="none"><rect x="24" y="66" width="432" height="74" rx="10" fill="none" stroke="#1f883d" stroke-width="4" opacity="0"><animate attributeName="opacity" values="0;0.85;0.85;0" keyTimes="0;0.12;0.8;1" dur="10.4s" begin="0.00s" repeatCount="indefinite"/></rect><rect x="24" y="178" width="432" height="84" rx="10" fill="none" stroke="#1f883d" stroke-width="4" opacity="0"><animate attributeName="opacity" values="0;0.85;0.85;0" keyTimes="0;0.12;0.8;1" dur="10.4s" begin="2.60s" repeatCount="indefinite"/></rect><rect x="24" y="300" width="432" height="74" rx="10" fill="none" stroke="#1f883d" stroke-width="4" opacity="0"><animate attributeName="opacity" values="0;0.85;0.85;0" keyTimes="0;0.12;0.8;1" dur="10.4s" begin="5.20s" repeatCount="indefinite"/></rect><rect x="24" y="412" width="432" height="74" rx="10" fill="none" stroke="#1f883d" stroke-width="4" opacity="0"><animate attributeName="opacity" values="0;0.85;0.85;0" keyTimes="0;0.12;0.8;1" dur="10.4s" begin="7.80s" repeatCount="indefinite"/></rect></g>
    <path d="M28 532 Q240 530 452 532" fill="none" stroke="#1f2328" stroke-width="2" stroke-dasharray="7 6"/>
    <text x="28" y="577" font-size="26">失败 / 超时 / 取消 → 停止</text>
    <text x="28" y="619" font-size="26">终态不继续，不显示成功</text>
    <text x="28" y="661" font-size="26">本图请求预置，不是模型实测</text>
  </g>
</svg>
