<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="t">
  <title id="t">浏览器渲染管道：HTML 和 CSS 并行解析，汇合成渲染树后经三步到屏幕</title>
  <rect width="1200" height="580" fill="#fbfaf6"/>
  <defs>
    <filter id="card-shadow" x="-8%" y="-8%" width="116%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1f2328" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- 标题区 -->
  <text x="72" y="80" fill="#1f2328" font-family="'Microsoft YaHei', system-ui, sans-serif" font-size="34" font-weight="700">浏览器渲染管道</text>
  <text x="72" y="120" fill="#57606a" font-family="'Microsoft YaHei', system-ui, sans-serif" font-size="22">HTML 和 CSS 分开解析，合并成渲染树后经过三步才出现在屏幕上</text>
  <path d="M72 142q42 6 84 0t84 0" fill="none" stroke="#1f883d" stroke-width="5" stroke-linecap="round" opacity="0.85"/>

  <!-- 上支：HTML → 构建 DOM 树 -->
  <rect x="72" y="175" width="130" height="88" rx="18" fill="#fffdf8" stroke="#1f2328" stroke-width="4" filter="url(#card-shadow)"/>
  <text x="137" y="214" fill="#1f2328" font-family="'Microsoft YaHei', system-ui, sans-serif" font-size="22" text-anchor="middle" font-weight="700">HTML</text>
  <text x="137" y="242" fill="#57606a" font-family="'Microsoft YaHei', system-ui, sans-serif" font-size="19" text-anchor="middle">标签内容</text>

  <g fill="none" stroke="#1f2328" stroke-width="4" stroke-linecap="round">
    <path d="M202 219 h28"/>
  </g>
  <path d="M230 219l-15-8v16z" fill="#1f2328"/>

  <rect x="232" y="175" width="210" height="88" rx="18" fill="#fffdf8" stroke="#1f2328" stroke-width="4" filter="url(#card-shadow)"/>
  <text x="337" y="214" fill="#1f2328" font-family="'Microsoft YaHei', system-ui, sans-serif" font-size="22" text-anchor="middle">构建 DOM 树</text>
  <text x="337" y="242" fill="#57606a" font-family="'Microsoft YaHei', system-ui, sans-serif" font-size="19" text-anchor="middle">解析成树形节点</text>

  <!-- 下支：CSS → 构建 CSSOM 树 -->
  <rect x="72" y="305" width="130" height="88" rx="18" fill="#fffdf8" stroke="#1f2328" stroke-width="4" filter="url(#card-shadow)"/>
  <text x="137" y="344" fill="#1f2328" font-family="'Microsoft YaHei', system-ui, sans-serif" font-size="22" text-anchor="middle" font-weight="700">CSS</text>
  <text x="137" y="372" fill="#57606a" font-family="'Microsoft YaHei', system-ui, sans-serif" font-size="19" text-anchor="middle">样式规则</text>

  <g fill="none" stroke="#1f2328" stroke-width="4" stroke-linecap="round">
    <path d="M202 349 h28"/>
  </g>
  <path d="M230 349l-15-8v16z" fill="#1f2328"/>

  <rect x="232" y="305" width="210" height="88" rx="18" fill="#fffdf8" stroke="#1f2328" stroke-width="4" filter="url(#card-shadow)"/>
  <text x="337" y="344" fill="#1f2328" font-family="'Microsoft YaHei', system-ui, sans-serif" font-size="20" text-anchor="middle">构建 CSSOM 树</text>
  <text x="337" y="372" fill="#57606a" font-family="'Microsoft YaHei', system-ui, sans-serif" font-size="19" text-anchor="middle">解析成规则树</text>

  <!-- 汇合箭头：DOM / CSSOM → 渲染树 -->
  <g fill="none" stroke="#1f2328" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M442 219 v55 h42"/>
    <path d="M442 349 v-60 h42"/>
  </g>
  <path d="M484 274l-15-8v16z" fill="#1f2328"/>
  <path d="M484 289l-15-8v16z" fill="#1f2328"/>

  <!-- 渲染树（汇合节点） -->
  <rect x="484" y="238" width="162" height="88" rx="18" fill="#f1f7f2" stroke="#1f883d" stroke-width="3" filter="url(#card-shadow)"/>
  <text x="565" y="275" fill="#1f2328" font-family="'Microsoft YaHei', system-ui, sans-serif" font-size="22" text-anchor="middle" font-weight="700">渲染树</text>
  <text x="565" y="303" fill="#57606a" font-family="'Microsoft YaHei', system-ui, sans-serif" font-size="19" text-anchor="middle">只保留可见元素</text>

  <!-- 主干：渲染树 → 布局 → 绘制 → 合成 -->
  <g fill="none" stroke="#1f2328" stroke-width="4" stroke-linecap="round">
    <path d="M646 282 h24"/>
    <path d="M780 282 h22"/>
    <path d="M914 282 h22"/>
  </g>
  <g fill="#1f2328">
    <path d="M672 282l-15-8v16z"/>
    <path d="M802 282l-15-8v16z"/>
    <path d="M936 282l-15-8v16z"/>
  </g>

  <!-- 布局 -->
  <rect x="672" y="238" width="110" height="88" rx="18" fill="#fffdf8" stroke="#1f2328" stroke-width="4" filter="url(#card-shadow)"/>
  <text x="727" y="275" fill="#1f2328" font-family="'Microsoft YaHei', system-ui, sans-serif" font-size="22" text-anchor="middle">布局</text>
  <text x="727" y="303" fill="#57606a" font-family="'Microsoft YaHei', system-ui, sans-serif" font-size="19" text-anchor="middle">Reflow</text>

  <!-- 绘制 -->
  <rect x="802" y="238" width="112" height="88" rx="18" fill="#fffdf8" stroke="#1f2328" stroke-width="4" filter="url(#card-shadow)"/>
  <text x="858" y="275" fill="#1f2328" font-family="'Microsoft YaHei', system-ui, sans-serif" font-size="22" text-anchor="middle">绘制</text>
  <text x="858" y="303" fill="#57606a" font-family="'Microsoft YaHei', system-ui, sans-serif" font-size="19" text-anchor="middle">Repaint</text>

  <!-- 合成 -->
  <rect x="936" y="238" width="112" height="88" rx="18" fill="#fffdf8" stroke="#1f2328" stroke-width="4" filter="url(#card-shadow)"/>
  <text x="992" y="275" fill="#1f2328" font-family="'Microsoft YaHei', system-ui, sans-serif" font-size="22" text-anchor="middle">合成</text>
  <text x="992" y="303" fill="#57606a" font-family="'Microsoft YaHei', system-ui, sans-serif" font-size="19" text-anchor="middle">Composite</text>

  <!-- GPU 加速旁路：transform/opacity 跳过布局绘制，直接触发合成 -->
  <g stroke="#1f883d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M727 326 v42 c0 14 -12 26 26 26 h213 c14 0 26-12 26-26 v-42"/>
  </g>
  <path d="M992 326l-8 14h16z" fill="#1f883d"/>
  <text x="860" y="422" fill="#008635" font-family="'Microsoft YaHei', system-ui, sans-serif" font-size="21" text-anchor="middle">transform / opacity → 直接触发合成</text>

  <!-- 性能口诀框 -->
  <rect x="72" y="452" width="1056" height="66" rx="18" fill="#f1f7f2" stroke="#1f883d" stroke-width="3"/>
  <text x="600" y="492" fill="#1f2328" font-family="'Microsoft YaHei', system-ui, sans-serif" font-size="23" text-anchor="middle" font-weight="700">重排最昂贵（几何变化），重绘次之（外观变化）</text>

  <!-- 因果说明 -->
  <text x="72" y="550" fill="#57606a" font-family="'Microsoft YaHei', system-ui, sans-serif" font-size="21">布局改变会导致绘制，绘制改变不会导致布局。</text>
</svg>
