<svg xmlns="http://www.w3.org/2000/svg" width="480" height="640" viewBox="0 0 480 640" role="img" aria-labelledby="title desc"><title id="title">三种练习，教三件事</title><desc id="desc">续写卷保留下一片段目标，示范卷展示问地点却缺材料时回答未知，偏好卷比较有据与编造两份答案。角色模板另负责输入格式。</desc><rect width="480" height="640" fill="#fbfaf6"/><g font-family="Microsoft YaHei,Noto Sans SC,sans-serif"><text x="27" y="48" font-size="30" fill="#1f2328" text-anchor="start">三种练习，教三件事</text><path d="M28 67 Q232 61 451 66" stroke="#1f883d" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="42" cy="117" r="19" fill="#d3efd9" stroke="#1f2328" stroke-width="2.7"/><text x="42" y="126" font-size="25" fill="#1f2328" text-anchor="middle">1</text><text x="79" y="126" font-size="27" fill="#1f2328" text-anchor="start">续写：后面接什么</text><path d="M75 148 L418 146 L440 168 L438 232 L77 231Z M418 146 L418 169 L440 168" stroke="#1f2328" stroke-width="2.5" fill="#fffdf8" stroke-linecap="round" stroke-linejoin="round"/><text x="95" y="186" font-size="28" fill="#1f2328" text-anchor="start">周六 14 时……</text><path d="M93 212 L247 212" stroke="#57606a" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="321" y="216" font-size="24" fill="#1f2328" text-anchor="start">目标</text><circle cx="42" cy="286" r="19" fill="#d3efd9" stroke="#1f2328" stroke-width="2.7"/><text x="42" y="295" font-size="25" fill="#1f2328" text-anchor="middle">2</text><text x="79" y="295" font-size="27" fill="#1f2328" text-anchor="start">示范：怎样回答</text><path d="M77 318 L438 318 L438 395 L126 395 L104 411 L105 395 L77 395Z" stroke="#1f2328" stroke-width="2.5" fill="#d3efd9" stroke-linecap="round" stroke-linejoin="round"/><text x="95" y="351" font-size="26" fill="#1f2328" text-anchor="start">问地点 → 地点未知</text><text x="95" y="384" font-size="24" fill="#1f2328" text-anchor="start">照着合适的回答学</text><circle cx="42" cy="458" r="19" fill="#d3efd9" stroke="#1f2328" stroke-width="2.7"/><text x="42" y="467" font-size="25" fill="#1f2328" text-anchor="middle">3</text><text x="79" y="467" font-size="27" fill="#1f2328" text-anchor="start">偏好：两份选哪份</text><path d="M134 526 L375 526 M255 494 L255 554 M230 554 L280 554" stroke="#1f2328" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="151" cy="526" r="28" fill="#d3efd9" stroke="#1f2328" stroke-width="2.7"/><path d="M137 529 l9 10 l20 -26" stroke="#1f883d" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="357" cy="526" r="28" fill="#fbfaf6" stroke="#1f2328" stroke-width="2.7"/><path d="M346 515 l22 22 M346 537 l22 -22" stroke="#e2601f" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M28 572 L451 572" stroke="#e6e1d4" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="28" y="591" font-size="24" fill="#57606a" text-anchor="start">三类信号改变不同的行为倾向。</text><text x="28" y="627" font-size="24" fill="#57606a" text-anchor="start">聊天角色模板负责组织消息。</text></g></svg>
