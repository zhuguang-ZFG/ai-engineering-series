<svg xmlns="http://www.w3.org/2000/svg" width="480" height="640" viewBox="0 0 480 640" role="img" aria-labelledby="title desc"><title id="title">保存着，不等于看见了</title><desc id="desc">历史、摘要和外部记录经过选择漏斗进入本次输入；教学假设总预算4096，预留回答512与任务格式400后材料预算3184。</desc><rect width="480" height="640" fill="#fbfaf6"/><g font-family="Microsoft YaHei,Noto Sans SC,sans-serif"><text x="27" y="48" font-size="30" fill="#1f2328" text-anchor="start">保存着，不等于看见了</text><path d="M28 67 Q232 61 451 66" stroke="#1f883d" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M30 108 L129 106 L151 128 L149 216 L32 215Z M129 106 L129 129 L151 128" stroke="#1f2328" stroke-width="2.5" fill="#fffdf8" stroke-linecap="round" stroke-linejoin="round"/><text x="90" y="166" font-size="25" fill="#1f2328" text-anchor="middle">历史</text><path d="M181 108 L280 106 L302 128 L300 216 L183 215Z M280 106 L280 129 L302 128" stroke="#1f2328" stroke-width="2.5" fill="#d3efd9" stroke-linecap="round" stroke-linejoin="round"/><text x="241" y="166" font-size="25" fill="#1f2328" text-anchor="middle">摘要</text><path d="M332 108 L431 106 L453 128 L451 216 L334 215Z M431 106 L431 129 L453 128" stroke="#1f2328" stroke-width="2.5" fill="#fffdf8" stroke-linecap="round" stroke-linejoin="round"/><text x="392" y="166" font-size="25" fill="#1f2328" text-anchor="middle">外部记录</text><path d="M90 230 Q141.5 255.5 187 287" stroke="#1f883d" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M176.0019287112951 287.2059804082066 L187 287 L181.8277462644593 277.29186983527796" stroke="#1f883d" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M241 230 Q244 255.5 241 287" stroke="#1f883d" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M235.25044048176275 277.62223025734545 L241 287 L246.74955951823725 277.62223025734545" stroke="#1f883d" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M392 230 Q346.5 255.5 295 287" stroke="#1f883d" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M300.17225373554066 277.29186983527796 L295 287 L305.9980712887049 287.2059804082066" stroke="#1f883d" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M152 302 L329 302 L281 359 L281 390 L201 390 L201 359Z" stroke="#1f2328" stroke-width="3" fill="#d3efd9" stroke-linecap="round" stroke-linejoin="round"/><text x="240" y="339" font-size="29" fill="#1f2328" text-anchor="middle">选择</text><path d="M240 405 Q243 418.5 240 438" stroke="#1f883d" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M234.25044048176275 428.62223025734545 L240 438 L245.74955951823725 428.62223025734545" stroke="#1f883d" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M33 455 Q240 452 450 457 L448 546 Q240 549 30 544Z" stroke="#1f2328" stroke-width="2.5" fill="#fffdf8" stroke-linecap="round" stroke-linejoin="round"/><text x="240" y="492" font-size="28" fill="#1f2328" text-anchor="middle">本次实际送入的内容</text><text x="240" y="531" font-size="25" fill="#1f2328" text-anchor="middle">4096 − 512 − 400 = 3184</text><path d="M28 572 L451 572" stroke="#e6e1d4" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="28" y="591" font-size="24" fill="#57606a" text-anchor="start">外部记录要被选入，才参与这次。</text><text x="28" y="627" font-size="24" fill="#57606a" text-anchor="start">3184 是本题假设的材料预算。</text></g></svg>
