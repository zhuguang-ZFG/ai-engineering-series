<svg xmlns="http://www.w3.org/2000/svg" width="480" height="640" viewBox="0 0 480 640" role="img" aria-labelledby="title desc"><title id="title">两张通知，不能硬拼</title><desc id="desc">通知A写周六14时，通知C写周日14时，双向箭头表示冲突；下方空白地点保持未知，需要另找地点依据。</desc><rect width="480" height="640" fill="#fbfaf6"/><g font-family="Microsoft YaHei,Noto Sans SC,sans-serif"><text x="27" y="48" font-size="30" fill="#1f2328" text-anchor="start">两张通知，不能硬拼</text><path d="M28 67 Q232 61 451 66" stroke="#1f883d" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M29 113 L203 111 L225 133 L223 309 L31 308Z M203 111 L203 134 L225 133" stroke="#1f2328" stroke-width="2.5" fill="#fffdf8" stroke-linecap="round" stroke-linejoin="round"/><text x="126" y="156" font-size="27" fill="#1f2328" text-anchor="middle">通知 A</text><text x="126" y="204" font-size="33" fill="#1f2328" text-anchor="middle">周六</text><text x="126" y="253" font-size="30" fill="#1f2328" text-anchor="middle">14:00</text><path d="M254 113 L428 111 L450 133 L448 309 L256 308Z M428 111 L428 134 L450 133" stroke="#1f2328" stroke-width="2.5" fill="#d3efd9" stroke-linecap="round" stroke-linejoin="round"/><text x="352" y="156" font-size="27" fill="#1f2328" text-anchor="middle">通知 C</text><text x="352" y="204" font-size="33" fill="#1f2328" text-anchor="middle">周日</text><text x="352" y="253" font-size="30" fill="#1f2328" text-anchor="middle">14:00</text><path d="M206 339 Q245 336 278 339" stroke="#e2601f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M268.62223025734545 344.7495595182373 L278 339 L268.62223025734545 333.2504404817627" stroke="#e2601f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M276 355 Q244 352 206 355" stroke="#e2601f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M215.37776974265455 349.2504404817627 L206 355 L215.37776974265455 360.7495595182372" stroke="#e2601f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="240" y="397" font-size="25" fill="#1f2328" text-anchor="middle">时间冲突 → 确认有效版本</text><path d="M35 445 L445 445 L445 542 L35 542Z" stroke="#57606a" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5"/><text x="61" y="484" font-size="27" fill="#1f2328" text-anchor="start">地点没有写</text><text x="61" y="524" font-size="27" fill="#1f2328" text-anchor="start">就保留“未知”</text><circle cx="386" cy="494" r="29" fill="#fffdf8" stroke="#1f2328" stroke-width="2.7"/><text x="386" y="505" font-size="34" fill="#1f2328" text-anchor="middle">?</text><path d="M28 572 L451 572" stroke="#e6e1d4" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="28" y="591" font-size="24" fill="#57606a" text-anchor="start">“修订”二字不能自动证明有效。</text><text x="28" y="627" font-size="24" fill="#57606a" text-anchor="start">缺失与冲突要分别写清。</text></g></svg>
