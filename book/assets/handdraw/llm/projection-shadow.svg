<svg xmlns="http://www.w3.org/2000/svg" width="480" height="640" viewBox="0 0 480 640" role="img" aria-labelledby="title desc"><title id="title">影子重合，原物不同</title><desc id="desc">三维中的两点x和y相同而z分别为0.95和0.1，沿z方向投到平面后重合；二维重合不能推出原向量相同。</desc><rect width="480" height="640" fill="#fbfaf6"/><g font-family="Microsoft YaHei,Noto Sans SC,sans-serif"><text x="27" y="48" font-size="30" fill="#1f2328" text-anchor="start">影子重合，原物不同</text><path d="M28 67 Q232 61 451 66" stroke="#1f883d" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M68 349 L68 132 M68 349 L411 350 M68 349 L184 249" stroke="#1f2328" stroke-width="2.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="48" y="122" font-size="26" fill="#1f2328" text-anchor="start">z</text><text x="423" y="358" font-size="26" fill="#1f2328" text-anchor="start">x</text><text x="188" y="247" font-size="26" fill="#1f2328" text-anchor="start">y</text><path d="M297 172 L297 327" stroke="#57606a" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7"/><circle cx="297" cy="172" r="13" fill="#d3efd9" stroke="#1f2328" stroke-width="2.7"/><circle cx="297" cy="310" r="13" fill="#fffdf8" stroke="#1f2328" stroke-width="2.7"/><text x="29" y="405" font-size="27" fill="#1f2328" text-anchor="start">只看前两维</text><text x="29" y="451" font-size="27" fill="#1f2328" text-anchor="start">[.9, .1, .95]</text><text x="29" y="491" font-size="27" fill="#1f2328" text-anchor="start">[.9, .1, .1]</text><path d="M291 373 L412 373 L449 546 L256 546Z" stroke="#1f2328" stroke-width="2.5" fill="#e6e1d4" stroke-linecap="round" stroke-linejoin="round"/><path d="M347 384 Q350 422 347 466" stroke="#1f883d" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M341.2504404817627 456.62223025734545 L347 466 L352.7495595182373 456.62223025734545" stroke="#1f883d" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="347" cy="496" r="15" fill="#d3efd9" stroke="#1f2328" stroke-width="2.7"/><circle cx="347" cy="496" r="8" fill="#fffdf8" stroke="#1f2328" stroke-width="2.7"/><text x="347" y="537" font-size="24" fill="#1f2328" text-anchor="middle">二维投影</text><path d="M28 572 L451 572" stroke="#e6e1d4" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="28" y="591" font-size="24" fill="#57606a" text-anchor="start">二维图没画出的维度仍然存在。</text><text x="28" y="627" font-size="24" fill="#57606a" text-anchor="start">比较余弦时用完整向量。</text></g></svg>
