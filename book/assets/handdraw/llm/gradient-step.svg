<svg xmlns="http://www.w3.org/2000/svg" width="480" height="820" viewBox="0 0 480 820" role="img" aria-labelledby="title desc"><title id="title">一步训练，两个分数怎样动？</title><desc id="desc">人工两候选例子，初始水茶分数均零，目标是水，梯度为负零点五和正零点五，学习率零点四更新后分数为零点二和负零点二，水的概率上升而损失下降。</desc><rect width="480" height="820" fill="#fbfaf6"/><g font-family="Microsoft YaHei,sans-serif"><text x="28" y="48" font-size="30" fill="#1f2328">一步训练，两个分数怎样动？</text><path d="M28 66 Q238 61 448 65" fill="none" stroke="#1f883d" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><text x="30" y="111" font-size="26" fill="#1f2328">人工两候选 · 目标：水</text><path d="M28 139 Q239 133 450 136 L448 298 Q239 302 28 297Z" fill="#fffdf8" stroke="#1f2328" stroke-width="2.5"/><text x="49" y="177" font-size="26" fill="#1f2328">更新前：分数 [0, 0]</text><text x="49" y="222" font-size="26" fill="#1f2328">水  50.0%</text><text x="277" y="222" font-size="26" fill="#1f2328">茶  50.0%</text><path d="M52 254 L211 254 M279 254 L438 254" fill="none" stroke="#1f2328" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M52 254 L131 254 M279 254 L358 254" fill="none" stroke="#1f883d" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M240 309 Q237 330 240 351 M231 340 L240 351 L249 340" fill="none" stroke="#1f883d" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><text x="31" y="396" font-size="26" fill="#1f2328">梯度 = 预测概率 − 目标</text><text x="63" y="443" font-size="26" fill="#1f2328">水：−0.5     茶：+0.5</text><text x="40" y="490" font-size="26" fill="#1f2328">新分数 = 旧分数 − 0.4 × 梯度</text><path d="M240 510 Q237 527 240 544 M231 533 L240 544 L249 533" fill="none" stroke="#1f883d" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M28 561 Q239 555 450 558 L448 687 Q239 691 28 686Z" fill="#d3efd9" stroke="#1f2328" stroke-width="2.5"/><text x="49" y="603" font-size="26" fill="#1f2328">更新后：[0.2, −0.2]</text><text x="49" y="653" font-size="26" fill="#1f2328">水 59.9%     茶 40.1%</text><text x="31" y="735" font-size="26" fill="#1f2328">损失：0.693 → 0.513</text><text x="31" y="780" font-size="26" fill="#57606a">学得更像目标，不等于事实核验</text></g></svg>
