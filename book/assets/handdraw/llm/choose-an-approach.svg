<svg xmlns="http://www.w3.org/2000/svg" width="480" height="668" viewBox="0 0 480 668" role="img" aria-labelledby="title desc">
  <title id="title">按缺口选择方案</title>
  <desc id="desc">全文够用先明确任务；缺相关新资料用检索；缺确定计算用受控工具；稳定行为问题经评测再考虑微调。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#1f2328" stroke-width="1.5"/></marker></defs>
  <rect width="480" height="668" fill="#fbfaf6"/>
  <g font-family="'Microsoft YaHei',sans-serif" fill="#1f2328">
    <text x="24" y="40" font-size="28">先问：任务缺的是什么？</text>
    <path d="M36 76 L448 77 Q452 78 452 84 L451 174 Q450 178 444 178 L32 177 Q28 176 28 170 L29 82 Q30 76 36 76 Z" fill="#fbfaf6" stroke="#1f2328" stroke-width="2.5"/>
    <text x="48" y="113" font-size="26">一页材料，做一次</text>
    <text x="48" y="153" font-size="26">先写清任务与输出约定</text>
    <path d="M36 210 L448 211 Q452 212 452 218 L451 308 Q450 312 444 312 L32 311 Q28 310 28 304 L29 216 Q30 210 36 210 Z" fill="#d3efd9" stroke="#1f2328" stroke-width="2.5"/>
    <text x="48" y="247" font-size="26">缺不断更新的依据</text>
    <text x="48" y="287" font-size="26">检索 → 核对出处和版本</text>
    <path d="M36 344 L448 345 Q452 346 452 352 L451 442 Q450 446 444 446 L32 445 Q28 444 28 438 L29 350 Q30 344 36 344 Z" fill="#fbfaf6" stroke="#1f2328" stroke-width="2.5"/>
    <text x="48" y="381" font-size="26">缺可以复算的执行</text>
    <text x="48" y="421" font-size="26">受控工具 → 检查回执</text>
    <path d="M36 478 L448 479 Q452 480 452 486 L451 576 Q450 580 444 580 L32 579 Q28 578 28 572 L29 484 Q30 478 36 478 Z" fill="#fbfaf6" stroke="#1f2328" stroke-width="2.5"/>
    <text x="48" y="515" font-size="26">固定行为仍反复失败</text>
    <text x="48" y="555" font-size="26">有数据和评测，再考虑微调</text>
    <text x="28" y="638" font-size="26">可组合；先用任务样本检验</text>
  </g>
</svg>
