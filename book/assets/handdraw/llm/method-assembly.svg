<svg xmlns="http://www.w3.org/2000/svg" width="480" height="640" viewBox="0 0 480 640" role="img" aria-labelledby="title desc"><title id="title">四种办法，接在不同处</title><desc id="desc">提示词和RAG进入模型输入；微调从侧面改变参数；工具在模型提出请求后执行，并将回执返回模型。四种办法位置不同却可组合。</desc><rect width="480" height="640" fill="#fbfaf6"/><g font-family="Microsoft YaHei,Noto Sans SC,sans-serif"><text x="27" y="48" font-size="30" fill="#1f2328" text-anchor="start">四种办法，接在不同处</text><path d="M28 67 Q232 61 451 66" stroke="#1f883d" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M32 103 L176 101 L198 123 L196 205 L34 204Z M176 101 L176 124 L198 123" stroke="#1f2328" stroke-width="2.5" fill="#d3efd9" stroke-linecap="round" stroke-linejoin="round"/><text x="115" y="142" font-size="28" fill="#1f2328" text-anchor="middle">提示词</text><text x="115" y="181" font-size="25" fill="#1f2328" text-anchor="middle">写清任务</text><path d="M279 103 L425 101 L447 123 L445 205 L281 204Z M425 101 L425 124 L447 123" stroke="#1f2328" stroke-width="2.5" fill="#d3efd9" stroke-linecap="round" stroke-linejoin="round"/><text x="363" y="142" font-size="30" fill="#1f2328" text-anchor="middle">RAG</text><text x="363" y="181" font-size="25" fill="#1f2328" text-anchor="middle">找来资料</text><path d="M114 218 Q158 247 196 282" stroke="#1f883d" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M185.0698196950005 280.762600104978 L196 282 L192.14489250095286 271.6976630723515" stroke="#1f883d" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M363 218 Q327 247 285 282" stroke="#1f883d" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M288.60266295031425 271.6066935161887 L285 282 L295.896745174813 280.4963562272966" stroke="#1f883d" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M154 301 L325 301 L325 415 L154 415Z" stroke="#1f2328" stroke-width="3" fill="#fffdf8" stroke-linecap="round" stroke-linejoin="round"/><text x="240" y="346" font-size="29" fill="#1f2328" text-anchor="middle">模型计算</text><circle cx="201" cy="386" r="13" fill="#d3efd9" stroke="#1f2328" stroke-width="2.7"/><circle cx="240" cy="386" r="13" fill="#d3efd9" stroke="#1f2328" stroke-width="2.7"/><circle cx="279" cy="386" r="13" fill="#d3efd9" stroke="#1f2328" stroke-width="2.7"/><text x="29" y="305" font-size="25" fill="#1f2328" text-anchor="start">微调</text><text x="29" y="340" font-size="24" fill="#1f2328" text-anchor="start">改参数</text><path d="M109 353 Q130 361 145 375" stroke="#1f883d" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M134.00001157328086 375.01595656744814 L145 375 L139.99622730356288 365.203967190623" stroke="#1f883d" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M240 428 Q243 440 240 458" stroke="#1f883d" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M234.25044048176275 448.62223025734545 L240 458 L245.74955951823725 448.62223025734545" stroke="#1f883d" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M156 477 Q239 474 325 479 L323 552 Q239 555 153 550Z" stroke="#1f2328" stroke-width="2.5" fill="#d3efd9" stroke-linecap="round" stroke-linejoin="round"/><text x="240" y="524" font-size="29" fill="#1f2328" text-anchor="middle">工具执行</text><path d="M333 513 Q430 506 424 402 Q419 354 337 354" stroke="#1f883d" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M350 345 L337 354 L350 363" stroke="#1f883d" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="370" y="453" font-size="25" fill="#1f2328" text-anchor="start">回执</text><path d="M28 572 L451 572" stroke="#e6e1d4" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="28" y="591" font-size="24" fill="#57606a" text-anchor="start">输入、参数、外部动作是三处。</text><text x="28" y="627" font-size="24" fill="#57606a" text-anchor="start">组合使用，也各自负责一段。</text></g></svg>
