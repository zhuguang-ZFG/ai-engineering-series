  <rect x="72" y="540" width="40" height="26" rx="13" fill="#d3efd9"/>
  <text x="124" y="560" fill="#57606a" font-family="'Microsoft YaHei', system-ui, sans-serif" font-size="22">卡片底部这一格，就是那一步结束时你能拿给别人看的东西。</text>
  <text x="72" y="602" fill="#57606a" font-family="'Microsoft YaHei', system-ui, sans-serif" font-size="22">前四步把问题想清楚，后四步把东西做出来；走不完前四步，后四步只是在做没人要的东西。</text>
