      <circle cx="96" cy="402" r="17" fill="#008635"/><text x="96" y="409" fill="#fbfaf6" font-size="19" text-anchor="middle" font-weight="700">8</text>
      <text x="120" y="409" fill="#1f2328" font-size="22">打磨交付</text>
      <text x="88" y="446" fill="#57606a" font-size="19">发到公网</text>
      <rect x="80" y="460" width="148" height="30" rx="15" fill="#d3efd9"/>
      <text x="154" y="481" fill="#1f2328" font-size="19" text-anchor="middle">公网链接</text>
