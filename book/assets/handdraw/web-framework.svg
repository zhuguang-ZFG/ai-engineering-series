<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="t">
  <title id="t">Web 框架的本质：后端架构四次演进，物理服务器（1990s）→ 单体架构 + MVC（2000s）→ 微服务 + 容器化（2010s）→ Serverless + 云原生（2020s），每一代都被上一代的痛点逼出来</title>
  <rect width="1200" height="840" fill="#fbfaf6"/>
  <defs>
    <filter id="card-shadow" x="-8%" y="-8%" width="116%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1f2328" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- 标题区 -->
  <text x="72" y="80" fill="#1f2328" font-family="'Microsoft YaHei', system-ui, sans-serif" font-size="34" font-weight="700">Web 框架的本质：后端架构四次演进</text>
  <text x="72" y="120" fill="#57606a" font-family="'Microsoft YaHei', system-ui, sans-serif" font-size="22">每一次演进都不是追新潮，而是上一代有个问题解决不了</text>
  <path d="M72 142q42 6 84 0t84 0" fill="none" stroke="#1f883d" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
  <text x="1128" y="120" fill="#57606a" font-family="'Microsoft YaHei', system-ui, sans-serif" font-size="21" text-anchor="end">每一代都对应一个团队规模</text>

  <g font-family="'Microsoft YaHei', system-ui, sans-serif">
    <!-- 四张年代卡片，S 形路径：左上 → 右上 → 右下 → 左下 -->
    <g stroke="#1f2328" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="72" y="176" width="504" height="200" rx="20" fill="#fffdf8" filter="url(#card-shadow)"/>
      <rect x="624" y="176" width="504" height="200" rx="20" fill="#fffdf8" filter="url(#card-shadow)"/>
      <rect x="624" y="424" width="504" height="200" rx="20" fill="#fffdf8" filter="url(#card-shadow)"/>
      <rect x="72" y="424" width="504" height="200" rx="20" fill="#fffdf8" filter="url(#card-shadow)"/>
    </g>

    <!-- 序号 -->
    <g fill="#1f883d">
      <circle cx="104" cy="216" r="17"/><circle cx="656" cy="216" r="17"/><circle cx="656" cy="464" r="17"/><circle cx="104" cy="464" r="17"/>
    </g>
    <g fill="#fbfaf6" font-size="20" font-weight="700" text-anchor="middle">
      <text x="104" y="223">1</text><text x="656" y="223">2</text><text x="656" y="471">3</text><text x="104" y="471">4</text>
    </g>

    <!-- 架构名 -->
    <g fill="#1f2328" font-size="23" font-weight="700">
      <text x="130" y="224">物理服务器</text>
      <text x="682" y="224">单体架构 + MVC</text>
      <text x="682" y="472">微服务 + 容器化</text>
      <text x="130" y="472">Serverless + 云原生</text>
    </g>

    <!-- 年代 + 团队规模（marker 徽章） -->
    <g fill="#d3efd9" stroke="#1f883d" stroke-width="3">
      <rect x="366" y="196" width="194" height="38" rx="10"/>
      <rect x="918" y="196" width="194" height="38" rx="10"/>
      <rect x="918" y="444" width="194" height="38" rx="10"/>
      <rect x="366" y="444" width="194" height="38" rx="10"/>
    </g>
    <g fill="#1f2328" font-size="20" text-anchor="middle">
      <text x="463" y="222">1990s · 1-5人</text>
      <text x="1015" y="222">2000s · 5-50人</text>
      <text x="1015" y="470">2010s · 50-500人</text>
      <text x="463" y="470">2020s · 1-20人</text>
    </g>

    <!-- 核心问题 + 机制 -->
    <g fill="#57606a" font-size="20">
      <text x="92" y="276">核心问题：如何把网站跑起来</text>
      <text x="92" y="306">单机部署、手动运维、垂直扩展</text>
      <text x="644" y="276">核心问题：代码越来越乱怎么维护</text>
      <text x="644" y="306">单一代码库、共享数据库、统一部署</text>
      <text x="644" y="524">核心问题：系统太大怎么扩展和协作</text>
      <text x="644" y="554">拆成小服务：独立开发、独立部署</text>
      <text x="92" y="524">核心问题：降低运维成本和复杂性</text>
      <text x="92" y="554">写代码 → 上传 → 按使用量付费</text>
    </g>

    <!-- 逼出下一代的痛点（marker 扫过关键词，其下只放墨色字） -->
    <g fill="#d3efd9">
      <rect x="88" y="324" width="310" height="38" rx="8"/>
      <rect x="640" y="324" width="310" height="38" rx="8"/>
      <rect x="640" y="572" width="310" height="38" rx="8"/>
      <rect x="88" y="572" width="310" height="38" rx="8"/>
    </g>
    <g fill="#1f2328" font-size="20" text-anchor="middle">
      <text x="243" y="349">痛点：慢、贵、难扩展</text>
      <text x="795" y="349">痛点：雪崩效应，隔离性差</text>
      <text x="795" y="597">痛点：运维成本高，要 DevOps</text>
      <text x="243" y="597">缺点：冷启动、高频时成本反超</text>
    </g>

    <!-- 每代架构的形状：一台机器 / 一栋商场共用一个库 / 一排集装箱 / 一朵云 -->
    <g stroke="#1f2328" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- 1 物理服务器：一台机器，请求排成长队 -->
      <rect x="472" y="254" width="72" height="68" rx="10"/>
      <path d="M484 272h48M484 290h48M484 308h48"/>
      <rect x="428" y="262" width="20" height="14" rx="3"/>
      <rect x="428" y="282" width="20" height="14" rx="3"/>
      <rect x="428" y="302" width="20" height="14" rx="3"/>
      <path d="M452 289h6"/>
      <!-- 2 单体架构：一栋楼三个区，底下共用一个数据库 -->
      <rect x="984" y="256" width="128" height="60" rx="10"/>
      <path d="M1027 256v60M1070 256v60"/>
      <path d="M1048 316v10"/>
      <ellipse cx="1048" cy="334" rx="32" ry="9"/>
      <path d="M1016 334v14M1080 334v14"/>
      <path d="M1016 348a32 9 0 0 0 64 0"/>
      <!-- 3 微服务：三个集装箱，上面是港口调度 -->
      <rect x="984" y="500" width="128" height="16" rx="5"/>
      <rect x="984" y="530" width="34" height="28" rx="5"/>
      <rect x="1031" y="530" width="34" height="28" rx="5"/>
      <rect x="1078" y="530" width="34" height="28" rx="5"/>
      <path d="M1001 516v14M1048 516v14M1095 516v14"/>
      <path d="M1018 544h13M1065 544h13"/>
      <!-- 4 Serverless：一朵云，你只交一个函数上去 -->
      <path d="M462 560a16 16 0 0 1-3-31a22 22 0 0 1 42-12a18 18 0 0 1 30 15a14 14 0 0 1-6 28z"/>
      <path d="M495 562v4"/>
      <rect x="459" y="578" width="72" height="32" rx="6"/>
    </g>
    <g fill="#1f2328">
      <path d="M470 289l-12-7v14z"/>
      <path d="M495 578l-7-11h14z"/>
    </g>
    <text x="495" y="600" fill="#1f2328" font-size="20" text-anchor="middle">函数</text>

    <!-- 主路径箭头 -->
    <g stroke="#1f2328" stroke-width="4" stroke-linecap="round" fill="none">
      <path d="M580 276h26"/><path d="M876 376v26"/><path d="M620 524h-26"/>
    </g>
    <g fill="#1f2328">
      <path d="M622 276l-15-8v16z"/><path d="M876 422l-8-15h16z"/><path d="M578 524l15-8v16z"/>
    </g>

    <!-- 微服务的陷阱 -->
    <text x="630" y="406" fill="#c74c00" font-size="21" font-weight="700" text-anchor="middle">陷阱：拆 10 个服务却紧密耦合＝分布式单体</text>
  </g>

  <!-- 演进的实质：开发者与运维各自被减去什么 -->
  <rect x="72" y="654" width="1056" height="80" rx="18" fill="#f1f7f2" stroke="#1f2328" stroke-width="4" filter="url(#card-shadow)"/>
  <text x="88" y="684" fill="#1f2328" font-family="'Microsoft YaHei', system-ui, sans-serif" font-size="21">开发者：写脚本、手动部署 → 写所有业务逻辑 → 关注单一业务 → 只写核心函数</text>
  <text x="88" y="716" fill="#57606a" font-family="'Microsoft YaHei', system-ui, sans-serif" font-size="21">运维：维护机房与硬件 → 维护几台大服务器 → 维护 K8s 集群（很累！）→ 喝茶（云厂商全包了）</text>

  <rect x="72" y="758" width="1056" height="64" rx="18" fill="#f1f7f2" stroke="#1f883d" stroke-width="3" filter="url(#card-shadow)"/>
  <text x="600" y="798" fill="#1f2328" font-family="'Microsoft YaHei', system-ui, sans-serif" font-size="24" text-anchor="middle" font-weight="700">没有最好的架构，只有最适合的架构</text>
</svg>
