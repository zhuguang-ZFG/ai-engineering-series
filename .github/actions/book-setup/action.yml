name: Book toolchain
description: Install the locked book toolchain and optional render dependencies
inputs:
  browser:
    description: Install browser and CJK fonts for render/Full/Release checks
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      id: node-setup
      with:
        node-version: '22'
        cache: npm
    - uses: actions/setup-python@v5
      id: python-setup
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: yuyu-book/requirements.txt
    - shell: bash
      run: npm ci
    - shell: bash
      run: python -m pip install -r yuyu-book/requirements.txt
    - uses: actions/cache@v4
      id: browser-cache
      with:
        path: |
          ~/.cache/ms-playwright
          ~/AppData/Local/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('uv.lock') }}
    - uses: actions/cache@v4
      with:
        path: yuyu-book/.cache
        key: ${{ runner.os }}-mermaid-${{ hashFiles('package-lock.json', 'yuyu-book/yuyu_book/mermaid.py') }}
    - if: inputs.browser == 'true' && runner.os == 'Linux'
      uses: actions/cache@v4
      id: font-cache
      with:
        path: ~/.cache/yuyu-font-packages
        key: ${{ runner.os }}-cjk-fonts-v1
    - if: inputs.browser == 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        mkdir -p "$HOME/.cache/yuyu-font-packages/partial"
        sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
        sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Dir::Cache::archives="$HOME/.cache/yuyu-font-packages" install -y fonts-noto-cjk
        sudo chown -R "$(id -u):$(id -g)" "$HOME/.cache/yuyu-font-packages"
        python -m playwright install --with-deps chromium
    - if: inputs.browser == 'true' && runner.os != 'Linux'
      shell: bash
      run: python -m playwright install chromium
    - shell: bash
      run: |
        echo "YUYU_NPM_CACHE_HIT=${{ steps.node-setup.outputs.cache-hit }}" >> "$GITHUB_ENV"
        echo "YUYU_PYTHON_CACHE_HIT=${{ steps.python-setup.outputs.cache-hit }}" >> "$GITHUB_ENV"
        echo "YUYU_BROWSER_CACHE_HIT=${{ steps.browser-cache.outputs.cache-hit }}" >> "$GITHUB_ENV"
        echo "YUYU_FONT_CACHE_HIT=${{ steps.font-cache.outputs.cache-hit }}" >> "$GITHUB_ENV"
