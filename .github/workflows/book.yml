name: Book CI
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '**.md'
      - 'pi/**'
      - 'yuyu-book/**'
      - 'scripts/**'
      - 'tests/**'
      - 'video/**'
      - 'docs/**'
      - '.github/**'
      - '*lock*'
      - 'pyproject.toml'
      - 'package.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: book-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fast:
    name: Fast
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/book-setup
        with:
          browser: 'true'
      - run: python docs/yuyu-overhaul/check_bilingual_parity.py
      - run: python scripts/bookctl.py check --fast
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fast-reports
          path: .scratch/reports/*.json
          if-no-files-found: error
          include-hidden-files: true
  full:
    name: Full
    needs: fast
    # Fast is the only tier a pull request must pay for; rendered HTML/PDF
    # evidence is produced on main and by explicit dispatch.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/book-setup
        with:
          browser: 'true'
      - run: python scripts/bookctl.py check --full
      - run: python scripts/check_artifact_claims.py
      - run: python scripts/check_visual_layout.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-visual-layout
          path: .scratch/visual-check/*
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: yuyu-book-dist
          path: yuyu-book/dist/*
          if-no-files-found: error
  omp:
    name: Omp
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/book-setup
        with:
          browser: 'true'
      - run: |
          python omp/overhaul/audit_structure.py --check
          python omp/overhaul/audit_delivery.py
          python scripts/bookctl.py build --product omp --check --mermaid source
          python scripts/bookctl.py build --product omp --lang zh --pdf
      - uses: actions/upload-artifact@v4
        with:
          name: yuyu-omp-dist
          path: yuyu-book/dist/yuyu-omp-*
          if-no-files-found: error
  bootstrap:
    name: Bootstrap (${{ matrix.os }})
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/book-setup
        with:
          browser: 'true'
      - run: python scripts/bookctl.py doctor
      - run: python scripts/bookctl.py build --check --mermaid source
  pi:
    name: Pi
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/book-setup
        with:
          browser: 'true'
      - run: python scripts/bookctl.py build --product pi --lang zh --pdf --epub
      - uses: actions/upload-artifact@v4
        with:
          name: yuyu-pi-dist
          path: yuyu-book/dist/yuyu-pi-*
          if-no-files-found: error
