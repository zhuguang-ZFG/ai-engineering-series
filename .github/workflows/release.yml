name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Exact manifest version without v
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/book-setup
        with:
          browser: 'true'
      - name: Resolve version
        shell: bash
        run: |
          echo "RELEASE_DESTINATION=$RUNNER_TEMP/book-release" >> "$GITHUB_ENV"
          if [ -z "$RELEASE_VERSION" ]; then
            echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          fi
      - run: python scripts/bookctl.py check --full
      - run: python scripts/check_artifact_claims.py
      - name: Assemble final release
        shell: bash
        run: python scripts/release.py --version "$RELEASE_VERSION" --out-dir "$RELEASE_DESTINATION" --epub
      - name: Verify checksums
        shell: bash
        working-directory: ${{ env.RELEASE_DESTINATION }}
        run: sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: book-release-${{ github.run_id }}
          path: ${{ env.RELEASE_DESTINATION }}
          if-no-files-found: error
      - name: Publish tag assets
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" "$RELEASE_DESTINATION"/*.html "$RELEASE_DESTINATION"/*.pdf "$RELEASE_DESTINATION"/*.epub "$RELEASE_DESTINATION"/*.zip "$RELEASE_DESTINATION"/*.md "$RELEASE_DESTINATION"/*.json "$RELEASE_DESTINATION"/SHA256SUMS --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RELEASE_DESTINATION/release-notes.md"
